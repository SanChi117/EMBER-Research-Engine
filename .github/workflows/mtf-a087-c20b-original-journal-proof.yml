name: MTF A087 — Original 1H-to-5m C20B SHA Journal Proof
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a087-c20b-original-journal-proof.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a087-original-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SHA-verify every journal record and six C20B evidence files
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a087-integrity.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/a087-integrity.json'))
          assert r['events']>=87 and r['validations_pass']
          records=[json.loads(s) for s in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if s.strip()]
          assert records[85]['action_id']=='A086'
          assert records[85]['record_sha256']=='328526729c21ad677d89f4ee8ffc88eabaf156f5e86563568457c6c673145aae'
          assert records[86]['seq']==87 and records[86]['action_id']=='A087'
          assert records[86]['record_sha256']=='1c2ecc95f5bbbb891867bd38ad4584cd220ddb39dc5239828ff6d43af81caa0d'
          assert records[86]['cycle_result']=='PASSED' and len(records[86]['evidence'])==6
          print('A087_87_SHA_CHAIN_AND_ALL_6_EVIDENCE_BYTES_PASS')
          PY
      - name: Verify original C20A and newly pinned C20B Git source blobs
        run: |
          python - <<'PY'
          import subprocess
          refs={
            'research/mtf-element-audit-v1/evidence/c20/C20_ORIGINAL_5M_32DAY_LINEAGE_RESULT.json':'7fc957b210b14b8ab0380b8941a7b145def836dc',
            'research/mtf-element-audit-v1/evidence/c20/C20B_ORIGINAL_1H_5M_AGGREGATES.json':'555be0425c68749b27a72e90e3bc2943f7afab64',
            'research/mtf-course-v05/src/course_primitives_v05.py':'45cec7fd66d0ec156bc0a38225ee282c6d3ee71b'}
          for p,x in refs.items():
              assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==x
          print('C20B_PINNED_SHA_NO_HISTORICAL_MUTATION')
          PY
      - name: Re-run C20B adversarial research tests
        run: |
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c20b_closed_1h_5m_source_geometry
      - name: Independently re-download 45 source archives and compare exact C20B aggregate
        run: |
          python research/mtf-element-audit-v1/tests/probe_c20b_original_hourly_5m_breaks.py /tmp/a087-c20b.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/a087-c20b.json'))
          assert r['rows_5m']==46080 and r['hourly_source_ohlc_parities']==3840
          assert sum(x['observed_5m_price_break_candidates'] for x in r['observations'])==512
          assert r['author_approved_bos']==r['author_approved_trades']==0
          assert r['readiness']=='NOT_TRADE_READY'
          print('A087_ORIGINAL_45_ZIP_5M_CLOSE_BREAK_PINNED_REPLAY_PASS')
          PY
