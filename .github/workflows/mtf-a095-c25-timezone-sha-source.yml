name: MTF A095 — C25 Session Timezone SHA Source (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a095-c25-timezone-sha-source.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a095-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 95-event full SHA ledger and five C25 files
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a095-integrity.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a095-integrity.json'))
          assert d['events']>=95 and d['validations_pass']
          j=[json.loads(line) for line in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if line.strip()]
          assert j[93]['action_id']=='A094'
          assert j[94]['seq']==95 and j[94]['action_id']=='A095'
          assert j[94]['record_sha256']=='aa18f538a88358dc539edf1c517cadd61346312d6f8d2b0c99428fe5c3f0e9af'
          assert len(j[94]['evidence'])==5 and j[94]['cycle_result']=='PASSED'
          print('A095_FULL_95_RECORD_SHA_FIVE_C25_PRICE_FILES_PASS')
          PY
      - name: Pinned previous and current source receipts
        run: |
          python - <<'PY'
          import subprocess
          frozen={
            'research/mtf-element-audit-v1/evidence/c24/C24_ORIGINAL_3M_FAIL_CLOSED_ADMISSION.json':'163a0a41a9e5b51320e8f4baaad85cfd0be7c0a9',
            'research/mtf-element-audit-v1/evidence/c25/C25_ORIGINAL_SESSIONS_TARGET_SOURCE.json':'fe9b23672f97cdf1e50d603e7d214ecdef7a00ad'}
          for p,w in frozen.items():
              s=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert s==w,(p,s,w)
          print('A095_C24_C25_GIT_SOURCE_RECEIPTS_IMMUTABLE')
          PY
      - name: Reproduce 10 adversarial C25 DST/FTA original-source tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c25_session_freshness_target_source 2>&1 | tee /tmp/a095-unit.log
          grep -q 'Ran 10 tests' /tmp/a095-unit.log
