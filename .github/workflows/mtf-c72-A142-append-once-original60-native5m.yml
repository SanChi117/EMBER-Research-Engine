          assert p.stat().st_size==197266
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='3541b5a7f6f8fa9d16dabd28c944343b8e65e1f0055942d3c25b55ee46a22acf'
          d=json.loads(p.read_bytes());z=json.loads(w.read_bytes())
