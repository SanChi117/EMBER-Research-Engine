          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A141
          grep -Fq 'entries 141 tip_sha256 9f6e2a7bb92e9b105e446be0f0e0c6c0397359a74f25071ada0297cb099e6a9f' /tmp/A141
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence/c72/C72_ORIGINAL60ZIP_NATIVE5M_15M_PARITY_AFTER_C71_SOURCE_VC.json')
          w=Path('evidence/c72/C72_INDEPENDENT_ORIGINAL60ZIP_NATIVE5M_SOURCE_WITNESS_20261025.json')
          report=Path('cycles/B1_C72_ORIGINAL60ZIP_NATIVE5M_15M_FIRST_ANY_SOURCE_REPORT.md')
