name: EMBER C44 independent full 45ZIP bounded FTA source 98MB
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c44-independent-original-45zip-20261023.yml'
permissions:
  contents: read
jobs:
  independent_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Independent source SHA journal A113 113/113 and evidence checks
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/A113-chain.txt
          grep -Fq 'entries 113 tip_sha256 f8a397096e2199133ded9d08dc81f8112f5ea27b3b1675851c26c008568354f8' /tmp/A113-chain.txt
          python tests/test_journal_integrity.py > /tmp/A113-evidence.txt
          grep -Fq '"validations_pass": true' /tmp/A113-evidence.txt
      - name: Independent 31 causal bounds tests without skips
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c44_adapted_bounded_source_fta 2>&1 | tee /tmp/31.txt
          grep -Fq 'Ran 31 tests' /tmp/31.txt
          grep -qx 'OK' /tmp/31.txt
          ! grep -q 'skipped=' /tmp/31.txt
  original_source_second_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert frozen all prior C41 C42 and original C43 manifest and C44 complete JSON Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c41/C41_ORIGINAL_36_SOURCE_JOIN_MATRIX.json)" = "ac3bb2b2babafdb28af71c4cbaa2b53fce03b06c"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c42/C42_ORIGINAL_SOURCE_FTA_ELIGIBILITY_45ZIP.json)" = "bddf315c58a906fe58546512bc416c24bd1ce95f"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c43/C43_ORIGINAL_45ZIP_MANIFEST.json)" = "c1db4afec81cb240f981e6e0ef2211044c75e372"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c44/C44_ORIGINAL_BOUNDED_FTA_SOURCE_45ZIP.json)" = "0f8cd79824af85569ffef87bfbec808a8a2b89b3"
          python research/mtf-element-audit-v1/tools/partition_c43_source_result.py research/mtf-element-audit-v1/evidence/c43 | tee /tmp/c43-evidence-sha.txt
          grep -Fq 'C43_FIVE_PARTS_REASSEMBLE_EXACT_CANONICAL_168MB_JSON_PASS' /tmp/c43-evidence-sha.txt
      - name: Re-download all 45 original signed source USD-M ZIP and byte-compare entire new 97MB C44 JSON
        shell: bash
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          python "$R/tests/probe_c44_original_bounded_source_45zip.py" /tmp/c44-fully-independent.json > /tmp/c44-independently-recomputed.log 2>&1 || { tail -c 12000 /tmp/c44-independently-recomputed.log; exit 1; }
          cmp -s "$R/evidence/c44/C44_ORIGINAL_BOUNDED_FTA_SOURCE_45ZIP.json" /tmp/c44-fully-independent.json
          python - <<'PY'
          import json,pathlib,hashlib
          x=pathlib.Path('research/mtf-element-audit-v1/evidence/c44/C44_ORIGINAL_BOUNDED_FTA_SOURCE_45ZIP.json')
          y=pathlib.Path('/tmp/c44-fully-independent.json')
          a=json.loads(x.read_text())
          b=json.loads(y.read_text())
          assert a==b
          assert x.stat().st_size==y.stat().st_size==97764435
          assert hashlib.sha256(x.read_bytes()).hexdigest()==hashlib.sha256(y.read_bytes()).hexdigest()
          assert a['original_binance_usdm_source_zip']==45
          assert a['original_native3m_closed']==76800 and a['native15m_exact_decimal']==15360
          assert a['route_count']==36 and a['correlated_parent_contexts']==17316
          expected={
           'NT_SOURCE_MAX_24H_MAX_1PCT_ADAPTED_V1':11106,
           'NT_SOURCE_MAX_72H_MAX_3PCT_ADAPTED_V1':16578,
           'NT_72H_3PCT_PREV_CLOSED_4H_RANGE_PROXY_V1':11466,
           'NT_72H_3PCT_PREV_CLOSED_1D_RANGE_PROXY_V1':14211}
          assert a['correlated_bounded_candidate_counts']==expected
          assert a['orders']==a['trades']==a['author_poi_goldens']==a['author_fta_goldens']==0
          assert a['readiness']=='NOT_TRADE_READY'
          assert a['reference_range_not_academic_poi'] and a['research_parameters_not_course_attested']
          print('C44_INDEPENDENT_ORIGINAL_45ZIP_FULL_97764435_BYTE_EXACT_PASS')
          print('C44_CANONICAL_SOURCE_SHA256',hashlib.sha256(x.read_bytes()).hexdigest())
          PY
