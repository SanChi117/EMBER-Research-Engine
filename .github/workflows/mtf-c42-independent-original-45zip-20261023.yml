name: EMBER C42 independent all-original 45ZIP complete three-policy source
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c42-independent-original-45zip-20261023.yml'
permissions:
  contents: read
jobs:
  independent-negatives:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Full old A111 SHA record and original evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/111.txt
          grep -Fq 'entries 111 tip_sha256 eab55a801ed454f9266a80f87221e340211fcfc0d92913542f3deeca8df949c4' /tmp/111.txt
          python tests/test_journal_integrity.py | tee /tmp/evidence.txt
          grep -Fq '"validations_pass": true' /tmp/evidence.txt
      - name: Independently rerun all 25 C42 causal adverse tests
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c42_adapted_source_fta_eligibility 2>&1 | tee /tmp/negative.txt
          grep -Fq 'Ran 25 tests' /tmp/negative.txt
          grep -qx 'OK' /tmp/negative.txt
          ! grep -q 'skipped=' /tmp/negative.txt
  original-frozen-json:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable C38 C39 C40 C41 and new C42 blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c38/C38_ORIGINAL_FOUR_BOS_BY_THREE_REACTION_MATRIX.json)" = "a69d69de29d4b52a9ee68ccdf0dbcb20222a6440"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c39/C39_ORIGINAL_FOUR_BOS_BY_THREE_POTENTIAL_FTA.json)" = "15dacbe47ba2b6e133d8b97d970a96d6242cd80f"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c40/C40_ORIGINAL_PRE_BOS_PRIOR_FTA_TOUCH_STATES.json)" = "718ce971dd781b2046c530992b4c9743225ef5b7"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c41/C41_ORIGINAL_36_SOURCE_JOIN_MATRIX.json)" = "ac3bb2b2babafdb28af71c4cbaa2b53fce03b06c"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c42/C42_ORIGINAL_SOURCE_FTA_ELIGIBILITY_45ZIP.json)" = "bddf315c58a906fe58546512bc416c24bd1ce95f"
      - name: Re-fetch 45 original futures ZIP and compare all 40MB frozen C42 JSON
        shell: bash
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c42_original_fta_eligibility_45zip.py /tmp/c42-complete-independent.json > /tmp/c42-source-rerun.log 2>&1 || { tail -c 5000 /tmp/c42-source-rerun.log; exit 1; }
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('research/mtf-element-audit-v1')
          source=json.loads((base/'evidence/c42/C42_ORIGINAL_SOURCE_FTA_ELIGIBILITY_45ZIP.json').read_text())
          independent=json.loads(pathlib.Path('/tmp/c42-complete-independent.json').read_text())
          assert source==independent,'C42_FULL_45ZIP_36_ROUTE_3_POLICY_JSON_DRIFT'
          assert source['original_source_usdm_45zip']==45
          assert source['original_closed_native3m']==76800
          assert source['native15m_decimal_equalities']==15360
          assert source['route_count']==36 and source['eligibility_policy_count']==3
          assert source['parent_correlated_source_contexts']==17316
          p=source['policy_counts_across_correlated_routes']
          assert p=={
           'ANY_PREKNOWN_RESEARCH_OBSTACLE_V1':17289,
           'EXCLUDE_PRIOR_STRICT_SWEEP_OR_FULL_TRAVERSAL_V1':4422,
           'REQUIRE_NO_PRIOR_OBSERVED_TOUCH_V1':2433}
          assert source['author_source_fta_freshness_goldens']==source['orders']==source['trades']==0
          assert source['readiness']=='NOT_TRADE_READY'
          for m in source['markets']:
              assert len(m['source_routes'])==36 and m['orders']==m['trades']==0
          print('C42_INDEPENDENT_45ZIP_FULL_36_ROUTE_THREE_POLICY_JSON_EXACT_PASS')
          PY
