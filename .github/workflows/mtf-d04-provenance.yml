name: MTF D04 - Binance UM provenance independent audit

on:
  push:
    branches:
      - research/mtf-element-audit-C07-20261014
    paths:
      - '.github/workflows/mtf-d04-provenance.yml'
      - 'research/mtf-element-audit-v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  c07-authenticate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROOT: research/mtf-element-audit-v1
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen engine checksum guard
        run: |
          echo '3d430361a7654b460281e76b1cb976c2a89676388a5adeb752049550992e6d46  research/mtf-element-audit-v1/baselines/mtf_engine_v05_original.py' | sha256sum -c -
      - name: Restore proven 2026 Futures CSV and local manifest, without changing original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38480389900 --repo "$GITHUB_REPOSITORY" --name mtf-v04-usdm-20260401-20261012 --dir previous
          test "$(find previous/mtf_route/data/history -maxdepth 1 -name '*.csv' | wc -l)" -eq 10
          mkdir -p "$ROOT/baselines/d04_history_2026"
          cp previous/mtf_route/data/history/*.csv "$ROOT/baselines/d04_history_2026/"
          cp previous/mtf_route/data/history/manifest_vision.json "$ROOT/baselines/d04_history_2026/"
      - name: Full D01-D04 regression
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/run_unit_suite_c05.py 2>&1 | tee /tmp/c07-unit.log
          grep -q 'Ran 132 tests' /tmp/c07-unit.log
          grep -q '^OK$' /tmp/c07-unit.log
      - name: 200 source forgery attempts, requiring deterministic rejection
        working-directory: research/mtf-element-audit-v1
        run: |
          python tests/challenge_d04_mutations.py /tmp/c07-cloud-mutations.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/c07-cloud-mutations.json'))
          b=json.load(open('evidence/C07_MUTATION_200_PASS1.json'))
          assert a==b and a['negative_cases']==200 and a['status']=='PASS'
          PY
      - name: Offline integrity of 10 CSV, clearly not source authentication
        working-directory: research/mtf-element-audit-v1
        run: |
          python tests/verify_d04_offline_history.py /tmp/c07-cloud-offline.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/c07-cloud-offline.json'))
          b=json.load(open('evidence/C07_LOCAL_OFFLINE_RUN1.json'))
          assert a==b
          assert a['series_verified']==10 and a['total_bars']==98680
          assert a['source_authenticity']=='NOT_ATTESTED_FROM_OFFLINE_MANIFEST'
          PY
      - name: Full append-only journal and all historical proof hashes
        working-directory: research/mtf-element-audit-v1
        run: |
          python tests/test_journal_integrity.py | tee /tmp/c07-cloud-journal.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/c07-cloud-journal.json'))
          assert x['events']>=46 and x['validations_pass']
          PY
      - name: HTTPS validate 12 official Vision ZIP + CHECKSUM receipts on all 5 pairs
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tests/verify_d04_cloud_receipts.py /tmp/c07-cloud-origin.json baselines/d04_history_2026
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c07-cloud-origin.json'))
          assert r['claims']['archive_count_live_checked']==12
          assert len(r['normalized_cross_proof'])==5
          assert len(r['daily_checks'])==6
          assert all(x['aggregated_day_matches_verified_archive'] for x in r['normalized_cross_proof'].values())
          assert all(r['daily_checks'][f'{s}_2026-10-11']['match'] for s in ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BCHUSDT'])
          PY
      - name: Preserve full QA including failed step diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtf-c07-d04-source-integrity-and-https-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c07-unit.log
            /tmp/c07-cloud-mutations.json
            /tmp/c07-cloud-offline.json
            /tmp/c07-cloud-journal.json
            /tmp/c07-cloud-origin.json
