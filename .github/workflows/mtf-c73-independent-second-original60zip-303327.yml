name: EMBER C73 independent second full original60 ZIP first source 3m POI revisit 303327 bytes
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c73-independent-second-original60zip-303327.yml'
      - 'research/mtf-element-audit-v1/evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json'
permissions:
  contents: read
jobs:
  repeat_full60:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate immutable A142 and C73 whole source SHA then second COMPLETE 60 authentic same-host checksum Binance ZIP price replay
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A142
          grep -Fq 'entries 142 tip_sha256 347507f363d03a3bde2008a5690976ec3110925cc0ac514c1a6434299848059f' /tmp/A142
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c72/C72_ORIGINAL60ZIP_NATIVE5M_15M_PARITY_AFTER_C71_SOURCE_VC.json)" = 19b7e0357600b70b3f26467339a417e0f99a1302
          test "$(git rev-parse HEAD:$R/evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json)" = 65db9aeaddaa58612bb4c743227cc9d28894cc31
          python "$R/tests/probe_c73_original60zip_new1h_poi_3m_visits_semantic_split.py" /tmp/C73-independent.json >/tmp/C73-independent.log 2>&1 || { tail -c 22000 /tmp/C73-independent.log; exit 1; }
          cmp -s /tmp/C73-independent.json "$R/evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json"
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('research/mtf-element-audit-v1/evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json')
          assert p.stat().st_size==303327
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='c79892079f00952030b778985b53c2cc11bd2e05bf1ea70555d4385bd7963f6b'
          d=json.loads(p.read_bytes())
          assert d['original_zip_counts']['total']==60
          assert d['original_zip_counts']['new_native5m']==15
          assert d['original_native3m_closed']==76800 and d['original_native5m_closed']==46080
          assert d['original_native15m_closed']==d['native5m_to_native15m_original_decimal_equalities']==15360
          assert d['original_native1d_closed']==160 and d['derived_closed1h']==3840
          assert d['source_4h_C46_parent_count']==153
          assert d['original3m_new1h_poi_first_visit_source_state_totals']=={
            'NEW_1H_POI_FIRST_15M_PATTERN_REVISITED_SOURCE_POI_NOT_OWNER_VALID':3,
            'NEW_1H_POI_FIRST_15M_PATTERN_SINGLE_SOURCE_VISIT_NOT_OWNER_VALID':9,
            'NEW_1H_POI_FIRST_ANY_RAW3M_TOUCH_NO_UNAMBIGUOUS_15M_CHAIN':23,
            'NEW_1H_POI_SOURCE_NO_ORIGINAL3M_FIRST_TOUCH':71,
            'NOT_NEW_1H_POI_SOURCE_BRANCH':47}
          assert d['author_verified_original3m_first_valid_1h_poi_test']==0
          assert d['author_verified_routeA_15m_trigger_or_15m_vc_split']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          print('C73_SECOND_COMPLETE_ALL60_ORIGINAL_BINANCE_ZIP_FULL_BYTE_EQUAL',p.stat().st_size,sha)
          PY
  negatives:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independently repeat 30 strict POI first3m genuine visit and course Trigger VC ambiguity negatives
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c73_new1h_poi_original3m_visit_episodes_route_split 2>&1 | tee /tmp/C73
          grep -Fq 'Ran 30 tests' /tmp/C73
          grep -qx 'OK' /tmp/C73
