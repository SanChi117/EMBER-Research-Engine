name: MTF A069 - Verify Previous-Day MTF Causal Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a069-previous-daily-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-time-causal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 69 exact SHA-chained audit entries and all historical source proofs
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a069-proof.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/a069-proof.json'))
          assert o['events']==69 and o['validations_pass']
          records=[json.loads(l) for l in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if l.strip()]
          assert records[-1]['action_id']=='A069'
          assert records[-1]['record_sha256']=='6352d47393df58fa1d42faa3929bea29aeedde0cd2e6f5ec79de6eb3e9477130'
          assert 'remain unapproved' in records[-1]['observed_result']
          print('A001_A069_ALL_HISTORICAL_EVIDENCE_VERIFIED')
          PY
      - name: Original C08 source and academic primitives unchanged
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Rerun 29 source and 37 parent 1d/child 1h4h causal cases
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a069-legacy.txt
          grep -q 'Ran 29 tests' /tmp/a069-legacy.txt
          grep -Eq '^OK$' /tmp/a069-legacy.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_mtf_c08_aggregation_b1 test_mtf_prior_daily_asof_b1 2>&1 | tee /tmp/a069-context.txt
          grep -q 'Ran 37 tests' /tmp/a069-context.txt
          grep -Eq '^OK$' /tmp/a069-context.txt
          echo '66_TESTS_SOURCE_CLOSED_ASOF_PASS__COURSE_BIAS_UNKNOWN'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a069-native-previous-day-source-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a069-proof.json
            /tmp/a069-legacy.txt
            /tmp/a069-context.txt
