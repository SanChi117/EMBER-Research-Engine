name: EMBER OOS Portfolio WFO

on:
  workflow_dispatch:
  push:
    branches:
      - agent/implement-portfolio-wfo-tz
    paths:
      - "scripts/run_portfolio_wfo.py"
      - "tests/test_portfolio_wfo.py"
      - "docs/PORTFOLIO_WFO_OOS.md"
      - "docs/PORTFOLIO_WFO_OOS.json"
      - "docs/VALIDATION_LOG.md"
      - ".github/workflows/oos-portfolio-wfo.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_portfolio_wfo.py"
      - "tests/test_portfolio_wfo.py"
      - "docs/PORTFOLIO_WFO_OOS.md"
      - "docs/PORTFOLIO_WFO_OOS.json"
      - "docs/VALIDATION_LOG.md"
      - ".github/workflows/oos-portfolio-wfo.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: ember-oos-portfolio-wfo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-wfo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static checks and tests
        run: |
          ruff check ember/ tests/ scripts/
          pytest tests/ -v
          pytest tests/test_no_leakage.py -v
      - name: Download frozen OOS datasets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_oos
          gh run download 30842493927 \
            --repo "${{ github.repository }}" \
            --name ember-oos-4alts-validation \
            --dir frozen_oos
          for symbol in PEPEUSDT FETUSDT WIFUSDT SUIUSDT; do
            test -f "frozen_oos/data/oos_4alts/${symbol}_15m_15000.csv"
          done
      - name: Run canonical portfolio WFO
        run: |
          mkdir -p results/portfolio_wfo_oos
          python scripts/run_portfolio_wfo.py \
            --data-dir frozen_oos/data/oos_4alts \
            --out-dir results/portfolio_wfo_oos \
            --report-path results/portfolio_wfo_oos/PORTFOLIO_WFO_OOS.md \
            --symbols PEPEUSDT,FETUSDT,WIFUSDT,SUIUSDT \
            --profile high-vol-block \
            --interval 15m \
            --bars 15000 \
            --initial-equity 10000 \
            | tee results/portfolio_wfo_oos_stdout.txt
      - name: Verify recorded factual result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(
              Path("results/portfolio_wfo_oos/summary.json").read_text(encoding="utf-8")
          )
          recorded = json.loads(
              Path("docs/PORTFOLIO_WFO_OOS.json").read_text(encoding="utf-8")
          )
          assert generated["symbols"] == recorded["symbols"]
          assert generated["profile"] == recorded["profile"]
          assert generated["interval"] == recorded["interval"]
          assert generated["bars_per_symbol"] == recorded["bars_per_symbol"]
          assert generated["result"] == recorded["result"]
          assert generated["result"]["status"] == "FAIL"
          assert generated["result"]["total_trades"] == 8
          assert generated["result"]["stability_score"] == 50.0
          print("Recorded Portfolio WFO result is reproducible")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-portfolio-wfo-oos
          path: |
            results/portfolio_wfo_oos/
            results/portfolio_wfo_oos_stdout.txt
            docs/PORTFOLIO_WFO_OOS.md
            docs/PORTFOLIO_WFO_OOS.json
          if-no-files-found: warn
