name: MTF B1 C17 — Independent 1D 4H geometric source diagnostics (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c17-htf-geometric-diagnostics.yml'
      - 'research/mtf-element-audit-v1/d05/c17_htf_imb_reaction_diagnostics.py'
      - 'research/mtf-element-audit-v1/d05/test_c17_htf_imb_reaction_diagnostics.py'
      - 'research/mtf-element-audit-v1/tests/probe_c17_original_htf_geometry.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c17-c08-original-htf-geometric-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm protected prior source evidence
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json)" = 4205ad3118a30bbd69c412e165c7c5ce3560195d
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c16/C16_32DAY_NATIVE_15M_1D_RECEIPT.json)" = bdaa008ce719254507ea95231cdc630bfa85cd67
          test "$(git hash-object research/mtf-element-audit-v1/d05/C14_AUTHOR_STRONGHL_QUALITATIVE_CASES.json)" = 82a80b053712ee819ceb8d83178f672db4030462
          echo "FROZEN_SOURCE_BLOBS_MATCH"
      - name: Regress v05 and C10 through C17 including adversarial HTF tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/c17-v05.txt
          grep -q 'Ran 29 tests' /tmp/c17-v05.txt
          grep -Eq '^OK$' /tmp/c17-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness test_c12_attribution_ambiguity_gate test_c13_stronghl_bos_or_poi_source_branch test_c14_qualitative_stronghl_source_gate test_c15_closed_multi_tf_source_grid test_c16_c08_monthly_daily_htf_lineage test_c17_htf_imb_reaction_diagnostics 2>&1 | tee /tmp/c17-tests.txt
          grep -Eq '^OK$' /tmp/c17-tests.txt
          echo "C17_ALL_REGRESSION_AND_ADVERSARIAL_UNIT_PASS"
      - name: Independently re-download and validate original 30 Binance C08 ZIPs, inspect 1D 4H candidates
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c17_original_htf_geometry.py /tmp/c17-source.json 2>&1 | tee /tmp/c17-source.log
          python - <<'PY'
          import json
          q=json.load(open('/tmp/c17-source.json'))
          assert q['original_C08_sources_replayed']==30
          assert sum(a['checked_native_1d'] for a in q['observations'])==160
          assert sum(a['derived_4h'] for a in q['observations'])==960
          assert all(a['prefix_invariant'] for a in q['observations'])
          assert q['author_golden_source_status']=='AUTHOR_GOLDEN_SOURCE_UNAVAILABLE'
          assert q['ready_trades']==0 and q['readiness']=='NOT_TRADE_READY'
          print('30_NATIVE_C08_SHA_AND_C17_1D_4H_READ_ONLY_DIAGNOSTICS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-b1-c17-original-c08-htf-geometric-diagnostics
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c17-v05.txt
            /tmp/c17-tests.txt
            /tmp/c17-source.json
            /tmp/c17-source.log
