name: MTF B1 C10 F06 — Two Consecutive 5m Futures Days (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c10-f06-multi-day-5m.yml'
      - 'research/mtf-element-audit-v1/d05/c10_two_day_original_5m_context.py'
      - 'research/mtf-element-audit-v1/d05/test_c10_two_day_original_5m_context.py'
      - 'research/mtf-element-audit-v1/tests/probe_c10_2day_5symbols_source.py'
      - 'research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-days-five-original-futures-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard unchanged old Binance C08 315 and new F04 source receipts
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json)" = 4205ad3118a30bbd69c412e165c7c5ce3560195d
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f04/F04_FIVE_5M_FUTURES_2026-10-02_RECEIPTS.json)" = e5b24eb50c15fcd19fe1069d44e95a0a02edaa1c
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json)" = a5bf2105d1c611517a8d127d5e1f8cb622720162
      - name: Replay original 29 and new 19 continuous 5m day boundary tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/c10-v05.txt
          grep -q 'Ran 29 tests' /tmp/c10-v05.txt
          grep -Eq '^OK$' /tmp/c10-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context 2>&1 | tee /tmp/c10-boundary.txt
          grep -q 'Ran 19 tests' /tmp/c10-boundary.txt
          grep -Eq '^OK$' /tmp/c10-boundary.txt
      - name: Fetch 10 original Binance 5m and 10 original C08 15m ZIPs; require 960/960 OHLCV and raw source known-at
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c10_2day_5symbols_source.py /tmp/c10-original-2day.json 2>&1 | tee /tmp/c10-net.log
          python - <<'PY'
          import json
          d=json.load(open('/tmp/c10-original-2day.json'))
          assert d['original_5m_archives']==10
          assert d['original_5m_bars']==2880
          assert d['original_15m_c08_ohlcv_equal_groups']==960
          assert d['complete_1h_bars']==240
          assert d['approved_trades']==0 and d['readiness']=='NOT_TRADE_READY'
          assert d['unchanged_original_315_c08_archive_set'] is True
          assert all(all(r['c08_original_15m_groups_checked']==96 for r in s['original_days']) for s in d['results'])
          print('10_ORIGINAL_5M_VS_10_C08_NATIVE_15M_PARITY_960_960__NO_ACADEMIC_READY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-c10-f06-ten-native-5m-futures-zip-source-checks
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c10-v05.txt
            /tmp/c10-boundary.txt
            /tmp/c10-original-2day.json
            /tmp/c10-net.log
