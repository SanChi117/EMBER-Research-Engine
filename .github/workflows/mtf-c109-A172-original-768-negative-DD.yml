          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m "A172 C109 simple 4H swing BOS core +10.75R but DD10.52% historical gate FAIL, 768 original Binance ZIP"
