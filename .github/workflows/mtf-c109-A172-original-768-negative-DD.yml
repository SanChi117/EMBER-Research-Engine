name: EMBER C109 A172 freeze 768 original source improved core BUT risk gate fails
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c109-A172-original-768-negative-DD.yml'
permissions:
  contents: write
jobs:
  independent-source-admit-A172:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify A171 chain + 768 source exact frozen B0 and B1 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/c109-a171
          grep -Fq 'entries 171 tip_sha256 908f96d82a47c06331e44d9a0d53913d58fb0fcc381137f0c03801ebe98fbff8' /tmp/c109-a171
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence/c109/C109_CORE_VS_ORIGINAL_768_3M_PROVIDER_ZIPS.json')
          raw=p.read_bytes()
          assert len(raw)==737881 and hashlib.sha256(raw).hexdigest()=='d8e4a39b5de6176227cd5e8fd6103278d6e032335341f8f098f930bdad305134'
          x=json.loads(raw)
          assert x['source_zip_count']==768 and x['native3m_bars']==368640
          assert len({(y['symbol'],y['date']) for y in x['source_manifest']})==768
          assert x['new_luxalgo_indicators']==0 and x['orders']==x['fills']==x['live_trades']==[]
          a=list(x['arms'].values())
          assert len(a)==2
          old=next(y for name,y in x['arms'].items() if name.startswith('B0_'))
          core=next(y for name,y in x['arms'].items() if name.startswith('B1_'))
          assert old['scores']['25']['n']==54 and old['scores']['25']['sum_r']==-0.546001
          assert core['scores']['25']['n']==55 and core['scores']['25']['sum_r']==10.749521
          assert core['scores']['25']['pf']==1.30903 and core['scores']['40']['sum_r']==5.683805
          assert core['scores']['25']['dd_1pct_risk_pct']==10.51646
          assert core['folds']['early']['25']['sum_r']==-4.559101
          assert core['folds']['late']['25']['sum_r']==15.308622
          assert not old['admission']['passes_historical_screen']
          assert not core['admission']['passes_historical_screen']
          assert core['admission']['reasons']==['MODELED_DD25_NOT_LT_10PCT']
          assert all(t['stop_source_tf']==t['target_source_tf']=='4H' for t in core['trades'])
          print('C109_FROZEN_B0_B1_PROVIDER_768_TRUE_NEGATIVE_DD_GATE_SHA_SUCCESS')
          PY
