name: MTF A090 — C21B Original 60ZIP and 90 SHA Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a090-c21b-60zip-sha-journal-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal-and-original-60-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify complete rolling 90 record SHA journal and all six new source files
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a090-sha.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/a090-sha.json'))
          assert j['events']>=90 and j['validations_pass']
          lines=[json.loads(s) for s in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if s.strip()]
          assert lines[88]['action_id']=='A089'
          assert lines[88]['record_sha256']=='388d6da3b396a34188c3d86ff358ed49b4de5dce3c8527575abab3f6479452d2'
          assert lines[89]['action_id']=='A090' and lines[89]['seq']==90
          assert lines[89]['record_sha256']=='d904182fb4de03a18d84412031ae37197ba3ccde3715b1220a4de4b09bef2c64'
          assert lines[89]['cycle_result']=='PASSED' and len(lines[89]['evidence'])==6
          print('A090_COMPLETE_90_SHA_LINKS_PLUS_SIX_ORIGINAL_SOURCE_RECEIPTS_PASS')
          PY
      - name: Prove unchanged source original v05 C08 5m 3m and pinned C21B Git blob
        run: |
          python - <<'PY'
          import subprocess
          refs={
           'research/mtf-course-v05/src/course_primitives_v05.py':'45cec7fd66d0ec156bc0a38225ee282c6d3ee71b',
           'research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json':'4205ad3118a30bbd69c412e165c7c5ce3560195d',
           'research/mtf-element-audit-v1/evidence/c20/C20_ORIGINAL_5M_32DAY_LINEAGE_RESULT.json':'7fc957b210b14b8ab0380b8941a7b145def836dc',
           'research/mtf-element-audit-v1/evidence/c20/C20B_ORIGINAL_1H_5M_AGGREGATES.json':'555be0425c68749b27a72e90e3bc2943f7afab64',
           'research/mtf-element-audit-v1/evidence/c21/C21A_NATIVE3M_C08_PARITY_RECEIPT.json':'02949d457e63bb367bbb99ae087e3306d1e68557',
           'research/mtf-element-audit-v1/evidence/c21/C21B_ORIGINAL_3M_VS_5M_REPLAY_RECEIPT.json':'a9a121cb41477b105dd13a1228b5d0577ac3abda'}
          for p,x in refs.items():
              assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==x,(p,x)
          print('C21B_ALL_ORIGINAL_SOURCE_AND_NEW_RECEIPT_PINNED')
          PY
      - name: Independently test fifteen C21B positive/negative source cases
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c21b_native_3m_vs_5m 2>&1 | tee /tmp/a090-unit.txt
          grep -q 'Ran 15 tests' /tmp/a090-unit.txt
      - name: Redownload all 60 Futures original 3m 5m 15m 1d ZIP and compare pinned parents
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c21b_original_3m_vs_5m_60zip.py /tmp/a090-source.json 2>&1 | tee /tmp/a090-source.log
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a090-source.json'))
          assert x['original_total_zip']==60 and x['original_native3m_bars']==76800
          assert x['original_native5m_bars']==46080
          assert x['source_native15m_parities_3m']==15360
          assert x['source_native15m_parities_5m']==15360
          assert x['hourly_source_equivalent']==3840
          t=x['totals']
          assert t['native3m_cand_edges']==539 and t['native5m_cand_edges']==512
          assert t['same_parent_with_both']==509
          assert t['only_3m_parent']==30 and t['only_5m_parent']==3
          assert t['earliest_3m_before_5m']==385 and t['earliest_5m_before_3m']==91
          assert t['simultaneous_close']==33
          assert x['readiness']=='NOT_TRADE_READY' and x['author_approved_trades']==0
          print('A090_C21B_ORIGINAL_3M_VS_5M_60ZIP_CONTRADICTIONS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a090-90sha-60originalzip
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a090-sha.json
            /tmp/a090-unit.txt
            /tmp/a090-source.json
            /tmp/a090-source.log
