name: EMBER C68 second original45 ZIP exact 238542 bytes source StrongHL
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c68-independent-original45zip-238542byte.yml'
      - 'research/mtf-element-audit-v1/evidence/c68/C68_ORIGINAL45ZIP_STRONGHL_POST_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh re-download all 45 original signed Binance USD-M ZIP, compare exact 238542 source bytes against first replay
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A137
          grep -Fq 'entries 137 tip_sha256 f54fc6edba0324df7dfd08e51bd1efa78b1674fb33d4cf21d3fc96ad83f9ccab' /tmp/A137
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c67/C67_ORIGINAL45ZIP_ROUTE_A_1H_TRIGGER_NEW_POI_15M_FIRST_RETEST_FORK.json)" = 87409101a6fad4897b32e13085c9a0cc13566594
          test "$(git rev-parse HEAD:$R/evidence/c68/C68_ORIGINAL45ZIP_STRONGHL_POST_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json)" = 587779a7dd1736099e8270c8823c15822f0e77a0
          python "$R/tests/probe_c68_original45zip_stronghl_contact_confirmation_source.py" /tmp/C68-second.json >/tmp/c68-second.log 2>&1 || { tail -c 17000 /tmp/c68-second.log; exit 1; }
          cmp -s /tmp/C68-second.json "$R/evidence/c68/C68_ORIGINAL45ZIP_STRONGHL_POST_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('research/mtf-element-audit-v1/evidence/c68/C68_ORIGINAL45ZIP_STRONGHL_POST_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json')
          assert p.stat().st_size==238542
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='ee8b9471ff9f6c53e747f423673d64fa9c76a647fe731c686d108bd4891d296f'
          d=json.loads(p.read_bytes())
          assert d['original_zip_counts']['total']==45
          assert d['original_native3m_closed']==76800 and d['original_native15m_closed']==15360
          assert d['original_native1d_closed']==160 and d['derived_closed1h']==3840
          assert d['source_4h_C46_parent_count']==153
          assert d['source_extreme_post_contact_first_any_state_totals']=={
            '1H_IMB_TRIGGER_CREATION_NOT_A_LIQUIDITY_OR_POI_TEST':0,
            'CONTACT_SOURCE_BAR_UNAVAILABLE':0,
            'FIRST_ANY_SOURCE_CONFIRMATION_BOTH_SIDES_AMBIGUOUS':0,
            'FIRST_ANY_SOURCE_CONFIRMATION_OPPOSITE_SIDE':34,
            'NO_C67_SINGLE_SOURCE_CONTACT':92,
            'NO_POST_CONTACT_SOURCE_CONFIRMATION_FULL_WINDOW':0,
            'NO_POST_CONTACT_SOURCE_CONFIRMATION_RIGHT_CENSORED':1,
            'SOURCE_ANCHOR_BREACHED_BEFORE_CONFIRMATION_CLOSED':11,
            'SOURCE_EXTREME_WITH_POST_CONTACT_CONFIRMATION_NOT_AUTHOR':15}
          assert d['owner_crypto_labeled_positive_goldens']==0
          assert d['author_verified_VC']==d['author_verified_BOS']==0
          assert d['author_verified_StrongHL']==d['author_verified_OF']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          print('C68_SECOND_ORIGINAL45_BYTE_EXACT_SHA',p.stat().st_size,sha)
          PY
  negative33:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 33 strict StrongHL source-only 15m-1h chronology adversarial guards
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c68_stronghl_post_contact_vc_bos_source 2>&1 | tee /tmp/c68
          grep -Fq 'Ran 33 tests' /tmp/c68
          grep -qx 'OK' /tmp/c68
