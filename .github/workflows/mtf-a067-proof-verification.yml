name: MTF A067 - Verify Source-Defined IMB Level Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a067-proof-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-no-hindsight-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all 67 previous records and exact SHA of immutable evidence
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a067-proof.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/a067-proof.json'))
          assert q['events']==67 and q['validations_pass']
          j=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert j[-1]['action_id']=='A067'
          assert j[-1]['record_sha256']=='dde8370fbeedfad5554fec23106e2f0ab2607cbc765d57aa94199d2123188f3a'
          assert 'not a fully validated academic POI' in j[-1]['observed_result']
          print('A001_A067_FULL_EVIDENCE_AND_SOURCE_BOUNDARIES_VERIFIED')
          PY
      - name: Guard unchanged academic-v05 source and original C08 BTC receipt
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Repeat 64 source, complete-prefix and IMB tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a067-v05.txt
          grep -q 'Ran 29 tests' /tmp/a067-v05.txt
          grep -Eq '^OK$' /tmp/a067-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_poi_complete_prefix_reaction_b1 test_source_imb_prefix_b1 2>&1 | tee /tmp/a067-new.txt
          grep -q 'Ran 35 tests' /tmp/a067-new.txt
          grep -Eq '^OK$' /tmp/a067-new.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a067-immutable-source-imb-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a067-proof.json
            /tmp/a067-v05.txt
            /tmp/a067-new.txt
