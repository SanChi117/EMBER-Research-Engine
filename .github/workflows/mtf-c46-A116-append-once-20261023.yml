name: EMBER C46 append-once A116 original 4H IMB source SHA acceptance
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c46-A116-append-once-20261023.yml'
permissions:
  contents: write
jobs:
  append_a116:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently verify previous A115 115 SHA and original C46 45ZIP 293203 bytes
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/A115.txt
          grep -Fq 'entries 115 tip_sha256 928d427390b7d81a47f61c97221132609ab804c8a5c07e8696ff00bb3b0bed37' /tmp/A115.txt
          python tests/test_journal_integrity.py | tee /tmp/A115evidence.txt
          grep -Fq '"validations_pass": true' /tmp/A115evidence.txt
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json)" = "dc03c181912ffbb800bc191fbc16ec0d05c335e0"
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json")
          assert len(p.read_bytes())==293203
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="fad6a04944ea2d0758fb86bacfd8bb49fe5988674f88abb0d7143f002d50aa42"
          x=json.loads(p.read_text())
          assert x['original_binance_USDM_zip']==45
          assert x['original_native3m_closed']==76800
          assert x['native15m_decimal_equalities']==15360
          assert x['source_candidate_4h_IMB_count']==153
          assert x['first_observed_source_3m_contact_count']==132
          assert x['source_no_contact_count']==21
          assert x['author_course_4h_poi_goldens']==x['author_first_test_goldens']==x['trades']==x['orders']==0
          assert x['readiness']=='NOT_TRADE_READY'
          PY
          cd d05
          python -m unittest -v test_c46_original_4h_classic_imb_first_contact 2>&1 | tee /tmp/C46neg.txt
          grep -Fq 'Ran 25 tests' /tmp/C46neg.txt
          grep -qx 'OK' /tmp/C46neg.txt
      - name: Append exactly one A116 six complete C46 original source proof SHA records
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py record \
            --action-id A116 \
            --cycle B1/C46 \
            --planned 'Recover original native3m-built strictly closed 4H 3-candle classic IMB source zones and chronologically first post-known native3m wick contacts as technically witnessed potential POI sources distinct from unknown academic author POI/test/VC' \
            --executed 'Independent new 4H native 80 original3m source bars, 3 fully closed 4H classic IMB source detection preserving triple source original3m row ID lineage and source known-at, original 3m complete prefix first touch observer, 25 adverse tests on each Python 3.10 3.11 3.12, entire 45 Binance USD-M original signed ZIP re-download 76800 3m and 15360 15m original exact. First CI 40014056526 PASS frozen 293203-byte full JSON, independently CI 40014261187 PASS 4/4 jobs full exact byte JSON and negative tests.' \
            --result '153 ORIGINAL SOURCE-GEOMETRY 4H 3-candle IMB zones across 5 markets, 132 first original3m source contacts after zone known, 21 source zones with no observed first contact. Zero course certified 4H POI or first test, zero VC, no trades/orders/PnL, source only NOT_TRADE_READY.' \
            --verdict DONE \
            --cycle-result PASSED \
            --countercheck 'Predecessor A115 tip 928d427390b7d81a47f61c97221132609ab804c8a5c07e8696ff00bb3b0bed37 unchanged; C45 original source semantic gap and 9 real Drive lessons immutable. C46 independent 25 adverse source tests ×3 Python CI 40013838561 PASS; first original45ZIP freeze CI 40014056526 PASS; independent source re-download of entire 45ZIP and exact full original 293203-byte source JSON CI 40014261187 PASS 4/4; Git blob dc03c181912ffbb800bc191fbc16ec0d05c335e0, SHA256 fad6a04944ea2d0758fb86bacfd8bb49fe5988674f88abb0d7143f002d50aa42. These are original4H classic IMB source candidates, NOT course certified POI or academic setup and do NOT prove positive expectancy.' \
            --evidence d05/c46_original_4h_classic_imb_first_contact.py \
            --evidence d05/test_c46_original_4h_classic_imb_first_contact.py \
            --evidence tests/probe_c46_original_4h_imb_first_touch_45zip.py \
            --evidence evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json \
            --evidence evidence/c46/C46_INDEPENDENT_ORIGINAL_4H_SOURCE_WITNESS_20261023.json \
            --evidence cycles/B1_C46_ORIGINAL_4H_IMB_FIRST_CONTACT_SOURCE_REPORT.md
          python tools/auditlog.py verify | tee /tmp/A116.txt
          grep -Fq 'entries 116' /tmp/A116.txt
          python tests/test_journal_integrity.py | tee /tmp/A116evidence.txt
          grep -Fq '"validations_pass": true' /tmp/A116evidence.txt
      - name: Commit ONLY A116 append-only journal, fetch/rebase safely without overwrite
        shell: bash
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 1
          grep -Fxq 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl' /tmp/changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m 'audit(C46): append-once A116 six native4H original45ZIP source SHA proofs'
          git fetch origin research/academic-engine-recovery-20261015
          git rebase origin/research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
