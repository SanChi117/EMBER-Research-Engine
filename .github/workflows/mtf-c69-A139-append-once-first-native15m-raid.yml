          assert z['source_totals']==expected and z['first_full_original_source_sha256']==sha
          assert z['first_full_original_source_bytes']==214806
          assert z['original_binance_usdm_45signed_zip_first_ci']==40222498858
          assert z['independent_second_complete_45signed_zip_ci']==40222632285
          assert z['second_complete_original_source_byte_exact'] is True
          assert z['negative_tests_per_Python']==30
          assert d['author_verified_first_new1h_poi_valid_test']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          print('C69_SOURCE_45_ZIP_TWO_FULL_BYTES_WITNESS_30x3_ACCEPTED')
