            --planned 'Preserve owner original Route A split: 4H author POI first valid test -> 1H SSL BSL or eligible IMB Trigger -> 15m VC IMB SNR; absent 1H trigger or 4H liquidity raid -> 1H VC RB/SNR/IMB new1H POI -> first owner valid POI test -> 15m trigger plus 5m VC or 15m VC without trigger. StrongHL only from liquidity or inefficiency contact then actual owner VC POI or BOS. After original C70 3m first wick with exact original15m source 5-to-1 Decimal parity AND original1h fully closed, allow only first ANY future whole 15m IMB/SNR or 1h source BOS pattern; never backdate 1H trigger, promote source proxy to real owner VC BOS, mix Route B IDM/C raid BOS, or issue trades.' \
