name: MTF C31 — Independent 45 ZIP BOS Entry Ambiguity + Python Matrix
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c31-independent-original-source-matrix.yml'
      - 'research/mtf-element-audit-v1/evidence/c31/C31_ORIGINAL_BOS_CROSS_VS_CLOSE_SOURCE.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-c31-independent-original-source
  cancel-in-progress: false
jobs:
  negative-python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independently verify prior A100 100 SHA and old bytes
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/c31-prior.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c31-prior.json'))
          assert r['events']==100 and r['validations_pass']
          assert r['tip_sha256']=='c45d5460376793f13ba17381b9d9da3fa6eb2226fc6824b9eecfbcdc750e7404'
          print('C31_PRIOR_100_SOURCE_SHA_BYTE_REPRODUCIBLE')
          PY
      - name: Run 17 fail-closed BOS crossing-vs-close source controls
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c31_bos_entry_semantic_disagreement 2>&1 | tee /tmp/c31-negative.log
          grep -q 'Ran 17 tests' /tmp/c31-negative.log
  independent-45zip:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce original 45 ZIP C26-C31 Git blob identity
        run: |
          python - <<'PY'
          import subprocess
          pins={
            'research/mtf-element-audit-v1/evidence/c26/C26_UNSWEPT_1H_FTA_ORIGINAL_SOURCE.json':'11edbf5ddf8e89e513fc3893e807903bbf8933eb',
            'research/mtf-element-audit-v1/evidence/c27/C27_ORIGINAL_1H_EQ_SESSION_SOURCE.json':'d434ae830858fecf5e45cf7ef8ff7db1e627d489',
            'research/mtf-element-audit-v1/evidence/c28/C28_ORIGINAL_1H_CLASSIC_IMB_FTA_SOURCE.json':'ed3aca9384c8e49d07220f04b7d363df92689317',
            'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json':'abd68cb7cb86087c83423d16e9bbdd2cb344224c',
            'research/mtf-element-audit-v1/evidence/c30/C30_ORIGINAL_PRIOR_WICK_IMB_CAUSAL_SOURCE.json':'ff57e0d99b5a87d74a2bfab0eed99cee32206812',
            'research/mtf-element-audit-v1/evidence/c31/C31_ORIGINAL_BOS_CROSS_VS_CLOSE_SOURCE.json':'38276d6d8a77942101a041d3605d72f69a7845d1'}
          for p,w in pins.items():
              got=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert got==w,(p,got,w)
          print('C31_PINNED_OLD_AND_NEW_ORIGINAL_SHA_PASS')
          PY
      - name: Independently reload all 45 original futures ZIP and match complete C31 JSON
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c31_original_bos_first_wick_vs_close.py /tmp/c31-independent.json 2>&1 | tee /tmp/c31-independent.log
          python - <<'PY'
          import json
          a=json.load(open('research/mtf-element-audit-v1/evidence/c31/C31_ORIGINAL_BOS_CROSS_VS_CLOSE_SOURCE.json'))
          b=json.load(open('/tmp/c31-independent.json'))
          assert a==b,'C31_INDEPENDENT_COMPLETE_539_EDGE_JSON_DRIFT'
          assert a['source_original_zip_count']==45 and a['source_original3m_bars']==76800
          assert a['original_native15m_exact_decimal_equalities']==15360
          t=a['totals']
          assert t['strict_closed_3m_research_edges']==539
          assert t['research_single_case_count']==165
          assert t['edges_with_prior_strict_wick_cross']==122
          assert t['prior_strict_wick_cross_observations']==142
          assert t['edges_with_prior_wick_without_close_confirmation']==122
          assert t['edges_with_prior_closed_beyond_selected_swing']==0
          assert t['break_at_raid_confirmation_hour_count']==83
          assert t['break_later_than_3h_after_raid_confirmation']==2
          assert a['author_confirmed_3m_BOS']==a['author_selected_pivot_goldens']==0
          assert a['author_trade_approved']==a['author_live_execution_model_approved']==0
          assert a['readiness']=='NOT_TRADE_READY'
          print('C31_INDEPENDENT_ORIGINAL_45ZIP_ALL_JSON_WICK_VS_CLOSE_REPRODUCIBLE')
          PY
  independent-source-proof:
    needs: [negative-python-matrix,independent-45zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Freeze independent original full-source and 3 Python matrix proof
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c31/C31_INDEPENDENT_RUN_WITNESS.json
          if test -e "$p"; then echo 'already frozen'; exit 0; fi
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/mtf-element-audit-v1/evidence/c31/C31_INDEPENDENT_RUN_WITNESS.json')
          p.write_text(json.dumps({
            'schema':'EMBER_C31_BOS_ORIGINAL_45ZIP_CROSS_VS_CLOSE_MATRIX_V1',
            'run_id':int(os.environ['RUN_ID']),
            'trigger_sha':os.environ['HEAD_SHA'],
            'original_receipt_git_blob':'38276d6d8a77942101a041d3605d72f69a7845d1',
            'fully_reread_original_zip':45,
            'source_native3m_bars':76800,
            'full_539_cases_json_equal':True,
            'negative_tests_per_python':17,
            'python_versions':['3.10','3.11','3.12'],
            'earlier_wick_only_proxy_events':122,
            'author_instructor_goldens':0,
            'trade_approvals':0,'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(C31): exact original 45 ZIP BOS crossing vs close independent 3-python witness"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
