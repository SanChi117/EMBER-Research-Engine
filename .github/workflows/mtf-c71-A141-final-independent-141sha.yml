name: EMBER C71 independent final 141 SHA six original crypto 45 ZIP Route A source x3
on:
  workflow_dispatch:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c71-A141-final-independent-141sha.yml'
permissions:
  contents: read
jobs:
  sha141:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e0382c90d0ac58b87f1ab121d6cfeb363865217
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independent verify full 141 SHA, six C71 signed source receipts, all previous C46-C70 frozen Git blobs, 30x3 semantic chronology
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/A141
          grep -Fq 'entries 141 tip_sha256 9f6e2a7bb92e9b105e446be0f0e0c6c0397359a74f25071ada0297cb099e6a9f' /tmp/A141
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          ledger=[json.loads(x) for x in Path('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text().splitlines()]
          assert len(ledger)==141
          old,new=ledger[-2:]
          assert old['action_id']=='A140' and old['record_sha256']=='f799fa6b65ae8044971fa95e355fca9c8e228e2dbf90cd3108081b39ab6d21bb'
          assert new['action_id']=='A141' and new['seq']==141 and new['prev_sha256']==old['record_sha256']
          assert new['record_sha256']=='9f6e2a7bb92e9b105e446be0f0e0c6c0397359a74f25071ada0297cb099e6a9f'
          assert new['cycle']=='B1/C71' and new['verdict']=='DONE' and new['cycle_result']=='PASSED'
          six={"d05/c71_post_contact_closed_15m_vc_1h_bos_semantic_gate.py":"8d9e332502367429f7b9a4653fde235eb7170e0e45d76eb7198739b60a973fc7","d05/test_c71_post_contact_closed_15m_vc_1h_bos_semantic_gate.py":"bd0d82e9b5e9fcbf21bd1272de90c6bb76895a60c77a54475b9d770d2530f395","tests/probe_c71_original45zip_after_first3m_contact_vc_bos.py":"329222e3e10816ad387632a920eb95f6730e60b8d55e814b5bd0ab4378ddf025","evidence/c71/C71_ORIGINAL45ZIP_3M_CONTACT_THEN_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json":"b02777bc871e6471d349989179da3452df6a185c4db805cf5b6071e5a377b253","evidence/c71/C71_INDEPENDENT_ORIGINAL45ZIP_POST3M_15M_VC_1H_BOS_WITNESS_20261025.json":"aa51012078d658bb7b2d1a3a9a0d8afdf8865e6b9c606e4d8f2ca2b09ca6c5b6","cycles/B1_C71_POST_ACTUAL3M_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE_REPORT.md":"1e0466ef2d0b51a1e874411f3778be7b633d5a7de17c479b4f44c99c0ef40875"}
          assert len(new['evidence'])==6 and {e['path'] for e in new['evidence']}==set(six)
          for e in new['evidence']:
            raw=Path(e['path']).read_bytes()
            assert len(raw)==e['bytes'] and hashlib.sha256(raw).hexdigest()==e['sha256']==six[e['path']]
          previous={"evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json":"dc03c181912ffbb800bc191fbc16ec0d05c335e0","evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json":"899373e4a1dc1999d1485ac8c1f790d39071aebd","evidence/c62/C62_ORIGINAL_45ZIP_1H_SNR_RB_MB_IMB_LIQUIDITY_COMPLETE_SOURCE.json":"8428bf7d6cd3bc26f617cfc32a34c91a27c813b2","evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json":"fdc77c7ec942f03b4efae83b935d994c8435a24f","evidence/c66/C66_ORIGINAL45ZIP_4H1H_TO_NATIVE15M_SOURCE_FIRST_ANY_ROUTE_A.json":"c693058cdb28b0e118879d32ddcbbd0d2a66bfc6","evidence/c67/C67_ORIGINAL45ZIP_ROUTE_A_1H_TRIGGER_NEW_POI_15M_FIRST_RETEST_FORK.json":"87409101a6fad4897b32e13085c9a0cc13566594","evidence/c68/C68_ORIGINAL45ZIP_STRONGHL_POST_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json":"587779a7dd1736099e8270c8823c15822f0e77a0","evidence/c69/C69_ORIGINAL45ZIP_FIRST_NATIVE15M_LIQUIDITY_RAID_OR_NEW1H_POI_SOURCE_TEST.json":"b22860dfa13e4b19d16e8dd892719a772485e847","evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json":"e100ca8a70a32484fd311ae2dcf31a311d85865c","evidence/c71/C71_ORIGINAL45ZIP_3M_CONTACT_THEN_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json":"ef05ecdcfb31e59dec79d10eb5d3dc40b3c3af97"}
          for path,blob in previous.items():
            assert subprocess.check_output(['git','rev-parse','HEAD:research/mtf-element-audit-v1/'+path],text=True).strip()==blob
          p=Path('evidence/c71/C71_ORIGINAL45ZIP_3M_CONTACT_THEN_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json')
          assert p.stat().st_size==264632
          d=json.loads(p.read_bytes())
          assert d['original_zip_counts']['total']==45
          assert d['original_native3m_closed']==76800 and d['original_native15m_closed']==15360
          assert d['original_native1d_closed']==160 and d['derived_closed1h']==3840
          assert d['source_4h_C46_parent_count']==153
          assert d['post_actual_3m_contact_source15m_or_1h_first_any_state_totals']=={
            'FIRST_ANY_15M_IMB_ALIGNED_NOT_AUTHOR_VC':8,
            'FIRST_ANY_15M_SNR_ALIGNED_NOT_AUTHOR_VC':3,
            'FIRST_ANY_1H_BOS_PROXY_NOT_AUTHOR_VC_OR_BOS':0,
            'FIRST_ANY_NEW1H_POI_15M_IMB_TRIGGER_VS_VC_UNRESOLVED':6,
            'FIRST_ANY_NEW1H_POI_15M_SNR_TRIGGER_VS_VC_UNRESOLVED':6,
            'FIRST_ANY_SOURCE_OPPOSITE_DIRECTION':32,
            'FIRST_ANY_SOURCE_SAME_TIME_15M_AND_1H_BOS_AMBIGUOUS':0,
            'FIRST_ANY_SOURCE_SAME_TIME_MULTIPLE_15M_KINDS_AMBIGUOUS':2,
            'FIRST_ANY_SOURCE_TWO_DIRECTIONS_AMBIGUOUS':0,
            'NO_FIRST_ANY_SOURCE_POST_GATE_FULL_WINDOW':0,
            'NO_FIRST_ANY_SOURCE_POST_GATE_RIGHT_CENSORED':1,
            'NO_UNAMBIGUOUS_ORIGINAL3M_CONTACT':95}
          assert d['author_verified_routeA_15m_vc_or_bos']==0
          assert d['author_verified_new1h_poi_first_valid_test']==0 and d['author_verified_5m_vc']==0
          assert d['author_verified_StrongHL']==0 and d['author_verified_OF']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          print('C71_A141_INDEPENDENT_FINAL_141_SHA_ALL_PREVIOUS_ORIGINAL_CRYPTO_SOURCE_BLOBS_PASS')
          PY
          cd d05
          python -m unittest -v test_c71_post_contact_closed_15m_vc_1h_bos_semantic_gate 2>&1 | tee /tmp/C71
          grep -Fq 'Ran 30 tests' /tmp/C71
          grep -qx 'OK' /tmp/C71
          ! grep -q 'skipped=' /tmp/C71
