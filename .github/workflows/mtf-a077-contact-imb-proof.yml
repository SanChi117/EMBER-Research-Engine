name: MTF A077 — Verify StrongHL Price-Witness Evidence Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a077-contact-imb-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-futures-77-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full 77-entry original evidence SHA chain and attached byte hashes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a077-evidence.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/a077-evidence.json'))
          assert q['events']==77 and q['validations_pass']
          events=[json.loads(l) for l in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if l.strip()]
          assert events[-1]['action_id']=='A077'
          assert events[-1]['record_sha256']=='620b231e88e41b705154229c4fb0508ee1c786d1691716440d50adcd01fd6495'
          assert '0 approved StrongHL' in events[-1]['observed_result']
          print('A001_A077_SOURCE_PROOF_CHAIN_AND_SCIENTIFIC_FALSIFICATION_VALID')
          PY
      - name: Guard original v05, original F06 and original C11 results unchanged
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json)" = a5bf2105d1c611517a8d127d5e1f8cb622720162
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c11/C11_F06_SOURCE_PRICE_CANDIDATE_DIAGNOSTICS.json)" = 513c950c311efc12fab95ce64f4ac47f0f6003f3
      - name: Independent 29 course v05 plus 19 two-day and 20 new geometry tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a077-v05.txt
          grep -q 'Ran 29 tests' /tmp/a077-v05.txt
          grep -Eq '^OK$' /tmp/a077-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness 2>&1 | tee /tmp/a077-price.txt
          grep -q 'Ran 39 tests' /tmp/a077-price.txt
          grep -Eq '^OK$' /tmp/a077-price.txt
          echo '77_COMPLETE_SHA_EVIDENCE_RECORDS_AND_68_TESTS_PASS_0_AUTHOR_SIGNAL'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a077-source-contact-imb-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a077-evidence.json
            /tmp/a077-v05.txt
            /tmp/a077-price.txt
