name: MTF A079 — Verify Original StrongHL BOS-or-POI Source Proof Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a079-stronghl-two-path-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-79-records:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently verify A001–A079 source evidence SHA-chain and all file bytes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a079-proof.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/a079-proof.json'))
          assert q['events']==79 and q['validations_pass']
          arr=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert arr[-1]['action_id']=='A079'
          assert arr[-1]['record_sha256']=='e5b812cd5f659caffb00e1d466c3349b3df54edbaac4ac323b9e17b35b6b6ced'
          assert 'ready trades=0' in arr[-1]['observed_result']
          print('A001_A079_ALL_ORIGINAL_SHA_EVIDENCE_PROOF_CHAIN_PASS')
          PY
      - name: Immutable source-v05, original F06 and C12/C13 price graph receipts
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json)" = a5bf2105d1c611517a8d127d5e1f8cb622720162
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c12/C12_CAUSAL_AMBIGUITY_F06_DIAGNOSTIC.json)" = a18e62776584ad428ad74c254d864c59dd540984
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c13/C13_DUAL_SOURCE_BOS_POI_DIAGNOSTICS.json)" = c699926be9f2550b6ecdc6a371de3b63c38d325d
      - name: Repeat original 29 and C10/C11/C12/C13 86 adversarial price-path tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a079-v05.txt
          grep -q 'Ran 29 tests' /tmp/a079-v05.txt
          grep -Eq '^OK$' /tmp/a079-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness test_c12_attribution_ambiguity_gate test_c13_stronghl_bos_or_poi_source_branch 2>&1 | tee /tmp/a079-two-path.txt
          grep -q 'Ran 86 tests' /tmp/a079-two-path.txt
          grep -Eq '^OK$' /tmp/a079-two-path.txt
          echo '79_ORIGINAL_PROOFS_AND_115_PRICE_SOURCE_PATH_TESTS_PASS_ZERO_AUTHOR_STRONGHL'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a079-original-stronghl-poi-or-bos-sha-chain
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a079-proof.json
            /tmp/a079-v05.txt
            /tmp/a079-two-path.txt
