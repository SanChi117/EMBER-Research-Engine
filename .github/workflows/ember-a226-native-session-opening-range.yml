name: A226 Genuine USD-M Session Range Research Smoke

on:
  push:
    branches:
      - 'research/a226-session-opening-range-native-futures-screen-20261031'
    paths:
      - 'research/a226_session/**'
      - '.github/workflows/ember-a226-native-session-opening-range.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_session_hypothesis_economics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pandas==2.2.3
      - name: Genuine BTC ETH SOL USD-M 3-year signed-funding opening range cost stress
        run: python research/a226_session/a226_real_futures_session_arb_screen.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a226-genuine-binance-session-opening-range-predeclared
          path: |
            research/a226_session/evidence/A226_NATIVE_SESSION_RANGE_STRESS.json
            research/a226_session/evidence/A226_ALL_MODEL_TRADES.json
          if-no-files-found: warn
          retention-days: 30
