name: RESET-07 Convex Runner frozen economic backtest
on:
  push:
    branches: [research/reset07-convex-runner-backtest-20261102]
  pull_request:
  workflow_dispatch:
jobs:
  locked-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: pip install pytest ruff
      - name: Lock source contract, lint, adversarial checks
        run: |
          ruff check research/convex_runner tests/test_reset07.py
          python -m research.convex_runner.data_contract --manifest research/convex_runner/raw_sha256_manifest.json > sha_audit.txt
          python -m pytest tests/test_reset07.py -q
      - name: Run exactly four frozen scenarios (no tuning)
        run: |
          python -m research.convex_runner.backtest --sha-manifest research/convex_runner/raw_sha256_manifest.json --summary-path reset07_full_results.json --stdout | tee reset07_verdict.txt
      - name: Repeat exact same data + settings and compare deterministic JSON
        if: matrix.python-version == '3.11'
        run: |
          cp reset07_full_results.json reset07_first.json
          python -m research.convex_runner.backtest --sha-manifest research/convex_runner/raw_sha256_manifest.json --summary-path reset07_full_results.json --stdout > reset07_second.txt
          cmp reset07_first.json reset07_full_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset07-evidence-py${{ matrix.python-version }}
          path: |
            sha_audit.txt
            reset07_full_results.json
            reset07_verdict.txt
            reset07_second.txt
          retention-days: 90
