name: MTF A092 C22B Original Pivot Source Journal
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a092-c22b-pivot-journal-proof.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a092-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify full SHA-linked journal and seven C22B files
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a092-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a092-ledger.json'))
          assert d['events']>=92 and d['validations_pass']
          e=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert e[90]['action_id']=='A091'
          assert e[91]['action_id']=='A092' and e[91]['seq']==92
          assert e[91]['record_sha256']=='33380af8f8602ecc424d184b928f835b3af25fec6f74964e668021690af2e96e'
          assert len(e[91]['evidence'])==7 and e[91]['cycle_result']=='PASSED'
          print('A092_92_CHAIN_7_SOURCE_HASHES_VERIFIED')
          PY
      - name: Frozen author source and original C21/C22 receipt Git blobs
        run: |
          python - <<'PY'
          import subprocess
          pinned={
           'research/mtf-course-v05/src/course_primitives_v05.py':'45cec7fd66d0ec156bc0a38225ee282c6d3ee71b',
           'research/mtf-element-audit-v1/evidence/c21/C21B_ORIGINAL_3M_VS_5M_REPLAY_RECEIPT.json':'a9a121cb41477b105dd13a1228b5d0577ac3abda',
           'research/mtf-element-audit-v1/evidence/c22/C22A_ORIGINAL_3M_CROSS_CLOSE_BOUNDS.json':'05817435a27fc9273de8192fa8937969edf46c0b',
           'research/mtf-element-audit-v1/evidence/c22/C22B_ORIGINAL_PIVOT_ALTERNATIVES.json':'87bc70ed12cf77bf444a019cb48ef38d907ac5f3'}
          for path,want in pinned.items():
              sha=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              assert sha==want,(path,sha,want)
          print('A092_ORIGINAL_NATIVE3M_SOURCE_GIT_BLOBS_PASS')
          PY
      - name: C22B eight source adversarial tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c22b_source_inventory 2>&1 | tee /tmp/a092-tests.log
          grep -q 'Ran 8 tests' /tmp/a092-tests.log
