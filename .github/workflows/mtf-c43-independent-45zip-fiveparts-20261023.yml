name: EMBER C43 independent 45ZIP per-candidate FTA 5part full source
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c43-independent-45zip-fiveparts-20261023.yml'
permissions:
  contents: read
jobs:
  negative-source-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Verify immutable A112 112/112 ledger and all previous active evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/a112.txt
          grep -Fq 'entries 112 tip_sha256 5b258f6c17f2505f6dfb36c31f6b225b9e701b3b94c4d382b89938dbf8140d7f' /tmp/a112.txt
          python tests/test_journal_integrity.py | tee /tmp/a112-evidence.txt
          grep -Fq '"validations_pass": true' /tmp/a112-evidence.txt
      - name: Rerun C43 28 original3m candidate tests without skipping
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c43_adapted_per_candidate_fta_rerank 2>&1 | tee /tmp/c43-test.txt
          grep -Fq 'Ran 28 tests' /tmp/c43-test.txt
          grep -qx 'OK' /tmp/c43-test.txt
          ! grep -q 'skipped=' /tmp/c43-test.txt
  independent-original-source-fiveparts:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source original parent C39-C42 + C43 sharded manifest pinned Git blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c39/C39_ORIGINAL_FOUR_BOS_BY_THREE_POTENTIAL_FTA.json)" = "15dacbe47ba2b6e133d8b97d970a96d6242cd80f"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c40/C40_ORIGINAL_PRE_BOS_PRIOR_FTA_TOUCH_STATES.json)" = "718ce971dd781b2046c530992b4c9743225ef5b7"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c41/C41_ORIGINAL_36_SOURCE_JOIN_MATRIX.json)" = "ac3bb2b2babafdb28af71c4cbaa2b53fce03b06c"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c42/C42_ORIGINAL_SOURCE_FTA_ELIGIBILITY_45ZIP.json)" = "bddf315c58a906fe58546512bc416c24bd1ce95f"
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c43/C43_ORIGINAL_45ZIP_MANIFEST.json)" = "c1db4afec81cb240f981e6e0ef2211044c75e372"
          python research/mtf-element-audit-v1/tools/partition_c43_source_result.py research/mtf-element-audit-v1/evidence/c43 | tee /tmp/frozen-manifest-check.txt
      - name: Independently re-download original 45 ZIP and compare full 168MB JSON, five files and SHA
        shell: bash
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          mkdir -p /tmp/C43-FRESH-ORIGINAL
          python "$R/tests/probe_c43_original_per_candidate_fta_45zip.py" /tmp/C43-FRESH-FULL.json > /tmp/C43-fresh-source.log 2>&1 || { tail -c 9000 /tmp/C43-fresh-source.log; exit 1; }
          python "$R/tools/partition_c43_source_result.py" /tmp/C43-FRESH-FULL.json /tmp/C43-FRESH-ORIGINAL | tee /tmp/C43-new-hashes.txt
          python - <<'PY'
          import json,pathlib,hashlib
          old=pathlib.Path('research/mtf-element-audit-v1/evidence/c43')
          new=pathlib.Path('/tmp/C43-FRESH-ORIGINAL')
          oldm=(old/'C43_ORIGINAL_45ZIP_MANIFEST.json').read_bytes()
          newm=(new/'C43_ORIGINAL_45ZIP_MANIFEST.json').read_bytes()
          assert oldm==newm,"C43_INDEPENDENT_AGGREGATE_MANIFEST_BYTE_DRIFT"
          metadata=json.loads(oldm)
          assert metadata['complete_aggregate_source_json_sha256']=='92956d189574d2a13a0f8aa3f5aa9f99ddd4cc33dcb128c3fbb2b9b8fc30e791'
          assert metadata['complete_aggregate_source_json_bytes']==168774218
          assert len(metadata['market_parts'])==5
          full=pathlib.Path('/tmp/C43-FRESH-FULL.json').read_bytes()
          assert hashlib.sha256(full).hexdigest()==metadata['complete_aggregate_source_json_sha256']
          for part in metadata['market_parts']:
              a=(old/part['name']).read_bytes()
              b=(new/part['name']).read_bytes()
              assert a==b,("C43_INDEPENDENT_ORIGINAL_MARKET_FULL_BYTE_DRIFT",part['symbol'])
              assert hashlib.sha256(b).hexdigest()==part['sha256']
              assert len(b)==part['bytes']
              print('C43_INDEPENDENT_MARKET_FULL_BYTE_EXACT',part['symbol'],part['bytes'])
          count=metadata['parent_metadata']['policy_source_rerank_summary']
          assert count['ANY_PREKNOWN_RESEARCH_OBSTACLE_V1']['selected_after_per_candidate_rerank']==17289
          assert count['EXCLUDE_PRIOR_STRICT_SWEEP_OR_FULL_TRAVERSAL_V1']['selected_after_per_candidate_rerank']==17262
          assert count['REQUIRE_NO_PRIOR_OBSERVED_TOUCH_V1']['selected_after_per_candidate_rerank']==17262
          assert metadata['parent_metadata']['source_author_goldens']==metadata['parent_metadata']['orders']==metadata['parent_metadata']['trades']==0
          assert metadata['parent_metadata']['readiness']=='NOT_TRADE_READY'
          print('C43_INDEPENDENT_45ZIP_FULL_168MB_AGGREGATE_FIVE_MARKET_JSON_EXACT_PASS')
          PY
