name: RESET-06 Ramp Modules + Gate Report
on:
  push:
    branches: [research/reset06-ramp-modules-20261102]
  pull_request:
  workflow_dispatch:
jobs:
  reset06:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check research/platform/strategy_registry.py research/platform/ramp_policy.py research/platform/gate_report.py tests/test_reset05_strategy_registry.py tests/test_reset06.py
      - name: SHA witness and audited strategy history
        run: python -m research.platform.strategy_registry --verify-history
      - name: Empty-journal gate verdict
        run: python -m research.platform.gate_report
      - name: RESET-06 + predecessor regressions
        run: python -m pytest tests/test_reset06.py tests/test_reset05_strategy_registry.py tests/test_reset05_paper_ledger.py tests/test_risk_guard.py tests/test_reboot_platform.py -q
