            --result "B2 FILTER ECONOMIC FAIL BOTH NEW WINDOWS: March-May2025 B1 control n55 netR25 -20.008366R PF0.55804 DD24.88168%; gated B2 n17 netR25 -6.642906R PF0.52556 DD10.08710%, power insufficient and losses. July-Sept2025 B1 control n49 netR25 -7.617704R PF0.81358 DD15.11299%; gated B2 n19 netR25 -13.995634R PF0.27572 DD13.37617%, worse results. Gated n36 both windows sum netR25 -20.63854R and R40 -25.425075R, not portfolio PnL. Both predeclared economic screens FAILED and new gate must NOT integrate or trade live." \
            --countercheck "C109 original trading logic SHA immutable, original 4H SL and TP sources identical, D1+4H source values only fully closed at 1H reaction BEFORE entry; both original 12-coin source windows completed checksums 768+768, no posthoc winner filter because entire event state machine replays per arm. 1/3 directional efficiency unretuned after results; fail both windows, July gate markedly worsens PF. Prior C109-C110 historical outcomes and A173 sha untouched. PAPER ONLY, no real orders or risk stop relaxation." \
            --evidence cycles/B1_C111_PRECOMMIT_SINGLE_REGIME_GATE_TWO_UNSEEN_CRYPTO_WINDOWS_RU.md \
            --evidence d05/c111_frozen_c109_1d4h_regime_gate.py \
            --evidence d05/test_c111_one_regime_gate_source_asof.py \
            --evidence evidence/c111/C111_WIN_A_768_ORIGINAL_NATIVE3M_SOURCE_AND_TRADES.json \
            --evidence evidence/c111/C111_WIN_B_768_ORIGINAL_NATIVE3M_SOURCE_AND_TRADES.json \
            --evidence evidence/c111/C111_REGIME_GATE_TWO_WINDOW_PINNED_SUMMARY.json \
            --evidence cycles/B1_C111_REGIME_GATE_TWO_UNSEEN_WINDOWS_NEGATIVE_REPORT_RU.md
          python tools/auditlog.py verify | tee /tmp/c111-a174
          grep -Fq 'entries 174 tip_sha256 ' /tmp/c111-a174
      - name: Commit A174 immutable negative gate journal
