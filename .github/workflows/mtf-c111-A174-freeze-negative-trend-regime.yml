        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m "A174 C111 1536 original Binance ZIP two independent periods: D1 H4 regime filter negative and not enabled"
          git push origin HEAD:refs/heads/research/academic-engine-recovery-20261015
