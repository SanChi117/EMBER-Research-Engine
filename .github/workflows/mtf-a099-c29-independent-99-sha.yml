name: MTF A099 — Independent 99 SHA and 45 ZIP C29 Source
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a099-c29-independent-99-sha.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-a099-independent-original-source-99
  cancel-in-progress: false
jobs:
  full-99-sha-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent all 99 chained SHA records and new six source bytes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a099-audit.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/a099-audit.json'))
          assert a['events']>=99 and a['validations_pass']
          j=[json.loads(s) for s in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if s.strip()]
          assert len(j)>=99 and j[97]['action_id']=='A098' and j[98]['action_id']=='A099'
          assert j[98]['seq']==99
          assert j[98]['prev_sha256']=='292eece6faea4de832b825d0b76c280932d5ece14bcb37bfaa3e1abbf6bbcddc'
          assert j[98]['record_sha256']=='b02747002f9b6109820d6c5d1bdb131acfa1a3933ca91acc6ce707e1ca0372fe'
          assert j[98]['cycle_result']=='PASSED' and len(j[98]['evidence'])==6
          print('A099_ALL_99_SHA_SIX_EVIDENCE_FILE_BYTES_PASS')
          PY
      - name: Enforce C26-C29 immutable source receipts and independent witness blob
        run: |
          python - <<'PY'
          import subprocess
          pins={
            'research/mtf-element-audit-v1/evidence/c26/C26_UNSWEPT_1H_FTA_ORIGINAL_SOURCE.json':'11edbf5ddf8e89e513fc3893e807903bbf8933eb',
            'research/mtf-element-audit-v1/evidence/c27/C27_ORIGINAL_1H_EQ_SESSION_SOURCE.json':'d434ae830858fecf5e45cf7ef8ff7db1e627d489',
            'research/mtf-element-audit-v1/evidence/c28/C28_ORIGINAL_1H_CLASSIC_IMB_FTA_SOURCE.json':'ed3aca9384c8e49d07220f04b7d363df92689317',
            'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json':'abd68cb7cb86087c83423d16e9bbdd2cb344224c',
            'research/mtf-element-audit-v1/evidence/c29/C29_INDEPENDENT_RUN_WITNESS.json':'0592e15c08e561503bae470c10a5c22de7550059'}
          for p,w in pins.items():
              got=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert got==w,(p,got,w)
          print('A099_ALL_PREVIOUS_FROZEN_SOURCE_BLOBS_PASS')
          PY
      - name: Repeat all 24 adversarial RB-vs-SNR source controls
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c29_rb_snr_source_guards 2>&1 | tee /tmp/a099-controls.log
          grep -q 'Ran 24 tests' /tmp/a099-controls.log
      - name: Reload 45 original Binance USD-M archives and exact per-case JSON
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c29_original_1h_rb_snr_source_gate.py /tmp/a099-full-original.json 2>&1 | tee /tmp/a099-replay.log
          python - <<'PY'
          import json
          a=json.load(open('research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json'))
          b=json.load(open('/tmp/a099-full-original.json'))
          assert a==b,'A099_INDEPENDENT_45_ZIP_ALL_CASE_JSON_NOT_EQUAL'
          assert a['original_archive_count']==45
          assert a['original_native3m_source_rows']==76800
          assert a['native15m_exact_decimal_equalities']==15360
          t=a['totals']
          assert t['original_parent_edges']==539 and t['research_single_cases']==165
          assert t['source_hours']==3840 and t['source_opposite_pairs']==1989
          assert t['source_extreme_envelope_follow_through']==403
          assert t['case_preknown_pair_relations']==34348
          assert t['case_preknown_technical_follow_through_relations']==6728
          assert a['author_positive_rb_examples']==a['author_positive_snr_examples']==0
          assert a['author_selected_first_fta']==a['author_trades_approved']==0
          assert a['readiness']=='NOT_TRADE_READY'
          print('A099_ORIGINAL_45ZIP_C29_FULL_JSON_SHA_SUCCESS')
          PY
      - name: Preserve successful A099 independent all 99 event and 45 ZIP proof
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c29/A099_INDEPENDENT_RUN_WITNESS.json
          if test -e "$p"; then echo "Already validated"; exit 0; fi
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/mtf-element-audit-v1/evidence/c29/A099_INDEPENDENT_RUN_WITNESS.json')
          p.write_text(json.dumps({
            'schema':'EMBER_A099_99_SHA_45_ORIGINAL_ZIP_SOURCE_GATES_V1',
            'run_id':int(os.environ['RUN_ID']),
            'trigger_commit_sha':os.environ['HEAD_SHA'],
            'a099_record_sha256':'b02747002f9b6109820d6c5d1bdb131acfa1a3933ca91acc6ce707e1ca0372fe',
            'canonical_sha_events_verified':99,
            'c29_sha_evidence_files':6,
            'original_usdm_zip_reread':45,
            'all_pinned_json_data_equal':True,
            'negative_tests_passed':24,
            'approved_rb_snr_fta_trades':0,
            'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(A099): 99 SHA independent native RB SNR negative source verification"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
