name: MTF A074 - Verify Five Original 5m Archive Source Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a074-five-symbol-5m-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-five-futures-74-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently verify A001-A074 SHA journal and exact immutable evidence bytes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a074-proof.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/a074-proof.json'))
          assert q['events']==74 and q['validations_pass']
          rows=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert rows[-1]['action_id']=='A074'
          assert rows[-1]['record_sha256']=='3e94f7973104914c3dc6ede9bac86bff28261b3ee5f33529065ba1c92f2952e8'
          assert 'zero academic trade readiness' in rows[-1]['observed_result']
          print('A001_A074_74_SHA_CHAIN_AND_SOURCE_EVIDENCE_PASS')
          PY
      - name: Lock five original 5m receipt hashes and unchanged academic v05, original C08
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f04/F04_FIVE_5M_FUTURES_2026-10-02_RECEIPTS.json)" = e5b24eb50c15fcd19fe1069d44e95a0a02edaa1c
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json)" = 4205ad3118a30bbd69c412e165c7c5ce3560195d
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
      - name: Rerun 29 source v05 and 41 5m/raid/BOS tests, without trading
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a074-v05.txt
          grep -q 'Ran 29 tests' /tmp/a074-v05.txt
          grep -Eq '^OK$' /tmp/a074-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_f03_5m_original_source test_c09_source_5m_raid_bos_geometry 2>&1 | tee /tmp/a074-geometry.txt
          grep -q 'Ran 41 tests' /tmp/a074-geometry.txt
          grep -Eq '^OK$' /tmp/a074-geometry.txt
          echo '74_SOURCE_PROOF_ENTRIES_AND_70_TESTS_PASS_NO_ACADEMIC_READY'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a074-5-source-futures-evidence-sha-chain
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a074-proof.json
            /tmp/a074-v05.txt
            /tmp/a074-geometry.txt
