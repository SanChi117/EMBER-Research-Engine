name: "EMBER A207 original taker pressure source real Binance 5m, frozen 2024 first, 2025+2026 stress"
on:
  push:
    branches: [research/a207-taker-pressure-5m-2024-frozen-holdout-20261031]
    paths:
      - ".github/workflows/ember-a207-taker-pressure-5m-three-years.yml"
      - "research/native_candidate_screen_20261031/a207_*.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-original-taker-source-on-real-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Freeze original author code, Python deps and no exchange keys
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pandas==2.2.3' 'numpy==1.26.4'
          python -c "import numpy,pandas;assert pandas.__version__=='2.2.3' and numpy.__version__=='1.26.4'"
          git init -q /tmp/a207-author
          git -C /tmp/a207-author -c credential.helper= fetch -q --depth 1 https://github.com/Gotodataru/binance-futures-backtest.git 5ed0d6e39d8a3e951bea40c66e2638c213012e1b
          git -C /tmp/a207-author checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/a207-author rev-parse HEAD)" = 5ed0d6e39d8a3e951bea40c66e2638c213012e1b
          python - <<'PY'
          from pathlib import Path
          import hashlib
          f=Path('/tmp/a207-author/strategy_2_taker_momentum/signals.py').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(f)).encode()+b'\0'+f).hexdigest()
          assert sha=='b8a2840618c4fb02a2d90120deed5771b34bdbd6',sha
          print('A207_EXACT_UNTOUCHED_AUTHOR_SOURCE_GIT_BLOB_VERIFIED',sha)
          PY
          test -s research/native_candidate_screen_20261031/A207_TAKER_PRESSURE_5M_FROZEN_SOURCE_PREREG_RU.md
          mkdir -p a207-taker
      - name: Download immutable genuine Binance Vision May-Sep 2024 2025 2026 original 5m taker-base and funding sources
        shell: bash
        run: |
          set -euo pipefail
          timeout 3300s python research/native_candidate_screen_20261031/a207_frozen_taker_pressure_real_binance_replay.py \
            --author /tmp/a207-author/strategy_2_taker_momentum/signals.py \
            --out a207-taker 2>&1 | tee a207-taker/A207-replay-with-real-Binance.log
          grep -Fq A207_GENUINE_BINANCE_THREE_YEARS_ORIGINAL_SIGNALS_FIXED_RISK_VERIFIED a207-taker/A207-replay-with-real-Binance.log
          test -s a207-taker/A207_FROZEN_TAKER_2024_2025_2026_VERIFIED.json
      - name: Verify original 2024 data were genuine, every pair has 2024-2026 trades and receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('a207-taker')
          d=json.loads((root/'A207_FROZEN_TAKER_2024_2025_2026_VERIFIED.json').read_text())
          assert d['source_blob']=='b8a2840618c4fb02a2d90120deed5771b34bdbd6'
          assert d['source_commit']=='5ed0d6e39d8a3e951bea40c66e2638c213012e1b'
          assert d['years']==[2024,2025,2026] and len(d['source_zip_and_csv_sha256'])==120
          assert len(d['individual_trade_ledger_sha256'])==24
          for k,receipt in d['individual_trade_ledger_sha256'].items():
              b=(root/k).read_bytes()
              assert hashlib.sha256(b).hexdigest()==receipt['sha256'],k
              trades=json.loads(b)
              assert len(trades)==receipt['trade_rows'],k
          for y in d['years']:
              for sym in ('BTC','ETH','SOL','LINK'):
                  assert d['source_data_integrity'][f'{y}-{sym}']['input_candles_contiguous_no_gap']
                  for c in ('base','stress'):
                      r=d['outcomes'][str(y)][sym][c]
                      assert r['long_n']+r['short_n']==r['trades']
                      assert r['p90_hold_min'] is None or r['p90_hold_min']<=80
          assert d['execution_approval'] is False
          print('A207_REAL_120_SOURCE_ZIPS_AND_24_TRADE_RECEIPTS_VERIFIED',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A207-original-taker-pressure-2024-2025-2026-real-Binance-evidence
          path: |
            a207-taker/A207-replay-with-real-Binance.log
            a207-taker/A207_FROZEN_TAKER_2024_2025_2026_VERIFIED.json
            a207-taker/A207_*_GENUINE_TRADE_LOG.json
          retention-days: 30
      - name: Persist signed research metrics ONLY after verification
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target=research/native_candidate_screen_20261031/A207_GENUINE_2024_2025_2026_FIXED_ORIGINAL_TAKER_VERIFIED.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          git checkout -q -B a207-result FETCH_HEAD
          cp a207-taker/A207_FROZEN_TAKER_2024_2025_2026_VERIFIED.json "$target"
          git add "$target"
          if git diff --staged --quiet; then echo A207_ALREADY_COMMITTED;exit 0;fi
          git commit -qm "research(A207): frozen taker source 2024/25/26 true Binance evidence and cost gates"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo A207_GENUINE_THREE_YEAR_RESEARCH_VERDICT_PERSISTED
