name: MTF B1 C08 - Prior Closed 1D and Current Intraday As-Of (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c08-prior-daily-asof.yml'
      - 'research/mtf-element-audit-v1/d05/mtf_prior_daily_asof_b1.py'
      - 'research/mtf-element-audit-v1/d05/test_mtf_prior_daily_asof_b1.py'
      - 'research/mtf-element-audit-v1/tests/probe_b1_c08_prior_1d_asof.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-daily-context-no-current-day-hindsight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen course and C08 archive receipts
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Run 29 source and 37 MTF causal regression tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/b1-c08-v05.txt
          grep -q 'Ran 29 tests' /tmp/b1-c08-v05.txt
          grep -Eq '^OK$' /tmp/b1-c08-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_mtf_c08_aggregation_b1 test_mtf_prior_daily_asof_b1 2>&1 | tee /tmp/b1-c08-tests.txt
          grep -q 'Ran 37 tests' /tmp/b1-c08-tests.txt
          grep -Eq '^OK$' /tmp/b1-c08-tests.txt
      - name: Fetch Oct1 native 1D and Oct2 native 15m ZIPs and prove as-of without next-day daily
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_b1_c08_prior_1d_asof.py /tmp/b1-c08-real.json 2>&1 | tee /tmp/b1-c08-real.log
          python - <<'PY'
          import json
          v=json.load(open('/tmp/b1-c08-real.json'))
          assert v['previous_1d_known_at_ms']==1790899200000
          assert v['asof_0015_1h_available'] is False
          assert v['asof_0100_1h_available'] is True
          assert v['asof_0100_4h_available'] is False
          assert v['asof_0400_4h_available'] is True
          assert v['asof_0400_future_suffix_stable'] is True
          assert v['current_day_native_1d_archive_loaded'] is False
          assert v['daily_bias_source_verified'] is False
          assert v['mtf_course_poi_approved'] is False
          assert v['orders_created'] is False and v['readiness']=='NOT_TRADE_READY'
          print('PREVIOUS_NATIVE_DAY_CLOSED_BEFORE_CURRENT_H1_H4__NO_MTF_ACADEMIC_SIGNOFF')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-b1-c08-previous-native-day-two-source-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/b1-c08-v05.txt
            /tmp/b1-c08-tests.txt
            /tmp/b1-c08-real.json
            /tmp/b1-c08-real.log
