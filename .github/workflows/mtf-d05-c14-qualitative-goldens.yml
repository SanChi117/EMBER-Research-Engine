name: MTF D05 C14 — Academic StrongHL Text Labels vs Price Goldens (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-d05-c14-qualitative-goldens.yml'
      - 'research/mtf-element-audit-v1/d05/C14_AUTHOR_STRONGHL_QUALITATIVE_CASES.json'
      - 'research/mtf-element-audit-v1/d05/c14_qualitative_stronghl_source_gate.py'
      - 'research/mtf-element-audit-v1/d05/test_c14_qualitative_stronghl_source_gate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualitative-not-market-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original source images and original v05 and C13 engineering evidence
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-element-audit-v1/d05/C04_LEVEL_REACTION_SOURCE_CASES.json)" = bf764d34b9a1c4bfe06dca6dbe50557b244df0f4
          test "$(git hash-object research/mtf-element-audit-v1/d05/C03_58_IMAGE_REVIEW.json)" = c9b25c8912700f05cc1518c6d97555e11f6b9dc3
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c13/C13_DUAL_SOURCE_BOS_POI_DIAGNOSTICS.json)" = c699926be9f2550b6ecdc6a371de3b63c38d325d
      - name: Regress native v05 and B1 C10-C13 price source geometry
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/c14-v05.txt
          grep -q 'Ran 29 tests' /tmp/c14-v05.txt
          grep -Eq '^OK$' /tmp/c14-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness test_c12_attribution_ambiguity_gate test_c13_stronghl_bos_or_poi_source_branch 2>&1 | tee /tmp/c14-prior.txt
          grep -q 'Ran 86 tests' /tmp/c14-prior.txt
          grep -Eq '^OK$' /tmp/c14-prior.txt
      - name: Author text/illustrations 13 source cases, 37 adversarial tests and zero Futures goldens
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c14_qualitative_stronghl_source_gate 2>&1 | tee /tmp/c14-source-cases.txt
          grep -q 'Ran 37 tests' /tmp/c14-source-cases.txt
          grep -Eq '^OK$' /tmp/c14-source-cases.txt
          python - <<'PY'
          from c14_qualitative_stronghl_source_gate import check_frozen_source_illustrations
          d=check_frozen_source_illustrations()
          assert len(d.cases)==13
          assert d.original_images_reviewed==72
          assert d.labelled_futures_market_cases==0 and d.trade_ready is False
          assert all(x.price_origin=="NO_TIME_OR_RAW_BINANCE_CANDLE_IN_CONCEPT_CASE"
                     for x in d.cases)
          print("C14_13_SOURCE_CONCEPT_CASES_72_IMAGES_152_TESTS_ZERO_MARKET_GOLDEN_LABELS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-d05-c14-stronghl-author-qualitative-vs-market-labels
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c14-v05.txt
            /tmp/c14-prior.txt
            /tmp/c14-source-cases.txt
