name: EMBER C60 append-once A130 original45ZIP 4H source first and repeated 3m visits
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c60-A130-append-once-original45zip.yml'
permissions:
  contents: write
concurrency:
  group: mtf-c60-A130-single-append
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify previous 129 SHA and independent C60 original crypto source six evidence
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/ledger129
          grep -Fq 'entries 129 tip_sha256 dfca90b0f376ae36f8d50f5230ae19d9ed56dfc8dc435197fb1ead29f5e9dc86' /tmp/ledger129
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          cd ../..
          R=research/mtf-element-audit-v1
          test "$(git rev-parse HEAD:$R/evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json)" = dc03c181912ffbb800bc191fbc16ec0d05c335e0
          cd "$R"
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          f=Path('evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json')
          w=Path('evidence/c60/C60_INDEPENDENT_ORIGINAL45ZIP_FIRST_RETURN_SOURCE_WITNESS_20261025.json')
          report=Path('cycles/B1_C60_ORIGINAL45ZIP_FIRST_VS_REPEATED_4H_IMB_NATIVE3M_SOURCE_REPORT.md')
          assert all(p.exists() and p.stat().st_size>0 for p in (f,w,report))
          assert f.stat().st_size==3471251
          sha=hashlib.sha256(f.read_bytes()).hexdigest()
          assert sha=='dd94e32421d383cae4d5d9d8d20c264418d74b3b0e59a222378586a4490050de'
          doc=json.loads(f.read_bytes());w=json.loads(w.read_bytes())
          assert doc['source_zip_counts']['total']==45 and doc['original_closed_native3m']==76800
          assert doc['crosschecked_native15m_exact_Decimal_parities']==15360
          assert doc['technical_4h_imb_candidate_total']==153 and doc['original_first_native3m_contact_total']==132
          assert doc['candidate_status_totals']=={'no_original_source_contact':21,'single_observed_visit':5,
                 'two_or_more_distinct_source_visits':127,'source_right_censored_active_last_visit':5}
          assert doc['distinct_source_visit_episodes_total']==4421
          assert doc['author_first_valid_POI_tests']==doc['author_StrongHL_goldens']==0
          assert doc['orders']==doc['trades']==doc['fills']==0 and doc['readiness']=='NOT_TRADE_READY'
          assert w['independent_second_original45zip_run']==40204057080 and w['second_run_status']=='SUCCESS_4_OF_4'
          assert w['full_source_sha256']==sha and w['negative_tests_per_python']==23
          print('A130_C60_FROZEN_SIX_SOURCE_AND_INDEPENDENT_CI_CHECK_SUCCESS')
          PY
          cd d05
          python -m unittest -v test_c60_original_4h_imb_3m_contact_episode_lifecycle 2>&1 | tee /tmp/C60-23
          grep -Fq 'Ran 23 tests' /tmp/C60-23
          grep -qx 'OK' /tmp/C60-23
      - name: Append A130 only after full original Binance45ZIP byte-exact second witness
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py record \
            --action-id A130 \
            --cycle B1/C60 \
            --planned 'Course original FVG rule: only first true POI test is pristine; repeated returns can form liquidity. Research on original Binance USD-M closed native3m price, separate first source wick encounter of technical C46 4H IMB from contiguous inside bars and later returns requiring at least one completely closed native3m outside bar. Do not promote technical source episodes to author valid POI tests or entries.' \
            --executed 'Created C60 original source first/repeated 3m visit state machine, 23 adversarial negative tests across Python 3.10 3.11 3.12, fresh SHA-verified 45 original Binance USD-M ZIP for five crypto symbols, 76800 closed native3m source bars, 15360 Decimal native15m parity, each of 153 C46 original 4H gap original first bar IDs exact equal frozen C46. First 45ZIP full accepted CI 40203869840 SUCCESS after correction of zero post-known rows at final 4H close, and second independent all45 original ZIP exact complete JSON byte-equality CI 40204057080 SUCCESS 4/4, source evidence 3471251 bytes SHA256 dd94e32421d383cae4d5d9d8d20c264418d74b3b0e59a222378586a4490050de Git blob 899373e4a1dc1999d1485ac8c1f790d39071aebd.' \
            --result 'Original 153 technical 4H gap source zones: 21 never observed original native3m contact, 5 exactly one continuous source visit, 127 with at least two distinct source visits separated by closed outside native3m bar; across all technical zones 4421 observed source visit episodes, including 5 right-censored current last episodes. These are correlated price observations only, NOT original author validated first POI tests, strongHL, valid entries, trades or win rate. Zero author goldens, signals, orders, fills, trades and PnL; PAPER ONLY NOT_TRADE_READY.' \
            --verdict DONE \
            --cycle-result PASSED \
            --countercheck 'Previous A129 129/129 tip dfca90b0f376ae36f8d50f5230ae19d9ed56dfc8dc435197fb1ead29f5e9dc86 unchanged. Original C46 frozen Git blob dc03c181912ffbb800bc191fbc16ec0d05c335e0 unchanged, all earlier source probes preserved. Initial C60 CI 40203774575 red on source newly formed at exact last closed as-of with zero postknown native3m bars incorrectly called missing data; fixed legitimate empty prefix and test. Intermediate CI 40203866532 red only due to stale expected 22 rather than 23 tests. Final source 40203869840 and fresh independent original45zip 40204057080 both success, with 23x3 negatives and exact 3471251-byte full SHA. Author first valid POI test not inferred from technical wick episode.' \
            --evidence d05/c60_original_4h_imb_3m_contact_episode_lifecycle.py \
            --evidence d05/test_c60_original_4h_imb_3m_contact_episode_lifecycle.py \
            --evidence tests/probe_c60_original45zip_4h_imb_first_vs_repeated_3m_visits.py \
            --evidence evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json \
            --evidence evidence/c60/C60_INDEPENDENT_ORIGINAL45ZIP_FIRST_RETURN_SOURCE_WITNESS_20261025.json \
            --evidence cycles/B1_C60_ORIGINAL45ZIP_FIRST_VS_REPEATED_4H_IMB_NATIVE3M_SOURCE_REPORT.md
          python tools/auditlog.py verify | tee /tmp/A130
          grep -Fq 'entries 130' /tmp/A130
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
      - name: Commit journal append-once, nonforcing
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only > /tmp/changed
          test "$(wc -l < /tmp/changed)" -eq 1
          grep -Fxq 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl' /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m 'audit(C60): append-once A130 first repeated 3m source only 45ZIP six SHA'
          for i in 1 2 3 4 5 6; do
            git fetch origin research/academic-engine-recovery-20261015
            git rebase origin/research/academic-engine-recovery-20261015
            if git push origin HEAD:research/academic-engine-recovery-20261015; then exit 0; fi
            sleep 2
          done
          exit 1
