name: A230 Corrected Five Original Freqtrade Futures Backtests — Protections and 5m Detail

on:
  push:
    branches:
      - 'research/a230-five-original-freqtrade-parity-protections-5m-20261031'
    paths:
      - 'research/a228_five_original/**'
      - 'research/a230_test_correction/**'
      - '.github/workflows/ember-a230-five-original-protected-5min.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected_originals_native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FREQTRADE__EXCHANGE__KEY: ""
      FREQTRADE__EXCHANGE__SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed Freqtrade native environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'freqtrade==2026.9' technical pandas pyarrow
          python -m freqtrade --version
          python -m pip freeze > research/a228_five_original/native_pip_freeze.txt
      - name: All unchanged original author SHA and genuine Binance USDT-M market OHLCV mark and funding
        run: python research/a228_five_original/a228_prepare_pinned_originals_and_real_futures.py
      - name: Corrected actual Freqtrade source native with source-defined protections and 5m lower candle resolution
        run: python research/a228_five_original/a228_run_original_freqtrade_five.py
      - name: Archive corrected original full trade journals for verifiable comparison with earlier runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a230-corrected-five-originals-protections-five-minute-native
          path: |
            research/a228_five_original/native_pip_freeze.txt
            research/a228_five_original/generated/A228_ORIGINAL_AND_MARKET_RECEIPTS.json
            research/a228_five_original/generated/native_backtests/**
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
