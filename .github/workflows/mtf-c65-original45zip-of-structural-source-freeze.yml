name: EMBER C65 original45ZIP 1h last structural OF link and previous daily target source
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c65-original45zip-of-structural-source-freeze.yml'
      - 'research/mtf-element-audit-v1/tests/probe_c65_original45zip_of_last_link_target_first_invalidation.py'
permissions:
  contents: write
concurrency:
  group: c65-original45-source-first-freeze
  cancel-in-progress: false
jobs:
  full_original45:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted immutable 134 SHA and frozen C46 C60 C62 C63 C64 originals
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A134
          grep -Fq 'entries 134 tip_sha256 2a01f3845779390187305475c609d407b0e790605de3d3183884baba81795960' /tmp/A134
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json)" = dc03c181912ffbb800bc191fbc16ec0d05c335e0
          test "$(git rev-parse HEAD:$R/evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json)" = 899373e4a1dc1999d1485ac8c1f790d39071aebd
          test "$(git rev-parse HEAD:$R/evidence/c62/C62_ORIGINAL_45ZIP_1H_SNR_RB_MB_IMB_LIQUIDITY_COMPLETE_SOURCE.json)" = 8428bf7d6cd3bc26f617cfc32a34c91a27c813b2
          test "$(git rev-parse HEAD:$R/evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json)" = fdc77c7ec942f03b4efae83b935d994c8435a24f
          test "$(git rev-parse HEAD:$R/evidence/c64/C64_ORIGINAL45ZIP_STRICT_SOURCE_EXTREME_PRECONFIRM_POST_WICK_CLOSE_INVALIDATION.json)" = f70b0493a0c4964c618c09c75fee900dd65f5c05
      - name: Download all 45 signed original Binance USD-M ZIP, verify 153 4h source parent OF sequences
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          python "$R/tests/probe_c65_original45zip_of_last_link_target_first_invalidation.py" /tmp/C65-original.json >/tmp/C65-original.log 2>&1 || { tail -c 22000 /tmp/C65-original.log; exit 1; }
          tail -c 2400 /tmp/C65-original.log
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/C65-original.json')
          d=json.loads(p.read_bytes())
          assert d['fresh_signed_original_zip_counts']['total']==45
          assert d['original_native3m_closed']==76800
          assert d['original_native1d_closed']==160
          assert d['original_native15m_decimal_equalities']==15360
          assert d['derived_closed_original1h']==3840
          assert d['original_4h_C46_candidates']==153
          assert sum(d['original_4h_full_source_status_totals'].values())==153
          assert d['author_actual_OF_invalidation']==d['author_StrongHL']==0
          assert d['orders']==d['fills']==d['trades']==0
          assert d['readiness']=='NOT_TRADE_READY'
          print('C65_ORIGINAL45ZIP_JSON_BYTES',p.stat().st_size)
          print('C65_ORIGINAL45ZIP_JSON_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c65-full-original45
          path: /tmp/C65-original.json
          if-no-files-found: error
  academic_31:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Source author OF 31 negative tests, chrono and first-any proxy, no author proof
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c65_of_last_link_target_invalidation_source 2>&1 | tee /tmp/C65neg
          grep -Fq 'Ran 31 tests' /tmp/C65neg
          grep -qx 'OK' /tmp/C65neg
  freeze:
    needs: [full_original45,academic_31]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c65-full-original45
          path: /tmp/c65
      - name: Freeze only after whole original45 ZIP and 31x3 source OF academic tests
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c65/C65_ORIGINAL45ZIP_LAST_STRUCTURAL_OF_LINK_FIRST_TARGET_INVALIDATION_SOURCE.json
          if test -e "$p"; then
            cmp -s "$p" /tmp/c65/C65-original.json
            exit 0
          fi
          mkdir -p "$(dirname "$p")"
          cp /tmp/c65/C65-original.json "$p"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          git commit -m 'evidence(C65): original45ZIP OF last prior pivot with liquidity and IMB source before target, first any dual invalidation'
          for n in 1 2 3 4 5; do
            git fetch origin research/academic-engine-recovery-20261015
            git rebase origin/research/academic-engine-recovery-20261015
            if git push origin HEAD:research/academic-engine-recovery-20261015; then exit 0; fi
          done
          exit 1
