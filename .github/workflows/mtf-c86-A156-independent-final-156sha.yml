name: EMBER C86 A156 independent final 156SHA original first-test receipts
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c86-A156-independent-final-156sha.yml'
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Full 156 event SHA chain, four exact immutable C86 evidence, source replay 61x3
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/a156
          grep -Fq 'entries 156 tip_sha256 c72f6f1f86b6f8d4e864c44ef20506549f795459d82764e617081510d768502a' /tmp/a156
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          entries=[json.loads(s) for s in Path('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text(encoding='utf8').splitlines()]
          assert len(entries)==156
          old,new=entries[-2:]
          assert old['seq']==155 and old['record_sha256']=='330468624d81e7bcb61a6aae0a79c1bba692ce5830bd6e37a3a485c90acb2d30'
          assert new['seq']==156 and new['action_id']=='A156' and new['cycle']=='B1/C86'
          assert new['prev_sha256']==old['record_sha256'] and new['verdict']=='DONE' and new['cycle_result']=='PASSED'
          assert new['record_sha256']=='c72f6f1f86b6f8d4e864c44ef20506549f795459d82764e617081510d768502a'
          expected={
            'd05/c86_original153_first_test_receipts.py':'f352a507899f69beeb5bcd35ec9a924d9ff9ad0c4332e4855d51289cb6d88270',
            'd05/test_c86_original153_first_test_receipts.py':'1ba369c4a8894c629e69758df0ce6aa320237934acb110fbd78eedabd0753e14',
            'cycles/B1_C86_ORIGINAL153_FIRST_POI_TEST_PROVENANCE_AUDIT_REPORT.md':'b8eca8998e3abf353163aafd8692321050ae7e7233806a54e3b87a96a8883964',
            'evidence/c86/C86_ORIGINAL153_4H_1H_FIRST_TEST_SOURCE_RECEIPTS.json':'5d08655571410f4fc3cd726c5f398eed5c576dda2674565fa12f87395b2b535f',
          }
          assert set(expected)=={z['path'] for z in new['evidence']}
          for z in new['evidence']:
              b=Path(z['path']).read_bytes()
              assert len(b)==z['bytes']
              assert hashlib.sha256(b).hexdigest()==expected[z['path']]==z['sha256']
          print('C86_A156_FINAL_SHA156_EVIDENCE_ACCEPTED')
          PY
          cd d05
          python -m unittest -v test_c86_original153_first_test_receipts 2>&1 | tee /tmp/c86
          grep -Fq 'Ran 61 tests' /tmp/c86
          grep -qx 'OK' /tmp/c86
          cd ..
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'d05')
          from c86_original153_first_test_receipts import audit_stored_bytes
          a=Path('evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json').read_bytes()
          b=Path('evidence/c72/C72_ORIGINAL60ZIP_NATIVE5M_15M_PARITY_AFTER_C71_SOURCE_VC.json').read_bytes()
          c=Path('evidence/c81/C81_FROZEN153_INDEPENDENT_REVIEW_QUEUE_SOURCE_ONLY.json').read_bytes()
          q=Path('evidence/c86/C86_ORIGINAL153_4H_1H_FIRST_TEST_SOURCE_RECEIPTS.json').read_bytes()
          e=audit_stored_bytes(a,b,c,q)
          obj=json.loads(q)
          assert len(obj['receipts'])==153
          assert obj['summary']['priority_counts']=={'0':12,'1':23,'2':71,'3':47}
          assert obj['summary']['physical_classes']['NO_SELECTED_POI_RAW3M_EXISTS']==23
          assert obj['summary']['physical_classes']['NO_SELECTED_POI_NO_RAW3M']==24
          assert obj['summary']['4h_author_first_valid_test_count']==obj['summary']['1h_author_first_valid_test_count']==0
          assert obj['summary']['orders']==obj['summary']['trades']==0
          print('C86_A156_FIRST_VALID_POI_PROOF_BLOCKED_AS_REQUIRED',e)
          PY
