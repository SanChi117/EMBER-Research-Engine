name: A228 Official Binance Futures Metadata Reachability (No Orders)

on:
  push:
    branches:
      - 'research/a228-five-original-native-freqtrade-replay-20261031'
    paths:
      - '.github/workflows/ember-a228-binance-official-metadata-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official_exchange_info_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test only official Binance public market metadata availability from CI, no trading
        run: |
          set +e
          for host in fapi.binance.com fapi1.binance.com fapi2.binance.com fapi3.binance.com testnet.binancefuture.com; do
            echo "=== PROBE official metadata host $host ==="
            code=$(curl -sS --connect-timeout 5 --max-time 9 -o /tmp/binance-metadata-reply -w '%{http_code}' "https://$host/fapi/v1/exchangeInfo")
            echo "$host HTTP $code BYTES $(wc -c </tmp/binance-metadata-reply 2>/dev/null)"
            if [ "$code" = "200" ]; then
              python -c "import json; d=json.load(open('/tmp/binance-metadata-reply')); print('OFFICIAL_USDM_REQUIRED_SYMBOLS', sorted(set(x.get('symbol') for x in d.get('symbols',[])) & {'BTCUSDT','ETHUSDT','SOLUSDT'}))"
            else
              head -c 120 /tmp/binance-metadata-reply
              echo
            fi
          done
