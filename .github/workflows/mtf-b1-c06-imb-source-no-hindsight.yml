name: MTF B1 C06 - Closed Source IMB without Next-Bar Hindsight (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c06-imb-source-no-hindsight.yml'
      - 'research/mtf-element-audit-v1/d05/source_imb_prefix_b1.py'
      - 'research/mtf-element-audit-v1/d05/test_source_imb_prefix_b1.py'
      - 'research/mtf-element-audit-v1/tests/probe_b1_c06_existing_imb_no_future.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course-source-imb-as-of-and-reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard source-v05 primitives and frozen BTC archive proof
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Verify existing course-v05 and both read-only prefix layers
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/b1-c06-v05.txt
          grep -q 'Ran 29 tests' /tmp/b1-c06-v05.txt
          grep -Eq '^OK$' /tmp/b1-c06-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_poi_complete_prefix_reaction_b1 test_source_imb_prefix_b1 2>&1 | tee /tmp/b1-c06-tests.txt
          grep -q 'Ran 35 tests' /tmp/b1-c06-tests.txt
          grep -Eq '^OK$' /tmp/b1-c06-tests.txt
      - name: Run source-defined IMB reaction prefix on original Binance archive
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_b1_c06_existing_imb_no_future.py /tmp/b1-c06-source.json 2>&1 | tee /tmp/b1-c06-online.txt
          python - <<'PY'
          import json
          v=json.load(open('/tmp/b1-c06-source.json'))
          assert v['archive_rows']==96 and v['total_source_imb_candidates']>=1
          assert v['first_source_exists_at_its_own_known_at'] is True
          assert v['first_source_future_data_used'] is False
          assert v['valid_academic_parent_poi'] is False
          assert v['academic_reaction_approved'] is False
          assert v['order_ready'] is False
          print('SOURCE_DEFINED_IMB_NOT_FUTURE_GAP__NO_TRADE_READY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-c06-real-binance-course-v05-imb-asof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/b1-c06-v05.txt
            /tmp/b1-c06-tests.txt
            /tmp/b1-c06-online.txt
            /tmp/b1-c06-source.json
