name: EMBER C70 final independent 140 SHA six original 45 ZIP native3m source 20x3
on:
  workflow_dispatch:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c70-A140-independent-final-140sha.yml'
permissions:
  contents: read
jobs:
  sha140:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e9bfb4c5b23d695b22079552b054cef9f2288c0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independent SHA 140/140 immutable 6 original native3m source files, prior frozen C46..C69 and 20 negatives
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/A140
          grep -Fq 'entries 140 tip_sha256 f799fa6b65ae8044971fa95e355fca9c8e228e2dbf90cd3108081b39ab6d21bb' /tmp/A140
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          ledger=[json.loads(z) for z in Path('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text().splitlines()]
          assert len(ledger)==140
          prev,current=ledger[-2:]
          assert prev['action_id']=='A139' and prev['record_sha256']=='78271dd0a96a54713e4559fe47107ccf063b7ba8f4ed384d8aa166f2cae9c227'
          assert current['action_id']=='A140' and current['seq']==140 and current['prev_sha256']==prev['record_sha256']
          assert current['record_sha256']=='f799fa6b65ae8044971fa95e355fca9c8e228e2dbf90cd3108081b39ab6d21bb'
          assert current['cycle']=='B1/C70' and current['verdict']=='DONE' and current['cycle_result']=='PASSED'
          expected={"d05/c70_exact_native3m_first_raid_or_poi_source_wick.py":"1757e935362b1a33c25a66f624859d564dc68f65f6caf89e8f8d644922358175","d05/test_c70_exact_native3m_first_raid_or_poi_source_wick.py":"897b02334d7713a1ed5ea83339954958db3aac68057ef0a37f65726560d6a723","tests/probe_c70_original45zip_exact_first_native3m_wick.py":"faca19328a8fd1f1eea21b3bef1bf753c5084cf3a6cf1b0524d739d15ab68e14","evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json":"b93edbb2eabdefeff6161f80c17d5e35013bc8b0205aaefac63e15f0a6b37ef9","evidence/c70/C70_INDEPENDENT_ORIGINAL45ZIP_FIRST_NATIVE3M_SOURCE_WITNESS_20261025.json":"99bafe74f3c453253fb334fdc5f65e8488ed08530ddb4faf762b9466fd1d5694","cycles/B1_C70_FIRST_ORIGINAL3M_WICK_WITHIN_15M_LIQUIDITY_OR_POI_SOURCE_REPORT.md":"037ba70706165f489195fa2ea3a196b20a7ab5e25f341cc1cd8ab1016a0043af"}
          assert len(current['evidence'])==6 and {x['path'] for x in current['evidence']}==set(expected)
          for row in current['evidence']:
            raw=Path(row['path']).read_bytes()
            assert len(raw)==row['bytes']
            assert hashlib.sha256(raw).hexdigest()==row['sha256']==expected[row['path']]
          frozen={
            'evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json':'dc03c181912ffbb800bc191fbc16ec0d05c335e0',
            'evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json':'899373e4a1dc1999d1485ac8c1f790d39071aebd',
            'evidence/c62/C62_ORIGINAL_45ZIP_1H_SNR_RB_MB_IMB_LIQUIDITY_COMPLETE_SOURCE.json':'8428bf7d6cd3bc26f617cfc32a34c91a27c813b2',
            'evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json':'fdc77c7ec942f03b4efae83b935d994c8435a24f',
            'evidence/c66/C66_ORIGINAL45ZIP_4H1H_TO_NATIVE15M_SOURCE_FIRST_ANY_ROUTE_A.json':'c693058cdb28b0e118879d32ddcbbd0d2a66bfc6',
            'evidence/c67/C67_ORIGINAL45ZIP_ROUTE_A_1H_TRIGGER_NEW_POI_15M_FIRST_RETEST_FORK.json':'87409101a6fad4897b32e13085c9a0cc13566594',
            'evidence/c68/C68_ORIGINAL45ZIP_STRONGHL_POST_CONTACT_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json':'587779a7dd1736099e8270c8823c15822f0e77a0',
            'evidence/c69/C69_ORIGINAL45ZIP_FIRST_NATIVE15M_LIQUIDITY_RAID_OR_NEW1H_POI_SOURCE_TEST.json':'b22860dfa13e4b19d16e8dd892719a772485e847',
            'evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json':'e100ca8a70a32484fd311ae2dcf31a311d85865c'}
          for path,blob in frozen.items():
            assert subprocess.check_output(['git','rev-parse','HEAD:research/mtf-element-audit-v1/'+path],text=True).strip()==blob
          p=Path('evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json')
          assert p.stat().st_size==214905
          d=json.loads(p.read_bytes())
          assert d['original_zip_counts']['total']==45 and d['source_4h_C46_parent_count']==153
          assert d['original_native3m_closed']==76800 and d['original_native15m_closed']==15360
          assert d['original_native1d_closed']==160 and d['derived_closed1h']==3840
          assert d['source_first_exact_native3m_contact_state_totals']=={
            'C69_SOURCE_15M_BAR_MISSING':0,
            'NEW1H_POI_FIRST_ORIGINAL3M_WICK_TEST_NOT_AUTHOR_VALID':35,
            'NO_C69_UNAMBIGUOUS_SOURCE_CONTACT':95,
            'NO_ORIGINAL3M_WICK_CROSS':0,
            'RAID_FIRST_ORIGINAL3M_CLOSE_THROUGH_LEVEL_NOT_AUTHOR':8,
            'RAID_FIRST_ORIGINAL3M_WICK_ONLY_NOT_AUTHOR':15}
          assert d['author_verified_original3m_first_wick_is_owner_valid']==0
          assert d['orders']==d['fills']==d['trades']==0
          assert d['readiness']=='NOT_TRADE_READY'
          print('C70_A140_FINAL_ALL_140_SHA_SIX_ORIGINAL_SOURCE_OLD_FROZEN_GIT_BLOBS_PASS')
          PY
          cd d05
          python -m unittest -v test_c70_exact_native3m_first_raid_or_poi_source_wick 2>&1 | tee /tmp/C70
          grep -Fq 'Ran 20 tests' /tmp/C70
          grep -qx 'OK' /tmp/C70
          ! grep -q 'skipped=' /tmp/C70
