name: A237 TrendFollowing Original Common Account USD-M Futures
on:
  push:
    branches:
      - 'research/a237-trendfollowing-author-account-20261031'
    paths:
      - 'research/a237_author_account/**'
      - '.github/workflows/ember-a237-author-account.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_author_account:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FREQTRADE__EXCHANGE__KEY: ""
      FREQTRADE__EXCHANGE__SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproducible pinned 2026.9 native Freqtrade
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'freqtrade==2026.9' technical pandas pyarrow
          python -m freqtrade --version
          python -m pip freeze > research/a228_five_original/native_pip_freeze.txt
      - name: Complete four original author pair real Binance futures dataset and funding
        run: python -m research.a237_author_account.a237_prepare_data
      - name: Native author common account parity 6 predeclared cost/period runs
        run: python -m research.a237_author_account.a237_run_author
      - name: Preserve full evidence even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a237-trendfollowing-original-four-pair-unlimited-stake
          path: |
            research/a228_five_original/native_pip_freeze.txt
            research/a228_five_original/generated/A228_ORIGINAL_AND_MARKET_RECEIPTS.json
            research/a228_five_original/generated/native_backtests_a237/**
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
