name: MTF C29 — Independent 45 ZIP and Python Matrix (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c29-independent-45zip-matrix.yml'
      - 'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-c29-independent-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  negative-python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify all 98 prior SHA record evidence bytes
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/c29-prior-ledger.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/c29-prior-ledger.json'))
          assert d['events']==98 and d['validations_pass']
          assert d['tip_sha256']=='292eece6faea4de832b825d0b76c280932d5ece14bcb37bfaa3e1abbf6bbcddc'
          print('C29_PREDECESSOR_SHA_98_PASS')
          PY
      - name: Re-evaluate all 24 academic RB SNR MB negative controls
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c29_rb_snr_source_guards 2>&1 | tee /tmp/c29-negative.log
          grep -q 'Ran 24 tests' /tmp/c29-negative.log
  original-independent-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original C26 C27 C28 C29 immutable git blobs
        run: |
          python - <<'PY'
          import subprocess
          refs={
            'research/mtf-element-audit-v1/evidence/c26/C26_UNSWEPT_1H_FTA_ORIGINAL_SOURCE.json':'11edbf5ddf8e89e513fc3893e807903bbf8933eb',
            'research/mtf-element-audit-v1/evidence/c27/C27_ORIGINAL_1H_EQ_SESSION_SOURCE.json':'d434ae830858fecf5e45cf7ef8ff7db1e627d489',
            'research/mtf-element-audit-v1/evidence/c28/C28_ORIGINAL_1H_CLASSIC_IMB_FTA_SOURCE.json':'ed3aca9384c8e49d07220f04b7d363df92689317',
            'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json':'abd68cb7cb86087c83423d16e9bbdd2cb344224c'}
          for path,want in refs.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              assert actual==want,(path,actual,want)
          print('C29_PRIOR_AND_CURRENT_FULL_SOURCE_GIT_BLOBS_FROZEN_PASS')
          PY
      - name: Independently reload 45 original Futures archives and compare ALL source JSON
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c29_original_1h_rb_snr_source_gate.py /tmp/c29-independent-full.json 2>&1 | tee /tmp/c29-independent-full.log
          python - <<'PY'
          import json
          a=json.load(open('research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json'))
          b=json.load(open('/tmp/c29-independent-full.json'))
          assert a==b,'C29_ORIGINAL_SOURCE_45ZIP_ALL_JSON_FIELDS_DRIFT'
          t=a['totals']
          assert a['original_archive_count']==45
          assert a['original_native3m_source_rows']==76800
          assert a['native15m_exact_decimal_equalities']==15360
          assert t['source_hours']==3840
          assert t['original_parent_edges']==539 and t['research_single_cases']==165
          assert t['source_opposite_pairs']==1989
          assert t['source_followed_pairs']==1988
          assert t['source_extreme_envelope_follow_through']==403
          assert t['case_preknown_pair_relations']==34348
          assert t['case_preknown_technical_follow_through_relations']==6728
          assert t['cases_with_pair_relation']==165
          assert t['cases_with_technical_follow_through']==165
          assert a['author_positive_rb_examples']==0
          assert a['author_positive_snr_examples']==0
          assert a['author_selected_first_fta']==a['author_trades_approved']==0
          assert a['readiness']=='NOT_TRADE_READY'
          print('C29_INDEPENDENT_45ZIP_FULL_SOURCE_JSON_PASS_NO_RB_SNR_APPROVAL')
          PY
  frozen-run-witness:
    needs: [negative-python-matrix,original-independent-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Freeze successful independent source and 3-Python validation run
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c29/C29_INDEPENDENT_RUN_WITNESS.json
          if test -e "$p"; then echo 'Already independently pinned'; exit 0; fi
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('research/mtf-element-audit-v1/evidence/c29/C29_INDEPENDENT_RUN_WITNESS.json')
          path.write_text(json.dumps({
            'schema':'EMBER_C29_45_ORIGINAL_ZIP_SOURCE_PAIR_GATE_INDEPENDENT_V1',
            'run_id':int(os.environ['RUN_ID']),
            'trigger_commit':os.environ['HEAD_SHA'],
            'original_receipt_git_blob':'abd68cb7cb86087c83423d16e9bbdd2cb344224c',
            'independently_refetched_zip':45,
            'original_native3m_rows':76800,
            'exact_15m_decimal_equalities':15360,
            'all_json_case_evidence_equal':True,
            'python_matrix':['3.10','3.11','3.12'],
            'negative_controls_per_version':24,
            'author_rb_snr_approved':0,
            'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(C29): pinned independent 45-ZIP source pair and Python matrix witness"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
