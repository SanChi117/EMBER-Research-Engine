name: RESET-05 Part 3 Immutable Strategy Registry

on:
  push:
    branches: [research/reset05-registry-part3-20261101]
  pull_request:
  workflow_dispatch:

jobs:
  preregistry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check research/platform/strategy_registry.py tests/test_reset05_strategy_registry.py
      - name: Verify immutable registry and Git edit history
        run: python -m research.platform.strategy_registry --root research/registry --verify-history
      - name: Registry tamper and existing PAPER risk/ledger regressions
        run: python -m pytest tests/test_reset05_strategy_registry.py tests/test_reset05_paper_ledger.py tests/test_risk_guard.py tests/test_reboot_platform.py -q
