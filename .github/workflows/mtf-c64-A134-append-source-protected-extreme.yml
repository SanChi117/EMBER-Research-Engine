          from pathlib import Path
          p=Path('evidence/c64/C64_ORIGINAL45ZIP_STRICT_SOURCE_EXTREME_PRECONFIRM_POST_WICK_CLOSE_INVALIDATION.json')
          w=Path('evidence/c64/C64_INDEPENDENT_ORIGINAL45ZIP_PROTECTED_SOURCE_EXTREME_WITNESS_20261025.json')
