          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          assert q['first_original45_zip_replay_success_run']==40213320619
          assert q['independent_second_original45_zip_replay_success_run']==40213466284
          assert q['independent_second_workflow_jobs']=='SUCCESS_4_OF_4'
          assert q['full_original_source_sha256']==sha and q['independent_tests_per_python']==28
          print('C64_A134_INDEPENDENT_ORIGINAL45ZIP_SIX_SOURCE_EVIDENCE_ACCEPTED')
