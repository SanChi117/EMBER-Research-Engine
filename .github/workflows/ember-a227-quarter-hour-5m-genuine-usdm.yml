name: A227 Quarter-hour Binance USD-M 5m Pressure Proxy Economics

on:
  push:
    branches:
      - 'research/a227-quarter-hour-imbalance-5m-screen-20261031'
    paths:
      - 'research/a227_quarter_hour/**'
      - '.github/workflows/ember-a227-quarter-hour-5m-genuine-usdm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price_flow_5m_paper_proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.1.3 pandas==2.2.3
      - name: Real 5m Binance USDT-M candles and settled funding 2024-2026, frozen proxy 4h/8h
        run: python research/a227_quarter_hour/a227_5m_opening_imbalance_genuine_usdm.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a227-quarter-hour-real-usdm-five-min-proxy-economic-ledger
          path: |
            research/a227_quarter_hour/evidence/A227_NATIVE_QUARTER_HOUR_PROXY_ECONOMICS.json
            research/a227_quarter_hour/evidence/A227_NATIVE_5M_PROXY_TRADE_LEDGER.json
          if-no-files-found: warn
          retention-days: 30
