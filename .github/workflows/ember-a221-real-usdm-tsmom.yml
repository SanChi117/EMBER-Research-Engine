name: A221 Real USD-M TSMOM Historical Replay

on:
  push:
    branches:
      - 'research/a221-broad-futures-semantic-screen-and-tsmom-replay-20261031'
    paths:
      - 'research/a221_wide_futures_screen/**'
      - '.github/workflows/ember-a221-real-usdm-tsmom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_tsmom_genuine_futures:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only numerical libs
        run: pip install numpy==2.1.3 pandas==2.2.3
      - name: 204 genuine Binance UM price+funding ZIP, SHA verification, 3 independent historical windows
        run: python research/a221_wide_futures_screen/a221_tsmom_genuine_futures.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a221-native-binance-um-tsmom-historical-audit
          path: research/a221_wide_futures_screen/evidence/A221_TSMOM_REAL_BINANCE_REPLAY.json
          if-no-files-found: warn
          retention-days: 30
