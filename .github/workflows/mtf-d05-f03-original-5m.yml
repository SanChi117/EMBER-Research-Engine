name: MTF D05 F03 - Original Binance Futures 5m Bridge (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-d05-f03-original-5m.yml'
      - 'research/mtf-element-audit-v1/d05/f03_5m_original_source.py'
      - 'research/mtf-element-audit-v1/d05/test_f03_5m_original_source.py'
      - 'research/mtf-element-audit-v1/tests/probe_f03_binance_original_5m_15m.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-five-minute-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard original v05 and historical C08 15m receipt unmodified
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Synthetic original source ZIP negative mutations and 5m no-lookahead
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_f03_5m_original_source 2>&1 | tee /tmp/f03-unit.txt
          grep -q 'Ran 23 tests' /tmp/f03-unit.txt
          grep -Eq '^OK$' /tmp/f03-unit.txt
      - name: Independent remote 5m and frozen C08 original 15m ZIP OHLCV parity
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_f03_binance_original_5m_15m.py /tmp/f03-original-source.json 2>&1 | tee /tmp/f03-original-source.log
          python - <<'PY'
          import json
          p=json.load(open('/tmp/f03-original-source.json'))
          assert p['source_5m_rows']==288 and p['source_15m_rows']==96
          assert p['five_to_fifteen_minute_ohlcv_parity'] is True
          assert p['fifteen_minute_candles_exact_5m_ohlcv_matches']==96
          assert p['green_blue_5m_routes_academically_ready'] is False
          assert p['frozen_c08_315_coverage_modified'] is False
          assert p['self_certified_author_vc'] is False
          assert p['ready']=='NOT_TRADE_READY'
          print('5M_RAW_BINANCE_FUTURES_DAY_288_ROWS_AND_15M_96_PARITY_PASS__ZERO_AUTHOR_VC')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f03-original-binance-5m-zip-and-c08-15m-comparison
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/f03-unit.txt
            /tmp/f03-original-source.json
            /tmp/f03-original-source.log
