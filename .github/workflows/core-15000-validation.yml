name: EMBER Core 15000 Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ember/research/profiles.py"
      - "scripts/run_core_validation.py"
      - "tests/test_diagnostics.py"
      - ".github/workflows/core-15000-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -v
      - name: Download and validate six core symbols
        run: |
          mkdir -p results
          python scripts/run_core_validation.py \
            --symbols INJUSDT,TONUSDT,DOGEUSDT,ARBUSDT,NEARUSDT,OPUSDT \
            --profiles baseline,structure-bias,high-vol-block,opposite-liquidity \
            --interval 15m \
            --bars 15000 \
            --data-dir data/core_validation \
            --out-dir results/core_validation \
            --skip-wfo \
            | tee results/core_validation_stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-core-15000-validation
          path: |
            results/core_validation/
            results/core_validation_stdout.txt
            data/core_validation/
          if-no-files-found: warn
