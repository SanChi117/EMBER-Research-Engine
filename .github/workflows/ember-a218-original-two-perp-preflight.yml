name: A218 Original 2-Perp Futures Source/Accounting Preflight

on:
  push:
    branches:
      - 'research/a218-original-pair-futures-accounting-audit-20261031'
    paths:
      - 'research/a218_pair_futures/**'
      - '.github/workflows/ember-a218-original-two-perp-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_two_perp_preflight:
    name: Real Binance USD-M original signal, source SHA and accounting gate
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated original source dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 statsmodels==0.14.4
      - name: Check original source and real Binance archives; assert blocked futures accounting
        run: python research/a218_pair_futures/a218_original_source_market_preflight.py
      - name: Attach factual machine receipt, not PnL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a218-original-futures-source-accounting-preflight
          path: research/a218_pair_futures/evidence/a218_original_preflight.json
          if-no-files-found: warn
          retention-days: 30
