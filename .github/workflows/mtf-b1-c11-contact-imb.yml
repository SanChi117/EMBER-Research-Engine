name: MTF B1 C11 — Source-Witnessed StrongHL Candidate Boundaries (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c11-contact-imb.yml'
      - 'research/mtf-element-audit-v1/d05/c11_contact_imb_source_witness.py'
      - 'research/mtf-element-audit-v1/d05/test_c11_contact_imb_source_witness.py'
      - 'research/mtf-element-audit-v1/tests/probe_c11_real_raid_imb_poi_witnesses.py'
      - 'research/mtf-element-audit-v1/evidence/c11/C11_F06_SOURCE_PRICE_CANDIDATE_DIAGNOSTICS.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  only-price-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze original course primitives and F06 receipts
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json)" = a5bf2105d1c611517a8d127d5e1f8cb622720162
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c11/C11_F06_SOURCE_PRICE_CANDIDATE_DIAGNOSTICS.json)" = 513c950c311efc12fab95ce64f4ac47f0f6003f3
      - name: Original course v05 primitives
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/c11-v05.txt
          grep -q 'Ran 29 tests' /tmp/c11-v05.txt
          grep -Eq '^OK$' /tmp/c11-v05.txt
      - name: Two day boundaries and geometric StrongHL candidate source witnesses
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness 2>&1 | tee /tmp/c11-tests.txt
          grep -q 'Ran 39 tests' /tmp/c11-tests.txt
          grep -Eq '^OK$' /tmp/c11-tests.txt
          echo '68_SOURCE_BOUND_READ_ONLY_TESTS_PASS__ZERO_AUTHOR_CERTIFIED_SIGNALS'
      - name: Actual 10 pinned original Binance 5m ZIP replay for raid to IMB and possible POI touch
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c11_real_raid_imb_poi_witnesses.py /tmp/c11-real.json 2>&1 | tee /tmp/c11-real.log
          python - <<'PY'
          import json
          p=json.load(open('/tmp/c11-real.json'))
          assert p['original_5m_zip_sources']==10
          assert p['verified_raw_closed_5m']==2880
          assert p['academic_approved_stronghl']==0
          assert p['academic_approved_vc']==0 and p['trade_ready'] is False
          assert p['original_f06_and_c08_unchanged'] is True
          assert all(r['stronghl_vc_semantics']=='UNAPPROVED_NOT_AUTHOR_VERIFIED' for r in p['results'])
          print('10_ACTUAL_BINANCE_5M_ZIP_GEOMETRIC_WITNESSES_ONLY_NO_TRADE_APPROVAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-b1-c11-stronghl-geometry-test-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c11-v05.txt
            /tmp/c11-tests.txt
            /tmp/c11-real.json
            /tmp/c11-real.log
