name: MTF D05 F02 - Order Flow Source Semantic Boundaries (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-d05-f02-of-source.yml'
      - 'research/mtf-element-audit-v1/d05/of_source_semantic_claims.py'
      - 'research/mtf-element-audit-v1/d05/test_of_source_semantic_claims.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academic-text-semantic-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve pre-existing academic primitives and schematic proof
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/d05/C02_TDA_SOURCE_ROUTE_TOPOLOGY.json)" = 8d3ecf4bdf82be14e3a1da2f132425feaa45fed3
      - name: Original 29 academic primitives and 46 sourced TDA/OF counterexamples
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/d05-f02-original.txt
          grep -q 'Ran 29 tests' /tmp/d05-f02-original.txt
          grep -Eq '^OK$' /tmp/d05-f02-original.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_tda_source_route_contract test_of_source_semantic_claims 2>&1 | tee /tmp/d05-f02-semantics.txt
          grep -q 'Ran 46 tests' /tmp/d05-f02-semantics.txt
          grep -Eq '^OK$' /tmp/d05-f02-semantics.txt
          echo '75_TECHNICAL_TESTS_PASS_NO_COURSE_TRADE_CERTIFICATION'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-d05-f02-of-source-counterexamples
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/d05-f02-original.txt
            /tmp/d05-f02-semantics.txt
