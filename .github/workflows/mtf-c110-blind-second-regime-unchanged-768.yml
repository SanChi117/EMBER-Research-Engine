name: EMBER C110 blind second-regime unchanged C109 768 genuine Binance crypto ZIP
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c110-blind-second-regime-unchanged-768.yml'
      - 'research/mtf-element-audit-v1/d05/c110_*.py'
      - 'research/mtf-element-audit-v1/d05/test_c110_*.py'
permissions:
