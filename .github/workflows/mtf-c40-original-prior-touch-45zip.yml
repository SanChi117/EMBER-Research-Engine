name: MTF C40 Original 45 ZIP Prior FTA Touch Test
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c40-original-prior-touch-45zip.yml'
      - 'research/mtf-element-audit-v1/tests/probe_c40_original_fta_prior_touch_45zip.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-45zip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only prior SHA and 19 negative tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          cd d05
          python -m unittest -v test_c40_pre_bos_fta_touch_state
      - name: Original source 45 ZIP 4 BOS x 3 FTA prior touch replay
        run: |
          python research/mtf-element-audit-v1/tests/probe_c40_original_fta_prior_touch_45zip.py /tmp/c40.json
      - name: Ensure complete original research and no trade creation
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/c40.json'))
          assert x['source_original_45_usdm_zip']==45
          assert x['original_closed_native3m']==76800
          assert x['native15m_exact_decimal']==15360
          assert x['route_count']==12
          assert len(x['summary_by_route'])==12
          assert x['orders']==x['trades']==x['original_author_freshness_goldens']==0
          assert x['readiness']=='NOT_TRADE_READY'
          print('C40_SOURCE_FIRST_TOUCH_STATE_ONLY_PASS')
          PY
      - name: Freeze complete source-only C40 prior touch JSON after passing
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c40/C40_ORIGINAL_PRE_BOS_PRIOR_FTA_TOUCH_STATES.json
          if test -e "$p"; then echo 'Already pinned'; exit 0; fi
          mkdir -p "$(dirname "$p")"
          cp /tmp/c40.json "$p"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(C40): 45 original ZIP 12 FTA route prior native3m touch states"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
