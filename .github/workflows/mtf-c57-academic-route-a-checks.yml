name: C57 Route A original 15m research checks
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c57-academic-route-a-checks.yml'
      - 'research/mtf-element-audit-v1/d05/c57_route_a_original15m_first_imb_after_1h_source.py'
      - 'research/mtf-element-audit-v1/d05/test_c57_route_a_original15m_first_imb_after_1h_source.py'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check 126 previous recorded cycles
        run: |
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py
      - name: Test C57 isolated research logic
        run: |
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c57_route_a_original15m_first_imb_after_1h_source
