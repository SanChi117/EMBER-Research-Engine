name: EMBER C108 A171 FINAL 320 genuine Binance ZIP and 2205 causal tests economic FAIL
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c108-A171-final-4h-1h-linked.yml'
permissions:
  contents: read
jobs:
  independent-a171-evidence-and-735-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify full 171-entry journal, six pinned source artifacts and negative economics
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/c108-final-a171
          grep -Fq 'entries 171 tip_sha256 908f96d82a47c06331e44d9a0d53913d58fb0fcc381137f0c03801ebe98fbff8' /tmp/c108-final-a171
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          base=Path('.')
          a=[json.loads(v) for v in (base/'ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text().splitlines()]
          assert len(a)==171 and a[-1]['action_id']=='A171'
          assert a[-1]['prev_sha256']=='994ada611359b4ae555dff7ee102bedb531e70a3660a67bab9eb8440706fed45'
          assert a[-1]['record_sha256']=='908f96d82a47c06331e44d9a0d53913d58fb0fcc381137f0c03801ebe98fbff8'
          assert len(a[-1]['evidence'])==6
          for e in a[-4:]:
            for p in e['evidence']:
              raw=(base/p['path']).read_bytes()
              assert len(raw)==p['bytes'] and hashlib.sha256(raw).hexdigest()==p['sha256']
          sys.path.insert(0,str(base/'d05'))
          import c108_owner_child_native3m_paper_research as r
          r.check_freeze()
          raw=(base/'evidence/c108/C108_OWNER_LINKED_4H_H1_CHILD_15M_IMB_ORIGINAL_320ZIP.json').read_bytes()
          assert len(raw)==146773
          assert hashlib.sha256(raw).hexdigest()=='4e11402dcc1a5746601f7cd3efcba4d1bbced6e5044135e158913506b6567eb3'
          x=json.loads(raw)
          assert len(x['original_source_manifest'])==320 and x['native3m_bars']==153600
          assert x['source_zip_count']==320 and len(x['trades'])==2
          assert x['scores']['25']['sum_r']==-2.17608
          assert x['scores']['25']['pf']==0 and x['admission']['passes_historical_screen'] is False
          assert x['admission']['live_approved'] is False
          assert x['orders']==x['fills']==x['live_trades']==[]
          for t in x['trades']:
            assert t['parent_tf']==t['stop_source_tf']==t['target_source_tf']=='4H'
            assert t['zone_created_ms']<t['4h_parent_first_touch_ms']<t['1h_child_created_ms']<t['1h_child_first_test_ms']<t['15m_direct_imb_vc_ms']==t['entry_ms']
            assert t['stop_policy']=='EXECUTABLE_NATIVE3M_PROTECTIVE_4H_ZONE_EDGE_ATR4H'
          print('C108_A171_FULL_SOURCE_320_2_NEGATIVE_PAPER_TRADES_PRECOMMIT_PIN_PASS')
          PY
      - name: All old and 25 new 735 tests once per interpreter
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -q test_c84_route_a_paper_fsm test_c85_owner_narrative_golden_firewall test_c86_original153_first_test_receipts test_c87_adapted_route_a_shadow_gate test_c88_adaptation_test_exit_gate test_c89_original_native5m_adaptation_backtest test_c90_structural_fta_backtest test_c91_continuous_causal_route_a_paper test_c92_extended_original_native5m_full_continuous test_c93_native3m_raid_bos_route_c_research test_c94_idm_limit_route_b_research test_c95_integrated_paper_three_routes test_c96_canonical_history_warmup_invariance test_c97_robustness_regime_cost_gate test_c98_new_oct_original_forward_paper test_c99_native3m_window_depth_stability test_c100_frozen_c98_loss_forensics test_c101_original_native_bar_trade_attribution test_c102_c103_native3m_new_symbol_transfer test_c104_structural_quality_new10 test_c105_parent4h_only_geometry test_c106_only_existing_p4_semantics test_c107_rootcause_original_source_semantics test_c108_minimal_owner_h4_h1_child_firsttest 2>&1 | tee /tmp/c108-final-tests
          grep -Fq 'Ran 735 tests' /tmp/c108-final-tests
          grep -qx 'OK' /tmp/c108-final-tests
          echo 'C108_A171_FINAL_735_X3_2205_PASS'
