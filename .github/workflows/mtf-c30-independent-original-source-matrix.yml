name: MTF C30 — Independent Prior 1H Wick + IMB Source Matrix (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c30-independent-original-source-matrix.yml'
      - 'research/mtf-element-audit-v1/evidence/c30/C30_ORIGINAL_PRIOR_WICK_IMB_CAUSAL_SOURCE.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-c30-independent-source-matrix
  cancel-in-progress: false
jobs:
  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify original A099 99 hash records and source bytes
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/c30-journal.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/c30-journal.json'))
          assert x['events']==99 and x['validations_pass']
          assert x['tip_sha256']=='b02747002f9b6109820d6c5d1bdb131acfa1a3933ca91acc6ce707e1ca0372fe'
          print('C30_OLD_99_SHA_FULL_CHAIN_PASS')
          PY
      - name: Execute all 25 strict known-before-wick source tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c30_causal_wick_liquidity_imb 2>&1 | tee /tmp/c30-negative.log
          grep -q 'Ran 25 tests' /tmp/c30-negative.log
  original-independent-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin source C26 to C30 exact original Git blob IDs
        run: |
          python - <<'PY'
          import subprocess
          checks={
            'research/mtf-element-audit-v1/evidence/c26/C26_UNSWEPT_1H_FTA_ORIGINAL_SOURCE.json':'11edbf5ddf8e89e513fc3893e807903bbf8933eb',
            'research/mtf-element-audit-v1/evidence/c27/C27_ORIGINAL_1H_EQ_SESSION_SOURCE.json':'d434ae830858fecf5e45cf7ef8ff7db1e627d489',
            'research/mtf-element-audit-v1/evidence/c28/C28_ORIGINAL_1H_CLASSIC_IMB_FTA_SOURCE.json':'ed3aca9384c8e49d07220f04b7d363df92689317',
            'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json':'abd68cb7cb86087c83423d16e9bbdd2cb344224c',
            'research/mtf-element-audit-v1/evidence/c30/C30_ORIGINAL_PRIOR_WICK_IMB_CAUSAL_SOURCE.json':'ff57e0d99b5a87d74a2bfab0eed99cee32206812'}
          for p,w in checks.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert actual==w,(p,actual,w)
          print('C30_ALL_FROZEN_NATIVE_SOURCE_BLOBS_PASS')
          PY
      - name: Independently reload original 45 Binance USD-M ZIP and FULL source JSON
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c30_original_causal_wick_imb.py /tmp/c30-independent.json 2>&1 | tee /tmp/c30-independent.log
          python - <<'PY'
          import json
          a=json.load(open('research/mtf-element-audit-v1/evidence/c30/C30_ORIGINAL_PRIOR_WICK_IMB_CAUSAL_SOURCE.json'))
          b=json.load(open('/tmp/c30-independent.json'))
          assert a==b,"C30_ORIGINAL_45ZIP_FULL_JSON_DRIFT"
          t=a['totals']
          assert a['original_binance_usdm_zip_count']==45
          assert a['native3m_original_rows']==76800
          assert a['native15m_exact_decimal_equalities']==15360
          assert t['original_parent_edges']==539 and t['research_single_cases']==165
          assert t['original_closed_1h']==3840
          assert t['source_known_fractals']==1873
          assert t['source_classic_1h_imb']==646
          assert t['opposite_1h_pairs']==1989
          assert t['pairs_with_first_liquidity_wick']==690
          assert t['pairs_with_first_imb_wick']==330
          assert t['pairs_with_any_wick_interaction']==1758
          assert t['case_preknown_pair_links']==34348
          assert t['cases_with_first_liquidity_wick_link']==164
          assert t['cases_with_first_imb_wick_link']==158
          assert a['author_approved_trades']==0 and a['readiness']=='NOT_TRADE_READY'
          print('C30_INDEPENDENT_ORIGINAL_45ZIP_ALL_CASE_WICK_FIRST_JSON_PASS')
          PY
      - name: Preserve complete JSON replay mismatch diagnosis and first changed field
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path('research/mtf-element-audit-v1/evidence/c30/diagnostics')
          d.mkdir(parents=True,exist_ok=True)
          log=pathlib.Path('/tmp/c30-independent.log')
          d.joinpath('C30_INDEPENDENT_REPLAY_ERROR_'+os.environ['RUN_ID']+'.json').write_text(
            json.dumps({'run_id':int(os.environ['RUN_ID']),
              'trigger_sha':os.environ['HEAD_SHA'],
              'independent_full_json_pass':False,
              'exact_log_tail':log.read_text(errors='replace')[-8500:] if log.exists() else 'NO_LOG',
              'readiness':'NOT_TRADE_READY'},sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf-element-audit-v1/evidence/c30/diagnostics/C30_INDEPENDENT_REPLAY_ERROR_*.json
          git commit -m "diagnostic(C30): persist first field divergence on pinned 45-ZIP independent JSON"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
  independently-pinned-source-witness:
    needs: [python-matrix,original-independent-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Freeze full independent 45 original ZIP and 3 Python matrix PASS witness
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c30/C30_INDEPENDENT_RUN_WITNESS.json
          if test -e "$p"; then echo "already independent"; exit 0; fi
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/mtf-element-audit-v1/evidence/c30/C30_INDEPENDENT_RUN_WITNESS.json')
          p.write_text(json.dumps({
              'schema':'EMBER_C30_NATIVE_PRIOR_WICK_IMB_45ZIP_INDEPENDENT_V1',
              'run_id':int(os.environ['RUN_ID']),
              'trigger_commit':os.environ['HEAD_SHA'],
              'full_original_source_git_blob':'ff57e0d99b5a87d74a2bfab0eed99cee32206812',
              'original_usdm_zip':45,'native3m_rows':76800,
              'native15m_decimal_equalities':15360,
              'complete_pinned_json_equal':True,
              'python_matrix':['3.10','3.11','3.12'],
              'adversarial_source_tests_per_python':25,
              'research_cases':165,
              'author_rb_snr_bos_fta_approval':0,
              'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(C30): independent 45 original ZIP causal wick-IMB and 3 Python 25-test matrix"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015

  failed-gate-diagnostic:
    needs: [python-matrix,original-independent-source,independently-pinned-source-witness]
    if: ${{ always() && (needs.python-matrix.result != 'success' || needs.original-independent-source.result != 'success' || needs.independently-pinned-source-witness.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve independent gate failure reasons and run id
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          MATRIX_RESULT: ${{ needs.python-matrix.result }}
          SOURCE_RESULT: ${{ needs.original-independent-source.result }}
          WITNESS_RESULT: ${{ needs.independently-pinned-source-witness.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/mtf-element-audit-v1/evidence/c30/diagnostics/C30_INDEPENDENT_FAILED_STAGE.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'run_id':int(os.environ['RUN_ID']),
            'trigger_sha':os.environ['HEAD_SHA'],
            'python_matrix':os.environ['MATRIX_RESULT'],
            'original_45zip_json_replay':os.environ['SOURCE_RESULT'],
            'independent_witness':os.environ['WITNESS_RESULT'],
            'accepted':False,'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf-element-audit-v1/evidence/c30/diagnostics/C30_INDEPENDENT_FAILED_STAGE.json
          git commit -m "diagnostic(C30): persist failed stage in independent 45 ZIP source matrix"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
