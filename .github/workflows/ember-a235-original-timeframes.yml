name: A235 Original timeframes restored - three strategies eighteen diagnostic native runs
on:
  push:
    branches: ['research/a235-original-timeframe-correction']
    paths: ['research/a235_timeframe/**', '.github/workflows/ember-a235-original-timeframes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FREQTRADE__EXCHANGE__KEY: ""
      FREQTRADE__EXCHANGE__SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Same native runtime as A230
        run: |
          python -m pip install 'freqtrade==2026.9' technical pandas pyarrow
          python -m pip freeze > a235_pip_freeze.txt
      - name: Pinned originals and genuine Binance OHLCV mark funding
        run: python research/a228_five_original/a228_prepare_pinned_originals_and_real_futures.py
      - name: Correct timeframe only - no optimization or original logic changes
        run: python research/a235_timeframe/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a235-original-timeframes-three-strategies-native
          path: |
            a235_pip_freeze.txt
            research/a228_five_original/generated/A228_ORIGINAL_AND_MARKET_RECEIPTS.json
            research/a228_five_original/generated/a235_config.json
            research/a228_five_original/generated/a235_backtests/**
          retention-days: 90
          if-no-files-found: warn
