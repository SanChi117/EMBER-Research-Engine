name: Bootstrap EMBER import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-import.yml"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import EMBER from the closed source PR
        shell: bash
        run: |
          set -euo pipefail

          git clone --no-checkout https://github.com/SanChi117/Smoke-strategy.git /tmp/smoke-source
          git -C /tmp/smoke-source fetch origin refs/pull/11/head
          git -C /tmp/smoke-source checkout --detach FETCH_HEAD

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rm -rf .github/workflows
          mkdir -p .github/workflows

          cp -a /tmp/smoke-source/ember-research-engine/. .

          cat > .github/workflows/ci.yml <<'YAML'
          name: EMBER Research Engine CI

          on:
            push:
            pull_request:

          jobs:
            research-matrix:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.10", "3.11", "3.12"]

              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                    cache-dependency-path: pyproject.toml
                - name: Install
                  run: |
                    python -m pip install --upgrade pip
                    pip install -e ".[dev]"
                - name: Ruff
                  run: ruff check ember/ tests/ scripts/
                - name: Tests
                  run: pytest tests/ -v
                - name: Leakage gate
                  run: pytest tests/test_no_leakage.py -v
          YAML

          sed -i 's/cd ember-research-engine/cd EMBER-Research-Engine/g' README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b import/ember-research-engine-v0.2.0
          git add -A
          git commit -m "Import EMBER Research Engine 0.2.0"
          git push origin import/ember-research-engine-v0.2.0
