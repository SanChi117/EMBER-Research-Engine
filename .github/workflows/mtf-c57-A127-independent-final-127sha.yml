name: EMBER C57 independent A127 127 SHA all six original Route A evidence 42 x3
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c57-A127-independent-final-127sha.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
permissions:
  contents: read
jobs:
  sha_127:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independently verify previous and new all 127 SHA, six frozen C57 evidence, native original source and 42 negative unit tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/ledger
          grep -Fq 'entries 127 tip_sha256 f7f82c55dd87db0bc881ef977e9e9b0db1c91495f827d47f86701934e05c9005' /tmp/ledger
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          j=[json.loads(x) for x in Path('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text().splitlines()]
          assert len(j)==127
          old,new=j[-2:]
          assert old['action_id']=='A126' and old['record_sha256']=='f47e459f6fda6bed5fc89d61a172b120eceee0702596cfd9de21f3382ec23dba'
          assert new['seq']==127 and new['action_id']=='A127' and new['prev_sha256']==old['record_sha256']
          assert new['record_sha256']=='f7f82c55dd87db0bc881ef977e9e9b0db1c91495f827d47f86701934e05c9005'
          assert new['cycle']=='B1/C57' and new['verdict']=='DONE' and new['cycle_result']=='PASSED'
          target={
           'd05/c57_route_a_original15m_first_imb_after_1h_source.py':'8cc409592c94f24ea4ba8c5b6c0758c20d010e4590a63b9f85685418d8123454',
           'd05/test_c57_route_a_original15m_first_imb_after_1h_source.py':'56e5dd0acba5dce55030896d1acfffb29c206dad0bda31534caaca0f1772a92f',
           'tests/probe_c57_original45zip_route_a_4h_1h_native15m_first_imb.py':'843ba6ba870538623dff97d0018803a512927d3126289704dafc044f3aef1460',
           'evidence/c57/C57_ORIGINAL_45ZIP_4H_FIRST_CONTACT_LATER_1H_THEN_FIRST_ANY_NATIVE15M_IMB.json':'3ce556499294bb005f4ecfc57a817488ab6a66ef498c1181ceca2874acff1b95',
           'evidence/c57/C57_INDEPENDENT_45ZIP_NATIVE15M_FIRST_ANY_WITNESS_20261025.json':'c9ba7930ee7536121c75a75b357b67ffa701710f0f1a8062160a37e6fbefd875',
           'cycles/B1_C57_ROUTE_A_NATIVE15M_ORIGINAL_FIRST_ANY_SOURCE_REPORT.md':'42787dea817ae1ecd08374873b5af08ca1802e1933965f378ebdc383d802f898'}
          assert len(new['evidence'])==6 and {e['path'] for e in new['evidence']}==set(target)
          for e in new['evidence']:
            blob=Path(e['path']).read_bytes()
            assert len(blob)==e['bytes'] and hashlib.sha256(blob).hexdigest()==e['sha256']==target[e['path']]
          data=json.loads(Path('evidence/c57/C57_ORIGINAL_45ZIP_4H_FIRST_CONTACT_LATER_1H_THEN_FIRST_ANY_NATIVE15M_IMB.json').read_bytes())
          assert data['source_archives']['total']==45 and data['native_original3m_closed']==76800
          assert data['native_original15m_closed']==data['independent_original3m_native15m_OHLCV_equalities']==15360
          assert data['statuses']=={'FIRST_ANY_NATIVE15M_IMB_SAME_SIDE_AS_4H':59,'FIRST_ANY_NATIVE15M_IMB_OPPOSITE_SIDE_TO_4H':65,'NO_ORIGINAL_3M_FIRST_CONTACT':21,'NO_POST_CONTACT_1H_IMB_SOURCE':2,'RIGHT_CENSORED_NO_15M_IMB_BY_SOURCE_END':6}
          assert data['academic_author_15m_vc_goldens']==data['author_POI_first_test_goldens']==data['orders']==data['trades']==data['fills']==0
          assert data['readiness']=='NOT_TRADE_READY'
          for file,sha in {
           'evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json':'dc03c181912ffbb800bc191fbc16ec0d05c335e0',
           'evidence/c47/C47_ORIGINAL_4H_FIRST_CONTACT_TO_LATER_1H_IMB_45ZIP.json':'b2727f081d8a73f522a97a54b4582507ee969244',
           'evidence/c55/C55_ORIGINAL_45ZIP_ROUTE_C_1H_RAID_3M_BOS_4ADAPTED_SOURCE.json':'2b4f944ddbdff0871a7fd553de2ab9955d220b91',
           'evidence/c56/C56_ORIGINAL_60ZIP_SAME_1H_PARENT_3M_NATIVE5M_COMPLETE_SOURCE.json':'98f087a731d30c2191dc443038c371751456f316',
          }.items():
            got=subprocess.check_output(['git','rev-parse','HEAD:research/mtf-element-audit-v1/'+file],text=True).strip()
            assert got==sha
          print('C57_A127_INDEPENDENT_127_SHA_ALL_SIX_SOURCE_EVIDENCE_PASSED')
          PY
          cd d05
          python -m unittest -v test_c57_route_a_original15m_first_imb_after_1h_source 2>&1 | tee /tmp/C57
          grep -Fq 'Ran 42 tests' /tmp/C57
          grep -qx 'OK' /tmp/C57
          ! grep -q 'skipped=' /tmp/C57
