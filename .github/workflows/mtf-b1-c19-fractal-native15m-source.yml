name: MTF B1 C19 — Original C08 Native15m Fractal First Wick (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c19-fractal-native15m-source.yml'
      - 'research/mtf-element-audit-v1/d05/c19_fractal_wick_raid_source_witness.py'
      - 'research/mtf-element-audit-v1/d05/test_c19_fractal_wick_raid_source_witness.py'
      - 'research/mtf-element-audit-v1/tests/probe_c19_original_fractal_raid_contacts.py'
      - 'research/mtf-element-audit-v1/evidence/c19/C19_ORIGINAL_NATIVE15M_FRACTAL_WICK_RESULT.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-fractal-wick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify previous original data and C18 receipt unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          refs={
           'research/mtf-course-v05/src/course_primitives_v05.py':'45cec7fd66d0ec156bc0a38225ee282c6d3ee71b',
           'research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json':'4205ad3118a30bbd69c412e165c7c5ce3560195d',
           'research/mtf-element-audit-v1/evidence/c16/C16_32DAY_NATIVE_15M_1D_RECEIPT.json':'bdaa008ce719254507ea95231cdc630bfa85cd67',
           'research/mtf-element-audit-v1/d05/C14_AUTHOR_STRONGHL_QUALITATIVE_CASES.json':'82a80b053712ee819ceb7d83178f672db4030462',
           'research/mtf-element-audit-v1/evidence/c17/C17_ORIGINAL_C08_1D_4H_CANDIDATE_RESULT.json':'d7fffbe4712bc5a188b2e9065527b86c2987846f',
           'research/mtf-element-audit-v1/evidence/c18/C18_ORIGINAL_C08_NATIVE15M_LTF_GRAPH_RECEIPT.json':'9178e96ec348414621bf58866a3c8001c0bee90b'}
          for p,x in refs.items():
              y=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert y==x,(p,y,x)
          print('UNCHANGED_PRIOR_ACADEMIC_C08_C16_C17_C18_GIT_BLOBS_PASS')
          PY
      - name: Run original academic v05 and C10-C19 source negative tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/c19-v05.txt
          grep -q 'Ran 29 tests' /tmp/c19-v05.txt
          grep -Eq '^OK$' /tmp/c19-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness test_c12_attribution_ambiguity_gate test_c13_stronghl_bos_or_poi_source_branch test_c14_qualitative_stronghl_source_gate test_c15_closed_multi_tf_source_grid test_c16_c08_monthly_daily_htf_lineage test_c17_htf_imb_reaction_diagnostics test_c18_native_15m_child_witness_graph test_c19_fractal_wick_raid_source_witness 2>&1 | tee /tmp/c19-tests.txt
          grep -Eq '^OK$' /tmp/c19-tests.txt
          echo C19_SOURCE_TESTS_PASS
      - name: Independent 30 raw original C08 ZIP replay with strict full/suffix invariance
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c19_original_fractal_raid_contacts.py /tmp/c19-original.json 2>&1 | tee /tmp/c19-original.log
          python - <<'PY'
          import json
          x=json.load(open('/tmp/c19-original.json'))
          assert x['original_C08_archive_sources_replayed']==30
          assert x['verified_native_15m_rows']==15360
          assert x['original_native_1d_equalities']==160
          assert len(x['observations'])==5
          assert all(z['future_suffix_invariant'] and not z['source_32day_original_native_3m5m'] for z in x['observations'])
          assert x['author_golden_source_status']=='AUTHOR_GOLDEN_SOURCE_UNAVAILABLE'
          assert x['trades']==0 and x['readiness']=='NOT_TRADE_READY'
          print('C19_ORIGINAL_NATIVE_15M_FIRST_WICK_FRACTAL_REPLAY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-c19-original-source-fractal-raid
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c19-v05.txt
            /tmp/c19-tests.txt
            /tmp/c19-original.json
            /tmp/c19-original.log
