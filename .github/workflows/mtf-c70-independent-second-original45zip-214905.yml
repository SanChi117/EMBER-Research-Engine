name: EMBER C70 independent second original45ZIP native3m exact 214905 byte source
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c70-independent-second-original45zip-214905.yml'
      - 'research/mtf-element-audit-v1/evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json'
permissions:
  contents: read
jobs:
  independent45:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent second fresh original signed 45 ZIP Binance 3m in 15m full byte exact first source wick
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A139
          grep -Fq 'entries 139 tip_sha256 78271dd0a96a54713e4559fe47107ccf063b7ba8f4ed384d8aa166f2cae9c227' /tmp/A139
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c69/C69_ORIGINAL45ZIP_FIRST_NATIVE15M_LIQUIDITY_RAID_OR_NEW1H_POI_SOURCE_TEST.json)" = b22860dfa13e4b19d16e8dd892719a772485e847
          test "$(git rev-parse HEAD:$R/evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json)" = e100ca8a70a32484fd311ae2dcf31a311d85865c
          python "$R/tests/probe_c70_original45zip_exact_first_native3m_wick.py" /tmp/C70-second.json >/tmp/C70-second.log 2>&1 || { tail -c 19000 /tmp/C70-second.log; exit 1; }
          cmp -s /tmp/C70-second.json "$R/evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json"
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('research/mtf-element-audit-v1/evidence/c70/C70_ORIGINAL45ZIP_EXACT_FIRST_NATIVE3M_WICK_WITHIN_C69_15M_SOURCE.json')
          assert p.stat().st_size==214905
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='b93edbb2eabdefeff6161f80c17d5e35013bc8b0205aaefac63e15f0a6b37ef9'
          d=json.loads(p.read_bytes())
          assert d['original_zip_counts']['total']==45
          assert d['original_native3m_closed']==76800 and d['original_native15m_closed']==15360
          assert d['original_native1d_closed']==160 and d['derived_closed1h']==3840
          assert d['source_4h_C46_parent_count']==153
          assert d['source_first_exact_native3m_contact_state_totals']=={
            'C69_SOURCE_15M_BAR_MISSING':0,
            'NEW1H_POI_FIRST_ORIGINAL3M_WICK_TEST_NOT_AUTHOR_VALID':35,
            'NO_C69_UNAMBIGUOUS_SOURCE_CONTACT':95,
            'NO_ORIGINAL3M_WICK_CROSS':0,
            'RAID_FIRST_ORIGINAL3M_CLOSE_THROUGH_LEVEL_NOT_AUTHOR':8,
            'RAID_FIRST_ORIGINAL3M_WICK_ONLY_NOT_AUTHOR':15}
          assert d['author_verified_original3m_first_wick_is_owner_valid']==0
          assert d['author_verified_StrongHL']==d['author_verified_OF']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          print('C70_INDEPENDENT_SECOND_ORIGINAL45_SOURCE_FULL_BYTE_EQUAL',p.stat().st_size,sha)
          PY
  negatives20:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Original native3m wick SHA and 5bar Decimal price parity under original15m 20 x3 negatives
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c70_exact_native3m_first_raid_or_poi_source_wick 2>&1 | tee /tmp/C70
          grep -Fq 'Ran 20 tests' /tmp/C70
          grep -qx 'OK' /tmp/C70
