name: MTF C30 — Source Causal Wick and IMB Negative Controls
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c30-source-negative-gates.yml'
      - 'research/mtf-element-audit-v1/d05/c30_causal_wick_liquidity_imb.py'
      - 'research/mtf-element-audit-v1/d05/test_c30_causal_wick_liquidity_imb.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-causal-negative-25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute all C30 falsification controls
        id: negatives
        continue-on-error: true
        run: |
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c30_causal_wick_liquidity_imb > /tmp/c30-negatives.log 2>&1
      - name: Pin actual passing or failed test diagnosis
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          TEST_OUTCOME: ${{ steps.negatives.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/mtf-element-audit-v1/evidence/c30/diagnostics/C30_NEGATIVE_TESTS.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          f=pathlib.Path('/tmp/c30-negatives.log')
          log=f.read_text(errors='replace') if f.exists() else 'NO_TEST_LOG'
          p.write_text(json.dumps({
            'schema':'EMBER_C30_SOURCE_NEGATIVE_TEST_DIAGNOSTIC',
            'run_id':int(os.environ['RUN_ID']),
            'trigger_sha':os.environ['HEAD_SHA'],
            'test_outcome':os.environ['TEST_OUTCOME'],
            'all_25_pass':os.environ['TEST_OUTCOME']=='success' and 'Ran 25 tests' in log and 'OK' in log[-350:],
            'log_tail':log[-19000:],
            'author_rb_snr_approved':0,
            'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf-element-audit-v1/evidence/c30/diagnostics/C30_NEGATIVE_TESTS.json
          git commit -m "diagnostic(C30): record exact causal source negative tests outcome"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
      - name: Fail actual negative tests when unsuccessful
        if: steps.negatives.outcome != 'success'
        run: exit 1
