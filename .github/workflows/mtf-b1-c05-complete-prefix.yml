name: MTF B1 C05 - Complete Known POI Prefix and Reaction Readout (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c05-complete-prefix.yml'
      - 'research/mtf-element-audit-v1/d05/poi_complete_prefix_reaction_b1.py'
      - 'research/mtf-element-audit-v1/d05/test_poi_complete_prefix_reaction_b1.py'
      - 'research/mtf-element-audit-v1/tests/probe_b1_c05_complete_real_prefix.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-prefix-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify byte-for-byte original primitive and D03 lineage
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/tools/strict_event_lineage_d03.py)" = 16163fb8a08439d8d3b8e5f42c4cc16b82c1c28e
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Run original source tests and new first-contact prefix/response probes
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/b1-c05-legacy.txt
          grep -q 'Ran 29 tests' /tmp/b1-c05-legacy.txt
          grep -Eq '^OK$' /tmp/b1-c05-legacy.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_poi_complete_prefix_reaction_b1 2>&1 | tee /tmp/b1-c05-contract.txt
          grep -q 'Ran 23 tests' /tmp/b1-c05-contract.txt
          grep -Eq '^OK$' /tmp/b1-c05-contract.txt
      - name: Independently download original BTCUSDT 15m ZIP and check complete 95-candle post-known prefix
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_b1_c05_complete_real_prefix.py /tmp/b1-c05-original-source.json 2>&1 | tee /tmp/b1-c05-original-source.log
          python - <<'PY'
          import json
          v=json.load(open('/tmp/b1-c05-original-source.json'))
          assert v['archive_rows']==96 and v['post_known_prefix_bars']==95
          assert v['test_result']=='SOURCE_PREFIX_TECHNICAL_PASS'
          assert v['future_suffix_stable'] is True
          assert v['academy_reaction_rule_approved'] is False
          assert v['orders_or_trades_created'] is False
          assert v['readiness']=='NOT_TRADE_READY'
          assert v['level_source'].startswith('ARTIFICIAL_POI_')
          print('B1_C05_95_SOURCE_BARS_REPLAYED__NO_ACADEMIC_LEVEL_APPROVAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-b1-c05-prefix-falsification-and-original-source
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/b1-c05-legacy.txt
            /tmp/b1-c05-contract.txt
            /tmp/b1-c05-original-source.log
            /tmp/b1-c05-original-source.json
