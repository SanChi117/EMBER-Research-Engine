name: MTF A093 C23 Source Chain
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a093-c23-sha-proof.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a093-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full SHA journal and five C23 evidence files
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a093-integrity.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a093-integrity.json'))
          assert x['events']>=93 and x['validations_pass']
          j=[json.loads(v) for v in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if v.strip()]
          assert j[91]['action_id']=='A092'
          assert j[92]['action_id']=='A093' and j[92]['seq']==93
          assert j[92]['record_sha256']=='264477e53b7653fcde68ea0b0f99599c204d0b9e33042732c85ede7b8acd87bb'
          assert len(j[92]['evidence'])==5 and j[92]['cycle_result']=='PASSED'
          print('A093_93_SHA_RECORDS_AND_5_FILES_PASS')
          PY
      - name: Verify exact frozen source receipts by Git blob
        run: |
          python - <<'PY'
          import subprocess
          pinned={
           'research/mtf-element-audit-v1/evidence/c22/C22B_ORIGINAL_PIVOT_ALTERNATIVES.json':'87bc70ed12cf77bf444a019cb48ef38d907ac5f3',
           'research/mtf-element-audit-v1/evidence/c23/C23_ORIGINAL_FIRST_INTACT_PIVOT_RESULT.json':'b2fd86941fb1f2fcf11f656d230015577c58b021'}
          for path,want in pinned.items():
              got=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              assert got==want,(path,got,want)
          print('C23_NATIVE3M_ORIGINAL_GIT_RECEIPTS_PINNED')
          PY
      - name: Original 3m first-intact source negative tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c23_first_intact_pivot_guard 2>&1 | tee /tmp/a093-tests.log
          grep -q 'Ran 8 tests' /tmp/a093-tests.log
      - name: Replay original native Binance USD-M 3m source
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c23_first_intact_native3m_45zip.py /tmp/a093-original.json 2>&1 | tee /tmp/a093-source.log
      - name: Assert C23 first intact parent partitions
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/a093-original.json'))
          t=r['totals']
          assert r['original_3m_closed']==76800 and r['original_native15m_equalities']==15360
          assert t['original_parent_edges']==539
          assert t['previously_close_broken_levels']==1408
          assert t['first_close_single_candidate_edges']==285
          assert t['first_close_multiple_candidate_edges']==242
          assert t['no_first_close_candidate_edges']==12
          assert t['chosen_latest_proxy_previously_close_broken']==13
          assert r['author_approved_trades']==0 and r['readiness']=='NOT_TRADE_READY'
          print('A093_FIRST_INTACT_ORIGINAL_PIVOT_SOURCE_PASS')
          PY
