name: EMBER Fixed Universe WFO Recheck

on:
  workflow_dispatch:
  push:
    branches:
      - agent/core-15000-validation
    paths:
      - "scripts/run_fixed_wfo.py"
      - "scripts/run_core_validation.py"
      - ".github/workflows/fixed-wfo-recheck.yml"

permissions:
  contents: write

concurrency:
  group: ember-fixed-universe-wfo-core-15000
  cancel-in-progress: true

jobs:
  fixed-wfo:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download validated 15000-bar datasets
        uses: actions/download-artifact@v4
        with:
          name: ember-core-15000-validation
          path: prior-validation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30823347050
      - name: Run fixed-universe WFO
        run: |
          mkdir -p results
          python scripts/run_fixed_wfo.py \
            --data-dir prior-validation/data/core_validation \
            --out-dir results/fixed_wfo \
            --symbols INJUSDT,TONUSDT,DOGEUSDT,ARBUSDT,NEARUSDT,OPUSDT \
            --profiles baseline,high-vol-block,opposite-liquidity \
            --interval 15m \
            --bars 15000 \
            | tee results/fixed_wfo_stdout.txt
      - name: Persist verified WFO summaries
        run: |
          cp results/fixed_wfo/summary.json docs/FIXED_UNIVERSE_WFO.json
          cp results/fixed_wfo/summary.md docs/FIXED_UNIVERSE_WFO.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FIXED_UNIVERSE_WFO.json docs/FIXED_UNIVERSE_WFO.md
          git commit -m "Record fixed-universe WFO results"
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-fixed-universe-wfo
          path: |
            results/fixed_wfo/
            results/fixed_wfo_stdout.txt
          if-no-files-found: warn
