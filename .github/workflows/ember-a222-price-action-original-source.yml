name: A222 Original Price Action on Genuine Binance USD-M

on:
  push:
    branches:
      - 'research/a222-price-action-source-first-locked-mandate-20261031'
    paths:
      - 'research/a222_price_action/**'
      - '.github/workflows/ember-a222-price-action-original-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_source_causality:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure numeric stack
        run: pip install numpy==2.1.3 pandas==2.2.3
      - name: Verify original SHA, original confirmed swings, true USD-M BTC signals and future-prefix stability
        run: python research/a222_price_action/a222_original_sweep_bos_signal_preflight.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a222-original-price-action-btc-usdm-source-preflight
          path: research/a222_price_action/evidence/A222_ORIGINAL_SWEEP_BOS_SOURCE_CAUSALITY.json
          if-no-files-found: warn
          retention-days: 30
