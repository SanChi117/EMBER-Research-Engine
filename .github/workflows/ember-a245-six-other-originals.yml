name: A245 Six Previously Underreviewed Futures Originals — 36 Native Scenarios
on:
  push:
    branches: ['research/a245-six-unreviewed-originals-batch-20261031']
    paths:
      - 'research/a245_other_originals/**'
      - '.github/workflows/ember-a245-six-other-originals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent_source_economics:
    strategy:
      fail-fast: false
      matrix:
        group: ['A', 'B']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FREQTRADE__EXCHANGE__KEY: ""
      FREQTRADE__EXCHANGE__SECRET: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original-compatible Freqtrade engine and indicator dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'freqtrade==2026.9' technical pandas pyarrow
          python -m freqtrade --version
          python -m pip freeze > research/a245_other_originals/native_pip_freeze.txt
      - name: Download and SHA-verify SIX different original classes and Binance genuine futures OHLCV mark funding
        run: |
          set -euo pipefail
          python -m research.a245_other_originals.a245_prepare
      - name: Run three separate original classes times 2024 2025 2026 times BASE STRESS no parameter adaptation
        run: |
          set -euo pipefail
          python -m research.a245_other_originals.a245_run ${{ matrix.group }}
      - name: Preserve receipts, every modeled native order and negative/blocked experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a245-six-other-originals-group-${{ matrix.group }}-native
          path: |
            research/a245_other_originals/native_pip_freeze.txt
            research/a228_five_original/generated/A228_ORIGINAL_AND_MARKET_RECEIPTS.json
            research/a228_five_original/generated/native_backtests_a245_${{ matrix.group }}/**
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
