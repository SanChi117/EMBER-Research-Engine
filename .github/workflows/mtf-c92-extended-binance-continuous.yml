name: EMBER C92 extended Apr-Oct full-continuous Binance PAPER replay
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c92-extended-binance-continuous.yml'
      - 'research/mtf-element-audit-v1/d05/c92_extended_original_native5m_full_continuous.py'
      - 'research/mtf-element-audit-v1/d05/test_c92_extended_original_native5m_full_continuous.py'
      - 'research/mtf-element-audit-v1/d05/c91_continuous_causal_route_a_paper.py'
      - 'research/mtf-element-audit-v1/evidence/c92/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: append-only journal and extended real ZIP source counterexamples
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          cd d05
          python -m unittest -v test_c91_continuous_causal_route_a_paper test_c92_extended_original_native5m_full_continuous 2>&1 | tee /tmp/tests
          grep -Fq 'Ran 54 tests' /tmp/tests
          grep -qx 'OK' /tmp/tests
  all-real-native-5m-months:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    needs: [source-contract-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Binance 25 monthly 5m ZIP + 15 frozen C73, all crypto research events
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'d05')
          from c92_extended_original_native5m_full_continuous import run
          from c91_continuous_causal_route_a_paper import dumps
          c73=Path('evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json').read_bytes()
          result=run(c73)
          raw=dumps(result)
          frozen=Path('evidence/c92/C92_APR_OCT_5_SYMBOL_FULL_CAUSAL_STRATEGY_REPLAY.json')
          if frozen.exists():assert raw==frozen.read_bytes(),'C92_FROZEN_REAL_MARKET_REPLAY_DIVERGED'
          assert result['source_bars']==result['expanded_source']['total_bars']
          assert len(result['archives'])==40
          assert len(result['expanded_source']['new_monthly_25'])==25
          assert len(result['expanded_source']['original_sep_oct_15'])==15
          assert result['source_bars']>200000
          assert not result['fixed_rr_targets']
          assert result['orders']==result['fills']==result['live_trades']==[]
          for sym,z in result['by_symbol'].items():
              assert z['native5m_bars']>40000
              for t in z['trades']:
                  assert t['poi_created_ms']<t['poi_first_test_ms']<t['vc_close_ms']==t['entry_ms']
                  assert t['fta_confirmed_ms']<=t['entry_ms'] and t['stronghl_confirmed_ms']<=t['entry_ms']
                  assert t['evidence']=='ADAPTED_HYPOTHESIS'
          print('C92_ALL_MONTHLY_MARKET_SHA256',hashlib.sha256(raw).hexdigest(),'BYTES',len(raw))
          print('C92_FULL_SOURCE_SUMMARY',json.dumps({
              "total_bars":result['source_bars'],"all":result['all'],
              "train":result['baseline_train'],"time_holdout":result['held_out_time'],
              "routes":result['route_counts'],
              "by_market":{s:{"trades":len(v["trades"]),"states":v["zones"],"rejects":v["rejections"]}
                  for s,v in result["by_symbol"].items()}},sort_keys=True))
          print('C92_REAL_JSON_BEGIN')
          print(raw.decode('utf8'),end='')
          print('C92_REAL_JSON_END')
          PY
