name: EMBER C77 independent source and historical CI proof
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c77-independent-proof.yml'
permissions:
  contents: read
jobs:
  c77:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify old chain, 15 archived CIs and C77 evidence
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python tests/probe_c77_historical_ci_archives.py
          python tests/probe_c77_source_evidence.py
          cd d05
          python -m unittest -v test_c77_original_parent_source_first3m
