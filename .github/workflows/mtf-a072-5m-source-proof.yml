name: MTF A072 - Verify Frozen 5m Source Receipt Journal (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a072-5m-source-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-and-72-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently check all 72 journal SHA links and evidence bytes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a072-evidence.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/a072-evidence.json'))
          assert q['events']==72 and q['validations_pass']
          events=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert events[-1]['action_id']=='A072'
          assert events[-1]['record_sha256']=='f24ba0a694cc7d32920bbdf80b703871a8d7fa6192f00540a347d84e5ec3288d'
          assert 'zero READY' in events[-1]['observed_result']
          print('A001_A072_72_SOURCE_EVIDENCE_RECORDS_VERIFIED')
          PY
      - name: Frozen raw 5m F03 and original 15m C08 Git receipts immutable
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f03/F03_BTCUSDT_5M_2026-10-02_ORIGINAL_RECEIPT.json)" = 7e5bc374b4e4cceaf01325b16e42631dad0ec9db
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
      - name: Rerun 23 5m source corruption and time gate tests
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_f03_5m_original_source 2>&1 | tee /tmp/a072-5m-tests.txt
          grep -q 'Ran 23 tests' /tmp/a072-5m-tests.txt
          grep -Eq '^OK$' /tmp/a072-5m-tests.txt
          echo '5M_NATIVE_SOURCE_CONTRACT_PASS__NO_TRADE_SIGNAL'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a072-pinned-original-5m-futures-receipt
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a072-evidence.json
            /tmp/a072-5m-tests.txt
