name: EMBER C113 A176 read-only source and immutable journal evidence verification
on:
  push:
    branches: [research/c113-final-execution-geometry-20261030]
    paths:
      - 'research/mtf-element-audit-v1/cycles/B1_C113_FINAL_GEOMETRY_REPORT_RU.md'
      - '.github/workflows/mtf-c113-A176-final-ledger.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
permissions:
  contents: read
jobs:
  verify-immutable-c113-a176:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently check source receipts, rejected economic gate and SHA-journal exactly once
        shell: bash
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tools/auditlog.py verify | tee /tmp/a176-verify
          grep -Fq 'entries 176' /tmp/a176-verify
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('research/mtf-element-audit-v1')
          journal=[json.loads(x) for x in (root/'ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text().splitlines()]
          item=[x for x in journal if x['action_id']=='A176']
          assert len(item)==1 and journal[-1]['action_id']=='A176'
          a=item[0]
          assert a['verdict']=='DONE' and a['cycle_result']=='FAILED' and a['cycle']=='C113'
          for receipt in a['evidence']:
              blob=(root/receipt['path']).read_bytes()
              assert len(blob)==receipt['bytes'], receipt['path']
              assert hashlib.sha256(blob).hexdigest()==receipt['sha256'], receipt['path']
          summary=json.loads((root/'evidence/c113/C113_SUMMARY.json').read_text())
          assert summary['source_zip_count']==1536 and summary['original_native3m_bars']==737280
          assert summary['both_historical_windows_pass'] is False
          assert summary['live_approved'] is False and summary['true_forward_oos'] is False
          assert summary['c109_source_sha']=='39bf28a44cec0356b256853514c532b8f37be48f3da3477a365bd19c4add5557'
          for key in ('WIN_A','WIN_B'):
              receipt=summary['window_receipts'][key]
              assert receipt['admission']['screen_pass'] is False
              raw=(root/'evidence/c113'/receipt['filename']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt['sha256']
              assert len(raw)==receipt['bytes']
              base=receipt['scores']['A0_UNMODIFIED_4H']['scores']['25']
              primary=receipt['scores']['B2_LIMIT_WIDE_H4_STOP_7D']['scores']['25']
              assert base['sum_r']<0 and primary['sum_r']<0 and primary['pf']<1
              print(key,'A0',base['sum_r'],'B2',primary['sum_r'],'filled',primary['fills'])
          print('C113_A176_IMMUTABLE_SHA_READ_ONLY_VERIFIED_NO_DUPLICATE_WRITES')
          PY
