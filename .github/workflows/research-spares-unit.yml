name: EMBER Offline Spare Parts — Unit Contracts

on:
  push:
    paths:
      - 'research_spares/**'
      - '.github/workflows/research-spares-unit.yml'
  pull_request:
    paths:
      - 'research_spares/**'
      - '.github/workflows/research-spares-unit.yml'

jobs:
  offline-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline standalone tests — no network/adapters
        working-directory: research_spares
        run: python -m unittest discover -s tests -v
