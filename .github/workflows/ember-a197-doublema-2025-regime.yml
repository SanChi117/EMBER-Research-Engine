name: "EMBER A197 original DoubleMA alternate 2025 regime 4 pair x 2 fee native Freqtrade 5m detail"
on:
  push:
    branches: [research/a197-doublema-regime-and-bias-20261031]
    paths:
      - ".github/workflows/ember-a197-doublema-2025-regime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-alternate-regime-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock true original author May12 and genuine native Freqtrade2026.4
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'freqtrade==2026.4'
          python -c "from importlib.metadata import version; assert version('freqtrade')=='2026.4'"
          git -c credential.helper= clone --quiet --depth 1 https://github.com/MirrorNew/2026DoubleMaFuturesStrategy.git /tmp/a197-2025-original
          test "$(git -C /tmp/a197-2025-original rev-parse HEAD)" = '40af5c7c1c44253766428cfb06babf22f9817aa4'
          mkdir -p a197-2025-native
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/a197-2025-original')
          source=(root/'user_data/strategies/VideoDoubleMaFuturesStrategy.py').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(source)).encode()+bytes([0])+source).hexdigest()
          assert sha=='22ca6588bbd056e671783f676f1a4010cbfc1bb6',sha
          config=json.loads((root/'config/config_okx_futures_eth_only_binance_data.json').read_text())
          assert config['max_open_trades']==1 and config['stake_amount']=='unlimited'
          assert config['dry_run_wallet']==10000
          assert config['margin_mode']=='isolated' and config['trading_mode']=='futures'
          for sym in ('BTC','ETH','SOL','LINK'):
              c=json.loads(json.dumps(config))
              c['exchange']['name']='binance'
              c['exchange']['pair_whitelist']=[f'{sym}/USDT:USDT']
              c['exchange']['ccxt_config']={}
              c['exchange']['ccxt_async_config']={}
              for field in ('key','secret','password'):c['exchange'][field]=''
              c['dry_run']=True
              c['api_server']['enabled']=False
              c['telegram']['enabled']=False
              c['bot_name']=f'A197_2025_ORIGINAL_{sym}_NO_LIVE'
              Path(f'a197-2025-native/config-{sym}.json').write_text(json.dumps(c,indent=2))
          print('A197_2025_ORIGINAL_UNCHANGED_SHA_AND_CONFIG_VALID')
          PY
      - name: Download 2025 authentic Binance USD-M 1h+mark+funding and 5m with 180+ archive SHA receipts
        shell: bash
        run: |
          set -euo pipefail
          python research/doublema_native_oos_20261031/a197_prepare_2025_alternate_regime.py --datadir a197-2025-native/data | tee a197-2025-native/A197-2025-source-qa.log
          grep -Fq A197_2025_FOUR_COINS_RAW_SOURCE_QA_AND_SHA_PASS a197-2025-native/A197-2025-source-qa.log
      - name: Run full exact original Freqtrade 2026.4 real 5m-detail historical execution on 2025, all 4 coins two commissions
        shell: bash
        run: |
          set -euo pipefail
          for sym in BTC ETH SOL LINK; do
            for scenario in 5 12p5; do
              if [ "$scenario" = '5' ]; then RATE=0.0005; else RATE=0.00125; fi
              echo "A197_2025_ORIGINAL_NATIVE_BEGIN $sym $scenario"
              timeout 510s python research/doublema_native_oos_20261031/a195_native_binance_offline.py \
                -c "a197-2025-native/config-$sym.json" \
                --userdir /tmp/a197-2025-original/user_data \
                --datadir "$GITHUB_WORKSPACE/a197-2025-native/data" \
                --strategy VideoDoubleMaFuturesStrategy --timeframe 1h --timeframe-detail 5m \
                --timerange 20250401-20260101 --data-format-ohlcv json \
                --fee "$RATE" --export trades --cache none \
                2>&1 | tee "a197-2025-native/2025-$sym-fee$scenario-5m.log"
              z="$(find /tmp/a197-2025-original/user_data/backtest_results -maxdepth 1 -name 'backtest-result*.zip' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
              test -s "$z"
              cp "$z" "a197-2025-native/2025-$sym-fee$scenario-5m.zip"
              rm -f /tmp/a197-2025-original/user_data/backtest_results/backtest-result*.zip
              echo "A197_2025_ORIGINAL_NATIVE_FINISHED $sym $scenario"
            done
          done
      - name: Verify 8 Freqtrade receipts and apply pre-registered cross-regime gate
        shell: bash
        run: |
          set -euo pipefail
          python research/doublema_native_oos_20261031/a197_parse_2025_native.py \
            --root a197-2025-native 2>&1 | tee a197-2025-native/A197-2025-native-verify.log
          grep -Fq A197_2025_ALL_EIGHT_EXACT_ORIGINAL_NATIVE_RESULTS_RECEIPTS_VERIFIED a197-2025-native/A197-2025-native-verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A197-Original-DoubleMA-2025-Alternate-Regime-8-Native-5m-Results
          path: |
            a197-2025-native/*.zip
            a197-2025-native/*.log
            a197-2025-native/A197_2025_NATIVE_ALTERNATE_MACHINE.json
            a197-2025-native/data/A197_2025_AUTHENTIC_SOURCE_SHA_MANIFEST.json
          retention-days: 30
