name: MTF A081 — Verify Closed Futures MTF Source Chain (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a081-source-mtf-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-81-proof-records:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently verify A001–A081 SHA chain and every original source evidence byte hash
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a081-proof.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/a081-proof.json'))
          assert q['events']==81 and q['validations_pass']
          a=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert a[-1]['action_id']=='A081'
          assert a[-1]['record_sha256']=='8233c809db78ef85781b0116ae2d5997c21f4c45b66a85b33434bd91c623e621'
          assert 'approved trades 0' in a[-1]['observed_result']
          print('A001_A081_FULL_SHA_EVIDENCE_CHAIN_BYTES_VERIFIED')
          PY
      - name: Original academic v05, F06 native Futures 5m, C08 and new C15 source SHA immutable
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json)" = 4205ad3118a30bbd69c412e165c7c5ce3560195d
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json)" = a5bf2105d1c611517a8d127d5e1f8cb622720162
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c15/C15_F06_5M_NATIVE_15M_DERIVED_1D_4H_SOURCE_RECEIPT.json)" = 696065b29bbe45f5f4fdd0bf8042c4f5781c170d
      - name: Re-run original 29 plus 155 source-closed MTF and academic negative regression tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a081-course.txt
          grep -q 'Ran 29 tests' /tmp/a081-course.txt
          grep -Eq '^OK$' /tmp/a081-course.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c10_two_day_original_5m_context test_c11_contact_imb_source_witness test_c12_attribution_ambiguity_gate test_c13_stronghl_bos_or_poi_source_branch test_c14_qualitative_stronghl_source_gate test_c15_closed_multi_tf_source_grid 2>&1 | tee /tmp/a081-tf.txt
          grep -q 'Ran 155 tests' /tmp/a081-tf.txt
          grep -Eq '^OK$' /tmp/a081-tf.txt
          echo '81_IMMUTABLE_EVIDENCE_RECORDS_AND_184_TESTS_PASS_NO_APPROVED_TRADES'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a081-closed-price-five-tf-evidence-chain
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a081-proof.json
            /tmp/a081-course.txt
            /tmp/a081-tf.txt
