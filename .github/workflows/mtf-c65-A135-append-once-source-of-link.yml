name: EMBER C65 A135 append-once strict Order Flow source preknown liquidity and IMB
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c65-A135-append-once-source-of-link.yml'
permissions:
  contents: write
concurrency:
  group: c65-a135-append-once
  cancel-in-progress: false
jobs:
  append135:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify previous immutable 134 and full original C65 45zip twice identical + independent witness
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A134
          grep -Fq 'entries 134 tip_sha256 2a01f3845779390187305475c609d407b0e790605de3d3183884baba81795960' /tmp/A134
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('evidence/c65/C65_ORIGINAL45ZIP_OF_SOURCE_LAST_LINK_HTF_TARGET_FIRST_ANY_INVALIDATION.json')
          w=Path('evidence/c65/C65_INDEPENDENT_ORIGINAL45ZIP_SOURCE_OF_LAST_LINK_WITNESS_20261025.json')
          report=Path('cycles/B1_C65_AUTHOR_ORDERFLOW_LAST_LINK_TARGET_FIRST_ANY_SOURCE_REPORT.md')
          assert all(x.is_file() and x.stat().st_size>0 for x in (p,w,report))
          assert p.stat().st_size==237284
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='0865735c653925230e29ee978df2f59090a3711243d93db09cdf11994990b07b'
          d=json.loads(p.read_bytes());s=json.loads(w.read_bytes())
          assert d['original_sha_checked_zip_archives']['total']==45
          assert d['original_native3m_closed']==76800 and d['original_native1d_closed']==160
          assert d['exact_original_native15m_decimal_parities']==15360
          assert d['derived_closed1h']==3840 and d['4h_frozen_source_parents']==153
          assert d['original_c64_frozen_source_candidates_after_confirmation']==70
          assert d['source_of_states']=={
              'NO_C64_CONFIRMED_SOURCE_ANCHOR':83,
              'NO_EARLIER_SOURCE_LIQUIDITY_WORK':69,
              'NO_EARLIER_SOURCE_IMB_WORK':1,
              'NO_PREKNOWN_1H_LAST_LINK_PIVOT':0,
              'NO_PREKNOWN_OR_AHEAD_1D_TARGET':0,
              'SOURCE_OF_PREREQUISITES_NOT_AUTHOR_CERTIFIED':0,
              'SOURCE_TARGET_NOT_REACHED_WITHIN_WINDOW':0,
              'SOURCE_TARGET_REACHED_NO_INVALIDATION_FULL_WINDOW':0,
              'SOURCE_TARGET_REACHED_NO_INVALIDATION_RIGHT_CENSORED':0,
              'SOURCE_FIRST_INVALIDATION_LINK_CLOSE_PROXY':0,
              'SOURCE_FIRST_INVALIDATION_OPPOSITE_POI_PROXY':0,
              'SOURCE_SIMULTANEOUS_TWO_INVALIDATION_PROXIES':0}
          assert d['author_OF_links']==d['author_OF_invalidation']==d['author_StrongHL']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          assert s['first_original45_zip_replay_run']==40215080339
          assert s['second_independent_original45_zip_full_byte_run']==40215245033
          assert s['second_independent_workflow_result']=='SUCCESS_4_OF_4'
          assert s['source_json_bytes']==237284 and s['source_sha256']==sha
          assert s['negative_tests_per_python']==31 and s['technical_full_gate_candidates']==0
          print('C65_A135_SIX_SOURCE_EVIDENCE_ORIGINAL_CRYPTO_BINANCE_INDEPENDENT_ACCEPTED')
          PY
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json)" = dc03c181912ffbb800bc191fbc16ec0d05c335e0
          test "$(git rev-parse HEAD:$R/evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json)" = 899373e4a1dc1999d1485ac8c1f790d39071aebd
          test "$(git rev-parse HEAD:$R/evidence/c62/C62_ORIGINAL_45ZIP_1H_SNR_RB_MB_IMB_LIQUIDITY_COMPLETE_SOURCE.json)" = 8428bf7d6cd3bc26f617cfc32a34c91a27c813b2
          test "$(git rev-parse HEAD:$R/evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json)" = fdc77c7ec942f03b4efae83b935d994c8435a24f
          test "$(git rev-parse HEAD:$R/evidence/c64/C64_ORIGINAL45ZIP_STRICT_SOURCE_EXTREME_PRECONFIRM_POST_WICK_CLOSE_INVALIDATION.json)" = f70b0493a0c4964c618c09c75fee900dd65f5c05
          cd "$R/d05"
          python -m unittest -v test_c65_of_last_link_target_invalidation_source 2>&1 | tee /tmp/C65
          grep -Fq 'Ran 31 tests' /tmp/C65
          grep -qx 'OK' /tmp/C65
      - name: Append immutable A135 only six source SHA after two independently complete 45zip runs
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py record \
            --action-id A135 \
            --cycle B1/C65 \
            --planned 'Read owner primary Order Flow, Strong High Low, POI lesson texts. Reconstruct last source OF structural link only when PREEXISTING same side worked liquidity AND individually worked earlier native1h IMB are evidenced, not bare fractal or gap formation; separate preknown unswept strict 1h pivot from arbitrary C64 minmax, native1d closed HTF target ahead, wait original1h for target and then FIRST ANY post-target fully closed last link BOS proxy or opposite same TF SNR RB IMB source POI, both ambiguous and right censor. Keep academic author source unverified, no orders.' \
            --executed 'Created C65 independent source-only 1H last OF link/target/first-any dual invalidation module, 31 adversarial negatives Python3.10/3.11/3.12; original 45 signed SHA checked Binance USD-M ZIP on five crypto symbols for 2026-09-01 to 2026-10-02 re-downloaded TWICE, 76800 source native3m, 160 native1d, 15360 exact native15m Decimal equalities, 3840 closed derived1h, 153 source4H C46 candidates and exact replay of C46 first original contact C60 visits C62 SNR RB IMB C63 first ANY and C64 original3m source anchors; physically cut original1h replay equals filtered asof. Immutable full source JSON 237284 bytes SHA256 0865735c653925230e29ee978df2f59090a3711243d93db09cdf11994990b07b Git blob 791f20fcf0a8d6c4697f02fd7247b45cfd4b6de5. First full source CI 40215080339 SUCCESS and second independent 40215245033 SUCCESS 4/4 byte exact, full 31x3 tests each.' \
            --result '153 technical original crypto 4H source contexts: 83 C64 no usable original3m anchor, 69 source-only strict preknown liquidity work not evidenced, one demonstrated source liquidity but no separate prior native1h IMB work; ZERO full strict 1h source last OF link proof and zero source technical invalidation candidates. These 1H-only same-direction source-specific gates are NOT a claim actual owner OF absent on real crypto or other TF. Owner annotated crypto true last OF link Strong High Low target/POI and first valid test still zero. No orders, fills, trades or PnL. CRYPTO PAPER ONLY NOT_TRADE_READY.' \
            --verdict DONE \
            --cycle-result PASSED \
            --countercheck 'Previous immutable A134 134/134 tip 2a01f3845779390187305475c609d407b0e790605de3d3183884baba81795960 unchanged; frozen original source Git blobs C46 dc03c181912ffbb800bc191fbc16ec0d05c335e0 C60 899373e4a1dc1999d1485ac8c1f790d39071aebd C62 8428bf7d6cd3bc26f617cfc32a34c91a27c813b2 C63 fdc77c7ec942f03b4efae83b935d994c8435a24f C64 f70b0493a0c4964c618c09c75fee900dd65f5c05 unchanged. Initial CI 40214646246 red was THREE incorrectly timed SYNTHETIC target/3candle POI cases; fixed only fake OHLC and chronology expectations, no loosening production. CI 40214720404 and stricter source checks CI 40214855551 SUCCESS 3/3. Complete independent full signed Binance 45ZIP x2 and all 237284 raw source report bytes equal, 31x3 negatives. No favorable selection or author StrongHL promotion.' \
            --evidence d05/c65_of_last_link_target_invalidation_source.py \
            --evidence d05/test_c65_of_last_link_target_invalidation_source.py \
            --evidence tests/probe_c65_original45zip_of_last_link_target_invalidation.py \
            --evidence evidence/c65/C65_ORIGINAL45ZIP_OF_SOURCE_LAST_LINK_HTF_TARGET_FIRST_ANY_INVALIDATION.json \
            --evidence evidence/c65/C65_INDEPENDENT_ORIGINAL45ZIP_SOURCE_OF_LAST_LINK_WITNESS_20261025.json \
            --evidence cycles/B1_C65_AUTHOR_ORDERFLOW_LAST_LINK_TARGET_FIRST_ANY_SOURCE_REPORT.md
          python tools/auditlog.py verify | tee /tmp/A135
          grep -Fq 'entries 135' /tmp/A135
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
      - name: Append journal one line ONLY, non-forcing no rewrite previous source
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only > /tmp/changed
          test "$(wc -l < /tmp/changed)" -eq 1
          grep -Fxq 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl' /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m 'audit(C65): append-once A135 original45zip source OF last link strict liquidity and IMB work six immutable SHA'
          for i in 1 2 3 4 5; do
            git fetch origin research/academic-engine-recovery-20261015
            git rebase origin/research/academic-engine-recovery-20261015
            if git push origin HEAD:research/academic-engine-recovery-20261015; then exit 0; fi
            sleep 2
          done
          exit 1
