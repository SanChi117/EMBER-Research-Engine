name: MTF A068 - Verify C08 Derived Higher-TF Evidence Journal
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a068-closed-htf-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-closed-source-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify A001-A068 immutable SHA chain and pinned report/source/test hashes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a068-proof.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/a068-proof.json'))
          assert o['events']==68 and o['validations_pass']
          lines=[json.loads(l) for l in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if l.strip()]
          assert lines[-1]['action_id']=='A068'
          assert lines[-1]['record_sha256']=='193690bae0c5586258e44104f68a273f3153273f518c31b6ffe7a809e01e6c97'
          assert '0 academic formations approved' in lines[-1]['observed_result']
          print('A001_A068_EVIDENCE_INTEGRITY_PASS')
          PY
      - name: Guard frozen raw C08 BTC Futures source and unchanged v05 primitives
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c08/C08_BTCUSDT_63_RECEIPTS.json)" = f8d6553ec598ecfa8ea2bd49a3e61699d0cfe650
      - name: Replay 29 source-v05 and 21 MTF source-aggregation negative tests
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a068-v05.txt
          grep -q 'Ran 29 tests' /tmp/a068-v05.txt
          grep -Eq '^OK$' /tmp/a068-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_mtf_c08_aggregation_b1 2>&1 | tee /tmp/a068-mtf.txt
          grep -q 'Ran 21 tests' /tmp/a068-mtf.txt
          grep -Eq '^OK$' /tmp/a068-mtf.txt
          echo '50_SOURCE_CONTRACT_TESTS_PASS__MTF_BIAS_NOT_ATTESTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a068-closed-htf-evidence-integrity
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a068-proof.json
            /tmp/a068-v05.txt
            /tmp/a068-mtf.txt
