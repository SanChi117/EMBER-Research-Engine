name: MTF A089 — Original 3m C21 SHA Journal and Futures Proof (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a089-c21-original-3m-journal-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a089-original-3m-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit complete rolling journal and exact C21 evidence bytes
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a089-chain.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a089-chain.json'))
          assert x['events']>=89 and x['validations_pass']
          rows=[json.loads(line) for line in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if line.strip()]
          assert rows[87]['action_id']=='A088'
          assert rows[87]['record_sha256']=='067504ce5323421452d7001087a943478f8e8bea10be64fcf68ff73a5b0996d8'
          assert rows[88]['action_id']=='A089' and rows[88]['seq']==89
          assert rows[88]['record_sha256']=='388d6da3b396a34188c3d86ff358ed49b4de5dce3c8527575abab3f6479452d2'
          assert rows[88]['cycle_result']=='PASSED' and len(rows[88]['evidence'])==5
          print('A089_89_CHAIN_AND_5_NEW_SOURCE_FILE_BYTES_PASS')
          PY
      - name: Original v05, C08/C20 and C21 immutable Git blobs
        run: |
          python - <<'PY'
          import subprocess
          refs={
            'research/mtf-course-v05/src/course_primitives_v05.py':'45cec7fd66d0ec156bc0a38225ee282c6d3ee71b',
            'research/mtf-element-audit-v1/evidence/c08/C08_315_AGGREGATE.json':'4205ad3118a30bbd69c412e165c7c5ce3560195d',
            'research/mtf-element-audit-v1/evidence/c20/C20_ORIGINAL_5M_32DAY_LINEAGE_RESULT.json':'7fc957b210b14b8ab0380b8941a7b145def836dc',
            'research/mtf-element-audit-v1/evidence/c20/C20C_ORIGINAL_UTC_CONTEXT_OBSERVATIONS.json':'346ccc1472f8e18103690bcd424c8d710eef4b01',
            'research/mtf-element-audit-v1/evidence/c21/C21A_NATIVE3M_C08_PARITY_RECEIPT.json':'02949d457e63bb367bbb99ae087e3306d1e68557'}
          for p,want in refs.items():
              got=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert got==want,(p,got,want)
          print('FROZEN_AUTHOR_C08_C20_C21_SOURCE_GIT_BLOBS_PASS')
          PY
      - name: Re-test negative original 3m source and no-lookahead invariants
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c21_native3m_source_bridge 2>&1 | tee /tmp/a089-tests.txt
          grep -q 'Ran 15 tests' /tmp/a089-tests.txt
      - name: Independently replay original 45 source ZIP against C21 SHA receipt
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c21_native3m_futures_32day.py /tmp/a089-original.json 2>&1 | tee /tmp/a089-original.log
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a089-original.json'))
          assert x['new_original_3m_zip_count']==15 and x['previous_C08_original_zip_count']==30
          assert x['native_3m_closed']==76800 and x['original_15m_decimal_equalities']==15360
          assert x['native_1d_equalities']==160
          assert x['author_3m_bos_goldens']==x['author_approved_trades']==0
          assert x['readiness']=='NOT_TRADE_READY'
          print('A089_45_ORIGINAL_USDM_3M_SOURCE_ZIP_AND_5BAR_PARITY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a089-source-3m-price-and-journal
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a089-chain.json
            /tmp/a089-tests.txt
            /tmp/a089-original.json
            /tmp/a089-original.log
