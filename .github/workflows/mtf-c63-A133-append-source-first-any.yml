name: EMBER C63 append-once A133 first ANY reaction source 45ZIP six SHA
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c63-A133-append-source-first-any.yml'
permissions:
  contents: write
concurrency:
  group: c63-a133-append-once
  cancel-in-progress: false
jobs:
  audit_append:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate 132 ledger and six complete C63 new SHA witnesses after independent 45 ZIP
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A132
          grep -Fq 'entries 132 tip_sha256 7b6f58a0007783307b25d8876cc3f2332dddd5a0935c2ac9d677b34be4b2c4ab' /tmp/A132
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json')
          witness=pathlib.Path('evidence/c63/C63_INDEPENDENT_ORIGINAL45ZIP_FIRST_ANY_SOURCE_VC_BOS_WITNESS_20261025.json')
          report=pathlib.Path('cycles/B1_C63_FIRST_ANY_SOURCE_REACTION_VC_BOS_STRONGHL_FAILCLOSED_REPORT.md')
          assert all(x.is_file() and x.stat().st_size>0 for x in (p,witness,report))
          assert p.stat().st_size==302827
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='a681e2941d45b9658ab02c98c5dd06e4bfd85388982537241d8a5bd0708c31be'
          doc=json.loads(p.read_bytes());w=json.loads(witness.read_bytes())
          assert doc['source_signed_original_crypto_zip']['total']==45
          assert doc['original_native3m_closed']==76800
          assert doc['original_native1d_closed']==160
          assert doc['native15m_exact_original_decimal_parity']==15360
          assert doc['fully_closed_original_1h']==3840
          assert doc['4h_source_parent_candidates']==153
          assert doc['original_first3m_source_contact_parents']==132
          expected={
            'FIRST_ANY_BOTH_SIDES_AMBIGUOUS':7,
            'FIRST_ANY_OPPOSITE_SIDE_SOURCE_ONLY':61,
            'FIRST_ANY_SAME_SIDE_SOURCE_ONLY':64,
            'FULL_WINDOW_NO_SOURCE_EVENT':0,
            'NO_4H_SOURCE_FIRST_CONTACT':21,
            'RIGHT_CENSORED_NO_SOURCE_EVENT':0}
          assert doc['all_parent_status_counts']==expected
          assert doc['author_selected_POI']==doc['author_strongHL']==doc['author_true_BOS']==0
          assert doc['orders']==doc['fills']==doc['trades']==0
          assert doc['readiness']=='NOT_TRADE_READY'
          assert w['independent_second_original_replay_run']==40212064161
          assert w['all_four_second_jobs']=='SUCCESS_4_OF_4'
          assert w['frozen_source_sha256']==sha
          assert w['negative_tests_per_python']==29
          assert w['original_source_parent_counts']==expected
          print('C63_INDEPENDENT_COMPLETE_NEW_SOURCE_EVIDENCE_VALIDATED')
          PY
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json)" = dc03c181912ffbb800bc191fbc16ec0d05c335e0
          test "$(git rev-parse HEAD:$R/evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json)" = 899373e4a1dc1999d1485ac8c1f790d39071aebd
          test "$(git rev-parse HEAD:$R/evidence/c62/C62_ORIGINAL_45ZIP_1H_SNR_RB_MB_IMB_LIQUIDITY_COMPLETE_SOURCE.json)" = 8428bf7d6cd3bc26f617cfc32a34c91a27c813b2
          cd "$R/d05"
          python -m unittest -v test_c63_closed_4h_source_contact_to_first_any_1h_reaction 2>&1 | tee /tmp/C63
          grep -Fq 'Ran 29 tests' /tmp/C63
          grep -qx 'OK' /tmp/C63
      - name: Append audit A133 six SHA original45 source-only first-any
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py record \
            --action-id A133 \
            --cycle B1/C63 \
            --planned 'Connect source-only original 4H classic IMB first native3m wick contact to subsequent closed 1H technical SNR RB IMB and preknown strict1H fractal close break BOS proxy, independently preserving first ANY event including opposite and same-time ambiguous rather than first favorable; enforce original ZIP candle SHA ID, full pattern formed after first closed source touch, 24h fixed observation with right censor. Never call pivot StrongHL, proxy VC/BOS author entry or trade.' \
            --executed 'Created c63_closed_4h_source_contact_to_first_any_1h_reaction.py with exact first-any opposite/ambiguous tie rules, 29 adversarial tests Python 3.10/3.11/3.12, 45 original SHA-checked Binance USDT-M ZIP fresh each of two independent full source runs, 76800 native3m, 160 native1d, 15360 exact native15m Decimal parity, 3840 closed derived1h, exact 153 frozen C46 parent original SHA IDs and frozen C60 first visits, rederived C62 SNR RB IMB exact frozen originals; first fixed original run 40211919023 SUCCESS and second full byte independent 40212064161 SUCCESS 4/4. Frozen source 302827 bytes SHA256 a681e2941d45b9658ab02c98c5dd06e4bfd85388982537241d8a5bd0708c31be Git blob fdc77c7ec942f03b4efae83b935d994c8435a24f.' \
            --result 'Original 153 source technical 4H IMB contexts: 21 without first source wick contact, 64 first any closed original1h source event same side, 61 first opposite side, 7 simultaneous both sides ambiguous; no remaining full-window/uncensored unmatched 1h source events in this 32-day source; 24h right censor logic separately covered synthetically. These are correlated technical observations NOT wins, trades or approved academy POI StrongHL or BOS. 0 author true POI first-valid tests, VC, BOS, StrongHL, SL/TP, FTA, fills, orders and trades; PAPER ONLY NOT_TRADE_READY.' \
            --verdict DONE \
            --cycle-result PASSED \
            --countercheck 'A132 prior immutable 132/132 tip 7b6f58a0007783307b25d8876cc3f2332dddd5a0935c2ac9d677b34be4b2c4ab intact. C46 original Git blob dc03c181912ffbb800bc191fbc16ec0d05c335e0, C60 899373e4a1dc1999d1485ac8c1f790d39071aebd, C62 8428bf7d6cd3bc26f617cfc32a34c91a27c813b2 unchanged. First red original run 40211860750 was Python tuple and canonical JSON array discrepancy on old C62 source compared asdict, not actual original crypto data; repaired canonical json.loads(json.dumps()) and independent two full exact source replay 40211919023 and 40212064161 success. 29 tests x3 fail closed on future, opposite-first, two-side ties, right censorship, author flags. No new trades or market performance calculations.' \
            --evidence d05/c63_closed_4h_source_contact_to_first_any_1h_reaction.py \
            --evidence d05/test_c63_closed_4h_source_contact_to_first_any_1h_reaction.py \
            --evidence tests/probe_c63_original45zip_first_any_1h_after_original3m_contact.py \
            --evidence evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json \
            --evidence evidence/c63/C63_INDEPENDENT_ORIGINAL45ZIP_FIRST_ANY_SOURCE_VC_BOS_WITNESS_20261025.json \
            --evidence cycles/B1_C63_FIRST_ANY_SOURCE_REACTION_VC_BOS_STRONGHL_FAILCLOSED_REPORT.md
          python tools/auditlog.py verify | tee /tmp/A133
          grep -Fq 'entries 133' /tmp/A133
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
      - name: Git nonforce push ONLY appended audit journal
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --name-only > /tmp/changed
          test "$(wc -l < /tmp/changed)" -eq 1
          grep -Fxq 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl' /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m 'audit(C63): append-once A133 source first-any 1H technical events not StrongHL six SHA'
          for n in 1 2 3 4 5; do
            git fetch origin research/academic-engine-recovery-20261015
            git rebase origin/research/academic-engine-recovery-20261015
            if git push origin HEAD:research/academic-engine-recovery-20261015; then exit 0; fi
            sleep 2
          done
          exit 1
