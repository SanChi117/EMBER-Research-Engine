          python-version: '3.12'
      - name: A174 old journal and 1536 original Binance ZIP + paired destination first passages 
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/c112-a174
          grep -Fq 'entries 174 tip_sha256 8d1499d3529781066b8c2201913a73d6c75426abce8f9dcec7f3a8c377c868cd' /tmp/c112-a174
          python - <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          root=Path('evidence/c112')
          data=(root/'C112_TWO_WINDOWS_SUMMARY.json').read_bytes()
          assert len(data)==5225 and hashlib.sha256(data).hexdigest()=='37509564c0accdd2eaee1cbae912d07a4907377fa5d0b3f1231abdf19daa7a9a'
          s=json.loads(data)
          assert s['original_total_zip_count']==1536 and s['original_native3m_bars']==737280
          assert not s['both_historical_windows_pass']
          assert s['new_indicators']==0 and not s['fixed_rr_target']
          assert s['orders']==s['fills']==s['live_trades']==[]
          assert s['live_approved'] is False
          assert s['C109_source_sha256']=='39bf28a44cec0356b256853514c532b8f37be48f3da3477a365bd19c4add5557'
          for window,oldn,avail,hit,valid,alterR,baseR in [
            ('WIN_A',81,52,20,42,26.971843,15.86769),
            ('WIN_B',45,15,8,10,-9.180549,2.2153)]:
              receipt=s['original_window_receipts'][window]
              raw=(root/receipt['filename']).read_bytes()
              assert len(raw)==receipt['bytes']
              assert hashlib.sha256(raw).hexdigest()==receipt['sha256']
              z=json.loads(raw)
              assert z['source_zip_count']==768 and z['original_native3m_bars']==368640
              assert len({(m['symbol'],m['date']) for m in z['source_manifest']})==768
              assert z['classifications']['all_original_core_paper_entries']==oldn
              assert z['classifications']['has_known_fresh_opposing_4h_fvg']==avail
              assert z['classifications']['raw_opposing_4h_zone_touched_in_original_48h']==hit
              assert z['classifications']['admissible_same_4h_stop_fvg_target']==valid
              eco=z['economic']
              alt=eco['MATCHED_OPPOSING_FRESH_4H_FVG']
              orig=eco['MATCHED_ORIGINAL_4H_PIVOT_FTA']
              assert alt['scores']['25']['n']==orig['scores']['25']['n']==valid
              assert alt['scores']['25']['sum_r']==alterR and orig['scores']['25']['sum_r']==baseR
              assert not alt['admission']['passes_historical_screen']
              assert not alt['admission']['live_approved']
              for x in z['per_symbol'].values():
                  for event in x['all_source_original_4h_zone_to_zone_diagnostics']:
                      if event['alternate_paper']:
                          p=event['alternate_paper']
                          assert p['entry']==event['frozen_original_entry']
                          assert p['stop']==event['frozen_original_stop']
                          assert p['parent_tf']==p['target_source_tf']==p['stop_source_tf']=='4H'
                          assert p['opposing_fvg_created_ms']<p['entry_ms']
          sys.path.insert(0,'d05')
          import c112_zone_to_zone_fvg_destination_audit as m
          assert m.frozen()
          print('C112_ORIGINAL_1536_BINANCE_ZIPS_126_BASELINE_67_OPPOSING_FVG_AND_52_MATCHED_TRADES_SOURCE_PIN_SUCCESS')
          PY
