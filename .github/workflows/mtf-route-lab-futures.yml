name: MTF Route Lab 0.4 - Binance USD-M PAPER replay

on:
  push:
    branches:
      - research/mtf-route-v04-futures-20261014
    paths:
      - '.github/workflows/mtf-route-lab-futures.yml'
      - 'research/mtf-route-lab/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mtf-route-v04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-futures-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen MTF v0.4 package
        run: |
          set -euo pipefail
          echo '11a3276974396d5be31009cf68256e3d7b4aa43ece89a0efacb2c5620583486e  research/mtf-route-lab/mtf_core_v04_frozen.zip' | sha256sum -c -
          mkdir -p mtf_route
          unzip -oq research/mtf-route-lab/mtf_core_v04_frozen.zip -d mtf_route
          echo 'a0d796faa9af17546541570f2796ceb2ced34a2f13eb4e889a6c6049ea7db9af  research/mtf-route-lab/mtf_core_v04_fixtures.zip' | sha256sum -c -
          unzip -oq research/mtf-route-lab/mtf_core_v04_fixtures.zip -d mtf_route
          cp research/mtf-route-lab/replay_portfolio_scoped_v04.py mtf_route/src/replay_portfolio_scoped_v04.py
          cp research/mtf-route-lab/test_portfolio_id_scope.py mtf_route/tests/test_portfolio_id_scope.py

      - name: Baseline regression suite (MTF core is frozen)
        working-directory: mtf_route
        run: python -m unittest discover -s tests -v

      - name: Reuse verified historical CSV and independent ideas from previous run
        working-directory: mtf_route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download 38479113192 --repo "$GITHUB_REPOSITORY" --name mtf-v04-usdm-20260401-20261012 --dir . ; then
            echo "Restored verified Futures CSV + frozen independent scenario outputs"
          else
            echo "Artifact reuse failed; next step will redownload from Binance Vision"
          fi

      - name: Download Binance USD-M Futures from official Vision archives
        working-directory: mtf_route
        run: |
          python src/obtain_history_v04.py --download --data-dir data/history --end 2026-10-13T00:00:00Z --out results_04/DOWNLOAD_ATTEMPT.json

      - name: Validate data provenance, gaps, 15m/1d OHLCV and replay fixed grids
        working-directory: mtf_route
        run: |
          python src/history_gate_v04.py --data-dir data/history --out results_04/full_validation/HISTORY_GATE.json --end 2026-10-13T00:00:00Z
          if [ ! -f results_04/full_validation/fixed_03_grid/independent_grid/SUMMARY.json ]; then
            python src/run_research_v03.py --data-dir data/history --out results_04/full_validation/fixed_03_grid/independent_grid --end 2026-10-13T00:00:00Z
          fi
          python src/replay_portfolio_scoped_v04.py --root . --out results_04/portfolio_scoped_replay

      - name: Write concise verified report
        if: success()
        working-directory: mtf_route
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('results_04/portfolio_scoped_replay/FINAL_SUMMARY.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = ['# MTF Route Lab v0.4 - Futures PAPER results', '',
                  'Run status: ' + str(data.get('status')),
                  'Core: frozen MTF 0.3; independent IMB/SNR, IDM, BOS 15m proxy.', '',
                  '| Policy x costs | Closed model trades | Closed return % | PF model | Max bar-close MTM DD % |',
                  '|---|---:|---:|---:|---:|']
          for name, payload in data.get('scenarios', {}).items():
              m = payload.get('model', {})
              rows.append('| ' + name + ' | ' +
                  str(m.get('completed_model_trades', 'N/A')) + ' | ' +
                  str(m.get('closed_equity_return_pct', 'N/A')) + '%'  + ' | ' +
                  str(m.get('PF_resolved', 'N/A')) + ' | ' +
                  str(m.get('max_bar_close_MTM_drawdown_pct', 'N/A')) + ' |')
          rows += ['', 'CAVEAT: model OHLC fills, no order acknowledgments, funding, verified teacher labels or untouched OOS; do not claim edge.']
          target = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with target.open('a', encoding='utf-8') as f:
              f.write('\n'.join(rows) + '\n')
          print('\n'.join(rows))
          PY

      - name: Upload full historical dataset and research reports (even on error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtf-v04-usdm-20260401-20261012
          if-no-files-found: warn
          retention-days: 30
          path: |
            mtf_route/data/history/*.csv
            mtf_route/data/history/manifest_vision.json
            mtf_route/data/history/manifest.json
            mtf_route/results_04/**
            research/mtf-route-lab/RESULTS_20261014.md
            mtf_route/results_03/full_validation/**
