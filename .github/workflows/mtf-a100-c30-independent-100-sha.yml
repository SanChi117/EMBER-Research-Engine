name: MTF A100 — Independent 100 SHA and C30 Original 45 ZIP
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a100-c30-independent-100-sha.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-a100-100-sha-independent-full-source
  cancel-in-progress: false
jobs:
  verify-original-100-and-45zip:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent all 100 source-evidence SHA links and six C30 evidence files
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a100-independent-ledger.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/a100-independent-ledger.json'))
          assert r['events']>=100 and r['validations_pass']
          j=[json.loads(s) for s in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if s.strip()]
          assert len(j)>=100
          assert j[98]['seq']==99 and j[98]['action_id']=='A099'
          assert j[99]['seq']==100 and j[99]['action_id']=='A100'
          assert j[99]['prev_sha256']=='b02747002f9b6109820d6c5d1bdb131acfa1a3933ca91acc6ce707e1ca0372fe'
          assert j[99]['record_sha256']=='c45d5460376793f13ba17381b9d9da3fa6eb2226fc6824b9eecfbcdc750e7404'
          assert j[99]['cycle_result']=='PASSED' and len(j[99]['evidence'])==6
          print('A100_ALL_100_RECORD_SHA_AND_SIX_NEW_SOURCE_FILE_HASHES_INDEPENDENT_PASS')
          PY
      - name: Verify original 1H C26-C30 frozen source Git blob IDs and C30 independent proof
        run: |
          python - <<'PY'
          import subprocess
          pins={
            'research/mtf-element-audit-v1/evidence/c26/C26_UNSWEPT_1H_FTA_ORIGINAL_SOURCE.json':'11edbf5ddf8e89e513fc3893e807903bbf8933eb',
            'research/mtf-element-audit-v1/evidence/c27/C27_ORIGINAL_1H_EQ_SESSION_SOURCE.json':'d434ae830858fecf5e45cf7ef8ff7db1e627d489',
            'research/mtf-element-audit-v1/evidence/c28/C28_ORIGINAL_1H_CLASSIC_IMB_FTA_SOURCE.json':'ed3aca9384c8e49d07220f04b7d363df92689317',
            'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json':'abd68cb7cb86087c83423d16e9bbdd2cb344224c',
            'research/mtf-element-audit-v1/evidence/c30/C30_ORIGINAL_PRIOR_WICK_IMB_CAUSAL_SOURCE.json':'ff57e0d99b5a87d74a2bfab0eed99cee32206812',
            'research/mtf-element-audit-v1/evidence/c30/C30_INDEPENDENT_RUN_WITNESS.json':'e835ae8de1d0ee0ed28a6323247d4c758c5f12df'}
          for p,w in pins.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert actual==w,(p,actual,w)
          print('A100_PREVIOUS_PINNED_SOURCE_RECEIPTS_EXACT_GIT_BLOB_PASS')
          PY
      - name: Execute 25 C30 strict known-before wick and IMB guards
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c30_causal_wick_liquidity_imb 2>&1 | tee /tmp/a100-negative.log
          grep -q 'Ran 25 tests' /tmp/a100-negative.log
      - name: Reload all 45 original Binance USD-M ZIP and compare complete frozen C30 case JSON
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c30_original_causal_wick_imb.py /tmp/a100-replay.json 2>&1 | tee /tmp/a100-replay.log
          python - <<'PY'
          import json
          a=json.load(open('research/mtf-element-audit-v1/evidence/c30/C30_ORIGINAL_PRIOR_WICK_IMB_CAUSAL_SOURCE.json'))
          b=json.load(open('/tmp/a100-replay.json'))
          assert a==b,'A100_ALL_45_ZIP_FULL_PINNED_JSON_DRIFT'
          assert a['original_binance_usdm_zip_count']==45
          assert a['native3m_original_rows']==76800
          assert a['native15m_exact_decimal_equalities']==15360
          t=a['totals']
          assert t['original_parent_edges']==539 and t['research_single_cases']==165
          assert t['original_closed_1h']==3840
          assert t['source_known_fractals']==1873 and t['source_classic_1h_imb']==646
          assert t['opposite_1h_pairs']==1989
          assert t['pairs_with_first_liquidity_wick']==690
          assert t['pairs_with_first_imb_wick']==330
          assert t['pairs_with_any_wick_interaction']==1758
          assert t['cases_with_first_liquidity_wick_link']==164
          assert t['cases_with_first_imb_wick_link']==158
          assert a['author_approved_trades']==0 and a['readiness']=='NOT_TRADE_READY'
          print('A100_ALL_45_ORIGINAL_FUTURES_ZIP_FIRST_WICK_SOURCE_CAUSAL_FULL_JSON_PASS')
          PY
      - name: Freeze independent all 100 SHA + 45 ZIP original source run success
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c30/A100_INDEPENDENT_RUN_WITNESS.json
          if test -e "$p"; then echo "independent already pinned"; exit 0; fi
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('research/mtf-element-audit-v1/evidence/c30/A100_INDEPENDENT_RUN_WITNESS.json')
          p.write_text(json.dumps({
            'schema':'EMBER_A100_100_SHA_45_ORIGINAL_ZIP_CAUSAL_WICK_V1',
            'run_id':int(os.environ['RUN_ID']),
            'trigger_commit_sha':os.environ['HEAD_SHA'],
            'A100_record_sha256':'c45d5460376793f13ba17381b9d9da3fa6eb2226fc6824b9eecfbcdc750e7404',
            'original_100_sha_records_verified':100,
            'c30_new_evidence_file_sha256_verified':6,
            'binance_original_zip_refetched':45,
            'native3m_original_rows':76800,
            'complete_pinned_json_equal':True,
            'negative_source_controls':25,
            'author_rb_snr_fta_bos_approved':0,
            'readiness':'NOT_TRADE_READY'
          },sort_keys=True,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(A100): independent 100 SHA and 45 original Futures ZIP causal wick replay"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
