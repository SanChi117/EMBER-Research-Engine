        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl
          git commit -m "A170: original 640 Binance 3m ZIP 41-trade evidence finds 12 stop 4H reclaim, 36 weak SNR and missing parent/child semantics; no trade change"
          git push origin HEAD:refs/heads/research/academic-engine-recovery-20261015
