          python-version: '3.12'
      - name: Verify old A169 and all new frozen 640 original source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/c107-sha169
          grep -Fq 'entries 169 tip_sha256 b0a2080fb4a91b56876a485921508f8afbf322d45f964e4b1fc3a0f268fb4cd2' /tmp/c107-sha169
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('evidence/c107/C107_ORIGINAL_NATIVE3M_20COIN_STRUCTURE_RECLAIM_DIAGNOSTIC.json').read_bytes()
          assert len(d)==308924 and hashlib.sha256(d).hexdigest()=='98adf5a7497f8a08feb7c035b12b9fb3a0ea23921cc7d0164b39fc8406bc4334'
          x=json.loads(d)
          assert x['source_zip_count']==640 and x['source_bars']==307200
          assert len(x['source_manifest'])==640 and len({(z['symbol'],z['date']) for z in x['source_manifest']})==640
          assert len(x['all_41_fixed_original_trade_diagnostics'])==41
          assert x['new_trading_rules']==x['new_indicators']==0
          assert x['orders']==x['fills']==x['live_trades']==[]
          a=x['cohorts'];n=a['COMBINED']
          assert a['C105']['n']==25 and a['C106']['n']==16 and n['n']==41
          assert n['stops']==25 and n['4h_valid_at_stop_bar_close']==12 and n['4h_invalidated_at_stop_bar_close']==13
          assert n['later_original_target_touched_after_real_stop']==8
          assert n['VC_type']=={'SNR':36,'IMB':5}
          assert n['h1_reaction_closed_inside_fvg']==15
          assert n['entry_beyond_parent_near_edge']==26
          assert n['wrong_direction_middle_4h_fvg']==0
          print('C107_640_FULL_ORIGINAL_CHECKSUMS_307200_3M_BARS_41_STOP_4H_SOURCE_AUDIT_PIN_SUCCESS')
          PY
