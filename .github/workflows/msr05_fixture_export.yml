name: MSR05 Frozen Original 19 CSV Export (research-only)
on:
  push:
    branches: [research/msr05-frozen-bos-and-blind-review-20261104]
  workflow_dispatch:
  pull_request:
    branches: [research/msr04-frozen-anchor-structure-replay-20261104]
permissions:
  contents: read
jobs:
  frozen-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable August 2026 CSV receipts
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          paths=sorted(Path("research/market_structure_replay_20261104/fixtures").glob("*_15m_20260801_20260816.csv"))
          assert len(paths)==19, f"expected 19 fixtures, got {len(paths)}"
          receipts=[]
          for path in paths:
              with path.open(newline="") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==1500, (path, len(rows))
              times=[int(r["time"]) for r in rows]
              assert all(times[i]-times[i-1]==900000 for i in range(1,len(times)))
              receipts.append(dict(name=path.name,sha256=hashlib.sha256(path.read_bytes()).hexdigest(),rows=len(rows)))
          context=Path("research/market_structure_replay_20261104/msr05_4h_context_only_20260720_20260816.csv")
          with context.open(newline="") as fp:
              h4=list(csv.DictReader(fp))
          assert len(h4)==3154 and len({x["symbol"] for x in h4})==19
          print("PASS: 3154 historical 4H context bars (never input to 15m signal recognizer)")
          Path("MSR05_SOURCE_RECEIPTS.json").write_text(json.dumps(receipts,indent=2))
          print("PASS 19 immutable real CSV fixtures, 28500 15m bars")
          PY
      - name: Upload unchanged 19 original OHLCV series
        uses: actions/upload-artifact@v4
        with:
          name: MSR05-FROZEN-ORIGINAL-19-CSV
          path: |
            research/market_structure_replay_20261104/fixtures/*_15m_20260801_20260816.csv
            MSR05_SOURCE_RECEIPTS.json
            research/market_structure_replay_20261104/msr05_4h_context_only_20260720_20260816.csv
          retention-days: 30
          if-no-files-found: error
