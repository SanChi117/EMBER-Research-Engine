name: MTF A094 C24 Fail Closed BOS Source Journal
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-a094-c24-source-journal-proof.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a094-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify full source SHA chain A094
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py > /tmp/a094-chain.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/a094-chain.json'))
          assert a['events']>=94 and a['validations_pass']
          j=[json.loads(x) for x in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if x.strip()]
          assert j[92]['action_id']=='A093'
          assert j[93]['action_id']=='A094' and j[93]['seq']==94
          assert j[93]['record_sha256']=='6e748d8aea6417f0dad00665a2f471c5a89ffe1cab97780d33ce2ddfecb0f9cf'
          assert len(j[93]['evidence'])==5
          print('A094_94_SHA_CHAIN_AND_C24_FIVE_EVIDENCE_FILES_PASS')
          PY
      - name: Recheck original C24 frozen receipt Git blob and six guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c24/C24_ORIGINAL_3M_FAIL_CLOSED_ADMISSION.json)" = "163a0a41a9e5b51320e8f4baaad85cfd0be7c0a9"
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c24_bos_research_admission_gate 2>&1 | tee /tmp/a094-tests.log
          grep -q 'Ran 6 tests' /tmp/a094-tests.log
      - name: Re-download all original 45 source ZIP and verify no-approved 3m routes
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c24_author_bos_failclosed_45zip.py /tmp/a094-original.json 2>&1 | tee /tmp/a094-original.log
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a094-original.json'))
          assert x['original_zip']==45 and x['native3m_closed']==76800
          assert x['native15m_equalities']==15360
          t=x['totals']
          assert t['total_original_research_edges']==539
          assert t['multiple_pivot_refused']==242
          assert t['multiple_parent_refused']==120
          assert t['no_intact_pivot_refused']==12
          assert t['single_research_without_author_labels']==165
          assert x['author_approved_trades']==0 and x['readiness']=='NOT_TRADE_READY'
          print('A094_C24_ORIGINAL_45ZIP_374_REJECTED_165_RESEARCH_ONLY_PASS')
          PY
