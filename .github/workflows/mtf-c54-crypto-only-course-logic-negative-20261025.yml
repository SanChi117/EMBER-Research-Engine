name: EMBER C54 CRYPTO-ONLY course illustration to original Binance USD-M source 49 negatives
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c54-crypto-only-course-logic-negative-20261025.yml'
      - 'research/mtf-element-audit-v1/d05/c54_crypto_only_course_logic_source_bridge.py'
      - 'research/mtf-element-audit-v1/d05/test_c54_crypto_only_course_logic_source_bridge.py'
permissions:
  contents: read
jobs:
  crypto_only_negative:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Verify frozen historical A122 and C46 C47 native crypto 45ZIP raw sources
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/A122.txt
          grep -Fq 'entries 122 tip_sha256 5cd047c7ab3afff3b099766d77f4d11bd882c14d6a023361942048afcad4b428' /tmp/A122.txt
          python tests/test_journal_integrity.py | tee /tmp/A122full.txt
          grep -Fq '"validations_pass": true' /tmp/A122full.txt
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json)" = 'dc03c181912ffbb800bc191fbc16ec0d05c335e0'
          test "$(git rev-parse HEAD:research/mtf-element-audit-v1/evidence/c47/C47_ORIGINAL_4H_FIRST_CONTACT_TO_LATER_1H_IMB_45ZIP.json)" = 'b2727f081d8a73f522a97a54b4582507ee969244'
      - name: Run 49 independent no-FX-chart-derived crypto source and A B C academy route logic negatives
        shell: bash
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c54_crypto_only_course_logic_source_bridge 2>&1 | tee /tmp/C54neg.txt
          grep -Fq 'Ran 49 tests' /tmp/C54neg.txt
          grep -qx 'OK' /tmp/C54neg.txt
          ! grep -q 'skipped=' /tmp/C54neg.txt
