name: MTF B1 C29 — 45 Original 1H RB/SNR Prerequisite Source (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c29-original-pairs-45zip.yml'
      - 'research/mtf-element-audit-v1/d05/c29_rb_snr_source_guards.py'
      - 'research/mtf-element-audit-v1/tests/probe_c29_original_1h_rb_snr_source_gate.py'
      - 'research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-c29-source-first-pin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve C26-C28 original pinned Git SHA and A098 journal
        run: |
          python - <<'PY'
          import subprocess,json
          pins={
            'research/mtf-element-audit-v1/evidence/c26/C26_UNSWEPT_1H_FTA_ORIGINAL_SOURCE.json':'11edbf5ddf8e89e513fc3893e807903bbf8933eb',
            'research/mtf-element-audit-v1/evidence/c27/C27_ORIGINAL_1H_EQ_SESSION_SOURCE.json':'d434ae830858fecf5e45cf7ef8ff7db1e627d489',
            'research/mtf-element-audit-v1/evidence/c28/C28_ORIGINAL_1H_CLASSIC_IMB_FTA_SOURCE.json':'ed3aca9384c8e49d07220f04b7d363df92689317'}
          for p,w in pins.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              assert actual==w,(p,actual,w)
          j=[json.loads(s) for s in open('research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if s.strip()]
          assert len(j)==98 and j[-1]['action_id']=='A098'
          assert j[-1]['record_sha256']=='292eece6faea4de832b825d0b76c280932d5ece14bcb37bfaa3e1abbf6bbcddc'
          print('C29_PREDECESSOR_IMMUTABLE_98_SHA_PASS')
          PY
      - name: Separate 24 negative no author RB/SNR test controls
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c29_rb_snr_source_guards 2>&1 | tee /tmp/c29-controls.log
          grep -q 'Ran 24 tests' /tmp/c29-controls.log
      - name: Reload original 45 USD-M ZIP and reconstruct native 1H source pairs
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c29_original_1h_rb_snr_source_gate.py /tmp/c29-original.json 2>&1 | tee /tmp/c29-original.log
      - name: Refuse all author approval and source data drift
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/c29-original.json'))
          t=x['totals']
          assert x['original_archive_count']==45
          assert x['original_native3m_source_rows']==76800
          assert x['native15m_exact_decimal_equalities']==15360
          assert t['source_hours']==3840 and t['original_parent_edges']==539
          assert t['research_single_cases']==165
          assert t['case_preknown_technical_follow_through_relations']<=t['case_preknown_pair_relations']
          assert x['author_positive_rb_examples']==x['author_positive_snr_examples']==0
          assert x['author_selected_first_fta']==x['author_trades_approved']==0
          assert x['readiness']=='NOT_TRADE_READY'
          print('C29_45_ORIGINAL_ZIP_SOURCE_COLOR_PAIR_HYPOTHESES_ONLY_PASS')
          PY
      - name: Upload complete per-case C29 JSON
        uses: actions/upload-artifact@v4
        with:
          name: c29-45zip-native-hour-color-pair-causal-research
          path: /tmp/c29-original.json
          retention-days: 30
      - name: Freeze C29 first verified original-source-only JSON
        if: success()
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c29/C29_ORIGINAL_PAIR_GATES_NOT_RB_SNR.json
          if test -e "$p"; then echo "Existing complete pinned JSON verified"; exit 0; fi
          mkdir -p "$(dirname "$p")"
          cp /tmp/c29-original.json "$p"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "evidence(C29): pinned original 45-ZIP hour color pair non-RB/SNR source"
          git pull --rebase origin research/academic-engine-recovery-20261015
          git push origin HEAD:research/academic-engine-recovery-20261015
