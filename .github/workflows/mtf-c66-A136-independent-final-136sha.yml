name: EMBER C66 independent final all 136 SHA six native15m crypto source evidence 33x3
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c66-A136-independent-final-136sha.yml'
      - 'research/mtf-element-audit-v1/ЖУРНАЛ_ДЕЙСТВИЙ.jsonl'
permissions:
  contents: read
jobs:
  audit136:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independently verify 136 SHA, six new original 45ZIP native15m source evidence, all old SHA blobs and 33 guards
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1
          python tools/auditlog.py verify | tee /tmp/A136
          grep -Fq 'entries 136 tip_sha256 03f5277ae06bc2249e90b92669ca9dc222d73eb5ebf047ae3406eebd082bafea' /tmp/A136
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          records=[json.loads(x) for x in Path('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl').read_text().splitlines()]
          assert len(records)==136
          prev,last=records[-2:]
          assert prev['action_id']=='A135' and prev['record_sha256']=='76014ca82efd4ddb4d40da272fd54b514310d370fce90a8ccb22064b9a6b6787'
          assert last['action_id']=='A136' and last['seq']==136 and last['prev_sha256']==prev['record_sha256']
          assert last['record_sha256']=='03f5277ae06bc2249e90b92669ca9dc222d73eb5ebf047ae3406eebd082bafea'
          assert last['cycle']=='B1/C66' and last['verdict']=='DONE' and last['cycle_result']=='PASSED'
          expected={"d05/c66_native15m_route_a_source_event_chain.py":"fc29fa0926101a9f800a794ff0c64521c80eb9ccbfaf592087f6910b0ea3fd4b","d05/test_c66_native15m_route_a_source_event_chain.py":"5fcec0be01bb1f2bc26a51f66b4da41ed4a2cd40e156bb744e897d1ba4bb15ae","tests/probe_c66_original45zip_4h1h_to_native15m_route_a_source.py":"b74449133d6f90dd3d72164655b82e87f716259114b45b648dec57eab2f7ff8a","evidence/c66/C66_ORIGINAL45ZIP_4H1H_TO_NATIVE15M_SOURCE_FIRST_ANY_ROUTE_A.json":"23c6eaac7ebcd3f9cd447f9a3690da023d6fc30e50f03e48f57c5037bff15bd3","evidence/c66/C66_INDEPENDENT_45ZIP_4H1H_NATIVE15M_ROUTE_A_WITNESS_20261025.json":"20105d3453455ac837fc2406d4210ce2290c1acd4d3dd08d419d97d578d8d557","cycles/B1_C66_ORIGINAL_NATIVE15M_ROUTE_A_FIRST_ANY_SOURCE_REPORT.md":"9d5f24e365c57d3f33cc6640e122f0e0ca72c8ea088d6ec42c1600ad0cea7767"}
          assert len(last['evidence'])==6 and {z['path'] for z in last['evidence']}==set(expected)
          for z in last['evidence']:
            data=Path(z['path']).read_bytes()
            assert len(data)==z['bytes']
            assert hashlib.sha256(data).hexdigest()==z['sha256']==expected[z['path']]
          previous={"evidence/c46/C46_ORIGINAL_4H_CLASSIC_IMB_FIRST_NATIVE3M_CONTACT_45ZIP.json":"dc03c181912ffbb800bc191fbc16ec0d05c335e0","evidence/c47/C47_ORIGINAL_4H_FIRST_CONTACT_TO_LATER_1H_IMB_45ZIP.json":"b2727f081d8a73f522a97a54b4582507ee969244","evidence/c55/C55_ORIGINAL_45ZIP_ROUTE_C_1H_RAID_3M_BOS_4ADAPTED_SOURCE.json":"2b4f944ddbdff0871a7fd553de2ab9955d220b91","evidence/c56/C56_ORIGINAL_60ZIP_SAME_1H_PARENT_3M_NATIVE5M_COMPLETE_SOURCE.json":"98f087a731d30c2191dc443038c371751456f316","evidence/c57/C57_ORIGINAL_45ZIP_4H_FIRST_CONTACT_LATER_1H_THEN_FIRST_ANY_NATIVE15M_IMB.json":"08f24050d19bb390cf2985a901e2a8f2ea3c0ec3","evidence/c58/C58_ORIGINAL_45ZIP_PREKNOWN_UNSWEPT_1H_FRACTAL_INSIDE_4H_FIRST_CONTACT.json":"06f2ff7decd2aa9660381947d3cf43f6b722cd8e","evidence/c59/C59_FROZEN_3_ORIGINAL_CRYPTO_SOURCES_4H1H_NESTING_AND_STRONGHL_TEXT_AUDIT.json":"46077ffb3495c14c906963156dd4a93c7acf9911","evidence/c60/C60_ORIGINAL45ZIP_4H_IMB_FIRST_AND_RETURN_SOURCE_NATIVE3M_EPISODES.json":"899373e4a1dc1999d1485ac8c1f790d39071aebd","evidence/c61/C61_ORIGINAL45ZIP_DAILY_PRIOR_POI_FIRST_VISIT_STRONGHL_SOURCE_AUDIT.json":"305624e592f55bd699e94e45f4316e4efabdb726","evidence/c62/C62_ORIGINAL_45ZIP_1H_SNR_RB_MB_IMB_LIQUIDITY_COMPLETE_SOURCE.json":"8428bf7d6cd3bc26f617cfc32a34c91a27c813b2","evidence/c63/C63_ORIGINAL45ZIP_FIRST_ANY_CLOSED1H_SOURCE_AFTER_4H_FIRST_NATIVE3M_CONTACT.json":"fdc77c7ec942f03b4efae83b935d994c8435a24f","evidence/c64/C64_ORIGINAL45ZIP_STRICT_SOURCE_EXTREME_PRECONFIRM_POST_WICK_CLOSE_INVALIDATION.json":"f70b0493a0c4964c618c09c75fee900dd65f5c05","evidence/c65/C65_ORIGINAL45ZIP_OF_SOURCE_LAST_LINK_HTF_TARGET_FIRST_ANY_INVALIDATION.json":"791f20fcf0a8d6c4697f02fd7247b45cfd4b6de5"}
          for p,blob in previous.items():
            assert subprocess.check_output(['git','rev-parse','HEAD:research/mtf-element-audit-v1/'+p],text=True).strip()==blob
          p=Path('evidence/c66/C66_ORIGINAL45ZIP_4H1H_TO_NATIVE15M_SOURCE_FIRST_ANY_ROUTE_A.json')
          assert p.stat().st_size==3295302
          q=json.loads(p.read_bytes())
          assert q['original_sha_checked_zip']['total']==45
          assert q['original_native3m_closed']==76800 and q['original_native15m_closed']==15360
          assert q['original_native1d_closed']==160 and q['derived_closed1h']==3840
          assert q['original_4h_c46_contexts']==153
          assert q['source_15m_event_type_totals']=={
            '15M_CLASSIC_IMB_SOURCE_ONLY':3048,
            '15M_SNR_LIQUIDITY_SOURCE_ONLY':514,
            '15M_SNR_PRIOR_IMB_SOURCE_ONLY':1209}
          assert q['source_4h1h15m_first_any_route_a_counts']=={
            '1H_KIND_UNRESOLVED_NO_OWNER_TRIGGER_VC':0,
            'AMBIGUOUS_1H_SOURCE_DIRECTION':7,
            'FIRST_ANY_15M_SOURCE_BOTH_DIRECTIONS':0,
            'FIRST_ANY_15M_SOURCE_OPPOSITE_DIRECTION':35,
            'FIRST_ANY_15M_SOURCE_SAME_DIRECTION':29,
            'NO_15M_SOURCE_CANDIDATE_FULL_WINDOW':0,
            'NO_15M_SOURCE_CANDIDATE_RIGHT_CENSORED':0,
            'NO_4H_FIRST_SOURCE_TOUCH':21,
            'NO_FIRST_CLOSED_1H_SOURCE_EVENT':0,
            'OPPOSITE_1H_SOURCE_DIRECTION':61}
          assert q['author_final_entry_approved']==q['author_vc_15m_confirmed']==0
          assert q['orders']==q['trades']==q['fills']==0 and q['readiness']=='NOT_TRADE_READY'
          print('C66_INDEPENDENT_FINAL_136_SHA_SIX_SOURCE_OLD_ORIGINAL_GIT_BLOBS_PASS')
          PY
          cd d05
          python -m unittest -v test_c66_native15m_route_a_source_event_chain 2>&1 | tee /tmp/C66
          grep -Fq 'Ran 33 tests' /tmp/C66
          grep -qx 'OK' /tmp/C66
          ! grep -q 'skipped=' /tmp/C66
