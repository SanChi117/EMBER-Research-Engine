name: MTF A064 - Verify GitHub-Anchored 64 Proof Entries
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths: ['.github/workflows/mtf-a064-proof-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-immutable-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact A064 journal hash and all historical evidence
        working-directory: research/mtf-element-audit-v1
        run: |
          set -euo pipefail
          python tools/auditlog.py verify
          python tests/test_journal_integrity.py >/tmp/a064-github-proof.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/a064-github-proof.json'))
          assert x['events']==64 and x['validations_pass']
          a=[json.loads(s) for s in open('ЖУРНАЛ_ДЕЙСТВИЙ.jsonl',encoding='utf8') if s.strip()]
          assert a[-1]['action_id']=='A064'
          assert a[-1]['record_sha256']=='6ee96bf746efcb4802dc0a523d3c83c556d10d9d55789a1d9291fe5d8b34f00e'
          assert a[-1]['observed_result'].endswith('zero academic patterns approved or Trade Plans')
          print('A001_A064_GITHUB_SHA_PROOFS_ACCEPTED',x['tip_sha256'])
          PY
      - name: Rerun 79 technical tests and immutable primitive blob hashes
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/tools/strict_event_lineage_d03.py)" = 16163fb8a08439d8d3b8e5f42c4cc16b82c1c28e
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/a064-v05.txt
          grep -q 'Ran 29 tests' /tmp/a064-v05.txt
          grep -Eq '^OK$' /tmp/a064-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_b1_course_d03_compatibility test_poi_touch_observer_b1 test_poi_price_lineage_b1 2>&1 | tee /tmp/a064-b1.txt
          grep -q 'Ran 50 tests' /tmp/a064-b1.txt
          grep -Eq '^OK$' /tmp/a064-b1.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-a064-read-only-64-entry-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/a064-github-proof.json
            /tmp/a064-v05.txt
            /tmp/a064-b1.txt
