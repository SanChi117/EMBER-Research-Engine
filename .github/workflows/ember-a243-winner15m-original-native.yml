name: A243 Winner15m Original 100 USDT BTC ETH Binance Futures Native
on:
  push:
    branches: ['research/a243-winner15m-original-native-20261031']
    paths:
      - 'research/a243_winner_original/**'
      - '.github/workflows/ember-a243-winner15m-original-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winner_author_native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FREQTRADE__EXCHANGE__KEY: ""
      FREQTRADE__EXCHANGE__SECRET: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin Freqtrade same native 2025.11 release as original Docker service
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'freqtrade==2025.11' technical pandas pyarrow
          python -m freqtrade --version
          python -m pip freeze > research/a243_winner_original/a243_environment.txt
      - name: Original winner strategy Git blob and genuine Binance USD-M 2023 Nov through 2026 May price mark funding
        run: python -m research.a243_winner_original.a243_prepare_data
      - name: Native unchanged original Winner15m source and original bt.json economic 6 runs
        run: python -m research.a243_winner_original.a243_run_originals
      - name: Preserve SHA receipts and native trade ZIPs even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a243-winner15m-author-btceth-native
          path: |
            research/a243_winner_original/a243_environment.txt
            research/a228_five_original/generated/A228_ORIGINAL_AND_MARKET_RECEIPTS.json
            research/a228_five_original/generated/native_backtests_a243/**
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
