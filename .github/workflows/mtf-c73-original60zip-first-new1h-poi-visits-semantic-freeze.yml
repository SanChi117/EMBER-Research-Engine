name: EMBER C73 original60 ZIP 3m first new1h POI visit episodes before 15m semantic gate
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-c73-original60zip-first-new1h-poi-visits-semantic-freeze.yml'
      - 'research/mtf-element-audit-v1/tests/probe_c73_original60zip_new1h_poi_3m_visits_semantic_split.py'
permissions:
  contents: write
concurrency:
  group: c73-original60-poi-first-visit
  cancel-in-progress: false
jobs:
  original60:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard old immutable A142 and original C71 C72 full source frozen git sha
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          cd "$R"
          python tools/auditlog.py verify | tee /tmp/A142
          grep -Fq 'entries 142 tip_sha256 347507f363d03a3bde2008a5690976ec3110925cc0ac514c1a6434299848059f' /tmp/A142
          python tests/test_journal_integrity.py | grep -Fq '"validations_pass": true'
          cd ../..
          test "$(git rev-parse HEAD:$R/evidence/c71/C71_ORIGINAL45ZIP_3M_CONTACT_THEN_FIRST_ANY_15M_VC_OR_1H_BOS_SOURCE.json)" = ef05ecdcfb31e59dec79d10eb5d3dc40b3c3af97
          test "$(git rev-parse HEAD:$R/evidence/c72/C72_ORIGINAL60ZIP_NATIVE5M_15M_PARITY_AFTER_C71_SOURCE_VC.json)" = 19b7e0357600b70b3f26467339a417e0f99a1302
      - name: Binance 60 original SHA ZIP independent 3m 5m 15m 1d 32d first POI visit episodes before future source15m pattern, all C46-C72 frozen
        run: |
          set -euo pipefail
          R=research/mtf-element-audit-v1
          python "$R/tests/probe_c73_original60zip_new1h_poi_3m_visits_semantic_split.py" /tmp/C73-original.json >/tmp/C73-original.log 2>&1 || { tail -c 23000 /tmp/C73-original.log; exit 1; }
          tail -c 3200 /tmp/C73-original.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/C73-original.json');d=json.loads(p.read_bytes())
          assert d['original_zip_counts']['total']==60 and d['original_zip_counts']['new_native5m']==15
          assert d['original_native3m_closed']==76800 and d['original_native5m_closed']==46080
          assert d['native5m_to_native15m_original_decimal_equalities']==15360
          assert d['original_native15m_closed']==15360 and d['original_native1d_closed']==160
          assert d['source_4h_C46_parent_count']==153
          assert sum(d['original3m_new1h_poi_first_visit_source_state_totals'].values())==153
          assert d['author_verified_original3m_first_valid_1h_poi_test']==0
          assert d['author_verified_routeA_15m_trigger_or_15m_vc_split']==0
          assert d['orders']==d['fills']==d['trades']==0 and d['readiness']=='NOT_TRADE_READY'
          print('C73_FIRST_COMPLETE_ORIGINAL60_BYTES',p.stat().st_size)
          print('C73_FIRST_COMPLETE_ORIGINAL60_SHA',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c73-original60-first-poi-source-visits
          path: /tmp/C73-original.json
          if-no-files-found: error
  tests30:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 30 strict first original3m continuous-vs-separate POI revisit/owner grade guards
        run: |
          set -euo pipefail
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c73_new1h_poi_original3m_visit_episodes_route_split 2>&1 | tee /tmp/C73
          grep -Fq 'Ran 30 tests' /tmp/C73
          grep -qx 'OK' /tmp/C73
  freeze:
    needs: [original60,tests30]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c73-original60-first-poi-source-visits
          path: /tmp/C73
      - name: Freeze only if all 60 original crypto ZIP and all 30x3 negative tests pass
        run: |
          set -euo pipefail
          p=research/mtf-element-audit-v1/evidence/c73/C73_ORIGINAL60ZIP_FIRST_SOURCE_1H_POI_NATIVE3M_VISIT_EPISODES_ROUTE_SPLIT.json
          if test -e "$p"; then cmp -s "$p" /tmp/C73/C73-original.json; exit 0; fi
          mkdir -p "$(dirname "$p")"
          cp /tmp/C73/C73-original.json "$p"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          git commit -m 'evidence(C73): genuine original60 ZIP repeated raw3m new1h POI visit episodes before 15m pattern no owner first VALID test'
          for n in 1 2 3 4 5; do
            git fetch origin research/academic-engine-recovery-20261015
            git rebase origin/research/academic-engine-recovery-20261015
            if git push origin HEAD:research/academic-engine-recovery-20261015; then exit 0; fi
            sleep 2
          done
          exit 1
