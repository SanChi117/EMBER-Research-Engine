name: MTF B1 C15 — Closed 1D 4H 1H 15m 5m Futures Source Grid (PAPER)
on:
  push:
    branches: [research/academic-engine-recovery-20261015]
    paths:
      - '.github/workflows/mtf-b1-c15-mtf-source-grid.yml'
      - 'research/mtf-element-audit-v1/d05/c15_closed_multi_tf_source_grid.py'
      - 'research/mtf-element-audit-v1/d05/test_c15_closed_multi_tf_source_grid.py'
      - 'research/mtf-element-audit-v1/tests/probe_c15_original_full_tf_grid.py'
      - 'research/mtf-element-audit-v1/evidence/c15/C15_F06_5M_NATIVE_15M_DERIVED_1D_4H_SOURCE_RECEIPT.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-timeframe-original-source-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve 5m raw F06 and unchanged academic primitives
        run: |
          set -euo pipefail
          test "$(git hash-object research/mtf-course-v05/src/course_primitives_v05.py)" = 45cec7fd66d0ec156bc0a38225ee282c6d3ee71b
          test "$(git hash-object research/mtf-element-audit-v1/evidence/f06/F06_FIVE_SYMBOL_TWO_DAY_5M_SOURCE_RECEIPTS.json)" = a5bf2105d1c611517a8d127d5e1f8cb622720162
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c15/C15_F06_5M_NATIVE_15M_DERIVED_1D_4H_SOURCE_RECEIPT.json)" = 696065b29bbe45f5f4fdd0bf8042c4f5781c170d
          test "$(git hash-object research/mtf-element-audit-v1/evidence/c13/C13_DUAL_SOURCE_BOS_POI_DIAGNOSTICS.json)" = c699926be9f2550b6ecdc6a371de3b63c38d325d
          test "$(git hash-object research/mtf-element-audit-v1/d05/C14_AUTHOR_STRONGHL_QUALITATIVE_CASES.json)" = 82a80b053712ee819ceb7d83178f672db4030462
      - name: Rerun 29 native academic v05 and 32 new negative MTF time source cases
        run: |
          set -euo pipefail
          python -m unittest -v research/mtf-course-v05/tests/test_course_primitives_v05.py 2>&1 | tee /tmp/c15-v05.txt
          grep -q 'Ran 29 tests' /tmp/c15-v05.txt
          grep -Eq '^OK$' /tmp/c15-v05.txt
          cd research/mtf-element-audit-v1/d05
          python -m unittest -v test_c15_closed_multi_tf_source_grid 2>&1 | tee /tmp/c15-tests.txt
          grep -q 'Ran 32 tests' /tmp/c15-tests.txt
          grep -Eq '^OK$' /tmp/c15-tests.txt
          echo '61_SOURCE_CLOSED_MTF_TESTS_PASS_NO_AUTHOR_GOLDEN_READY'
      - name: Fetch ten original 5m plus ten native original C08 15m ZIPs and cross-check all 1D 4H 1H 15m closed OHLCV
        run: |
          set -euo pipefail
          python research/mtf-element-audit-v1/tests/probe_c15_original_full_tf_grid.py /tmp/c15-original.json 2>&1 | tee /tmp/c15-real.log
          python - <<'PY'
          import json
          q=json.load(open('/tmp/c15-original.json'))
          assert q['source_5m_zip_archives']==10
          assert q['source_native_15m_c08_zip_archives']==10
          assert q['raw_original_5m_bars']==2880
          assert [q[k] for k in (
              'original_15m_parity_checks',
              'derived_1h_vs_original_15m_checks',
              'derived_4h_vs_original_15m_checks',
              'derived_1d_vs_original_15m_checks')]==[960,240,60,10]
          assert q['all_timeframe_ohlcv_checks']==1270
          assert q['native_1d_4h_archive_claims']==0
          assert q['author_goldens_for_1d_4h_source_context']==0
          assert q['trade_ready'] is False
          assert all(d['first_1d_count_as_of_second_day_plus_1h']==1 for d in q['observations'])
          print('C15_20_ORIGINAL_5M_AND_15M_ZIPS_1270_PARITY_AND_NO_1D_HTF_ENTRY_APPROVAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtf-b1-c15-original-raw-source-futures-mtf-proof
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/c15-v05.txt
            /tmp/c15-tests.txt
            /tmp/c15-original.json
            /tmp/c15-real.log
