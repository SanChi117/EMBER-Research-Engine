name: "EMBER A202 original dip_catcher 5m Binance 4-pair two-fee native falsification"
on:
  push:
    branches: [research/a202-dipcatcher-original-native-screen-20261031]
    paths:
      - ".github/workflows/ember-a202-dipcatcher-original-5m-native.yml"
      - "research/native_candidate_screen_20261031/a202_*.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-original-dipcatcher-a202:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native Freqtrade, exact original source, and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'freqtrade==2026.4' technical 'pandas-ta==0.4.71b0'
          python -c "from importlib.metadata import version; assert version('freqtrade')=='2026.4'"
          git init -q /tmp/a202-original
          git -C /tmp/a202-original -c credential.helper= fetch -q --depth 1 https://github.com/viktors1982/trading.git e572140b1b8cb550cb244c67d363087b81bd4ab8
          git -C /tmp/a202-original checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/a202-original rev-parse HEAD)" = e572140b1b8cb550cb244c67d363087b81bd4ab8
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/a202-original')
          p=root/'freqtrade/strategies/dip_catcher.py'
          raw=p.read_bytes()
          gitblob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert gitblob=='76ab2b3f91dc7beaa0be8021a245caa2b3f4186f',gitblob
          out=Path('a202-dipcatcher');out.mkdir(exist_ok=True)
          (root/'user_data/backtest_results').mkdir(parents=True,exist_ok=True)
          for sym in ('BTC','ETH','SOL','LINK'):
              cfg={'bot_name':f'A202_dip_catcher_{sym}_OFFLINE_RESEARCH_ONLY',
                'dry_run':True,'dry_run_wallet':1000,
                'stake_currency':'USDT','stake_amount':100,'tradable_balance_ratio':0.99,
                'max_open_trades':1,'trading_mode':'futures','margin_mode':'isolated',
                'exchange':{'name':'binance','key':'','secret':'','password':'',
                    'ccxt_config':{},'ccxt_async_config':{},'pair_whitelist':[f'{sym}/USDT:USDT'],'pair_blacklist':[]},
                'pairlists':[{'method':'StaticPairList'}],
                'telegram':{'enabled':False,'token':'','chat_id':'0'},
                'api_server':{'enabled':False,'listen_ip_address':'127.0.0.1','listen_port':8080,
                              'username':'a202','password':'offline-no-api'}}
              (out/f'config-{sym}.json').write_text(json.dumps(cfg,indent=2))
          print('A202_PINNED_AUTHOR_DIPCATCHER_SOURCE_VALIDATED',gitblob)
          PY
      - name: Rebuild authentic A195 1h Binance Futures mark and funding data
        shell: bash
        run: |
          set -euo pipefail
          python research/doublema_native_oos_20261031/a195_prepare_crosspair.py --datadir a202-dipcatcher/data 2>&1 | tee a202-dipcatcher/real-1h-mark-funding.log
          grep -Fq A195_ALL_4_SYMBOLS_CONTINUOUS_SOURCE_QUALITY_OK a202-dipcatcher/real-1h-mark-funding.log
      - name: Rebuild authentic A196 5m Binance Futures price candles
        shell: bash
        run: |
          set -euo pipefail
          python research/doublema_native_oos_20261031/a196_prepare_real_5m_detail.py --datadir a202-dipcatcher/data 2>&1 | tee a202-dipcatcher/real-5m-source.log
          grep -Fq A196_FOUR_TRUE_5M_BINANCE_DATASETS_INTEGRITY_PASS a202-dipcatcher/real-5m-source.log
      - name: Eight original native Freqtrade source-pinned 5m backtests
        shell: bash
        run: |
          set -euo pipefail
          for sym in BTC ETH SOL LINK; do
            for scenario in 5 12p5; do
              if [ "$scenario" = '5' ]; then rate=0.0005; else rate=0.00125; fi
              echo "A202_ORIGINAL_NATIVE_BEGIN dip_catcher $sym $scenario"
              timeout 480s python research/native_candidate_screen_20261031/a199_native_original_futures_offline.py \
                -c "a202-dipcatcher/config-$sym.json" \
                --userdir /tmp/a202-original/user_data \
                --datadir "$GITHUB_WORKSPACE/a202-dipcatcher/data" \
                --strategy-path /tmp/a202-original/freqtrade/strategies \
                --strategy dip_catcher --timeframe 5m \
                --timerange 20260513-20261001 --data-format-ohlcv json \
                --fee "$rate" --export trades --cache none \
                2>&1 | tee "a202-dipcatcher/dip_catcher-$sym-fee$scenario.log"
              z="$(find /tmp/a202-original/user_data/backtest_results -maxdepth 1 -type f -name 'backtest-result*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
              test -n "$z" && test -s "$z"
              cp "$z" "a202-dipcatcher/dip_catcher-$sym-fee$scenario.zip"
              rm -f /tmp/a202-original/user_data/backtest_results/backtest-result*.zip
              echo "A202_ORIGINAL_NATIVE_COMPLETE dip_catcher $sym $scenario"
            done
          done
      - name: Verify all eight native trade archives and predeclared gates
        shell: bash
        run: |
          set -euo pipefail
          python research/native_candidate_screen_20261031/a202_verify_dipcatcher_native.py --results a202-dipcatcher 2>&1 | tee a202-dipcatcher/A202-native-verification.log
          grep -Fq A202_EIGHT_TRUE_NATIVE_ORIGINAL_SOURCE_TRADE_ARCHIVES_VERIFIED a202-dipcatcher/A202-native-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A202-DipCatcher-8-Original-Futures-Native-Freqtrade-Real-Binance
          path: |
            a202-dipcatcher/*.log
            a202-dipcatcher/*.zip
            a202-dipcatcher/A202_EIGHT_NATIVE_DIPCATCHER_TRADE_RECEIPTS_VERIFIED.json
            a202-dipcatcher/data/A195_DATA_SHA_MANIFEST.json
            a202-dipcatcher/data/A196_REAL_5M_SHA_MANIFEST.json
          retention-days: 30
