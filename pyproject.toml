[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-research-engine"
version = "0.2.0"
description = "Research-only crypto strategy engine with zero-look-ahead validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "polars>=1.0,<2",
  "pydantic>=2.6,<3",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.98,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
ember-demo = "ember.cli:run_demo"
ember-paper-server = "ember.cli:run_paper_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["ember*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
