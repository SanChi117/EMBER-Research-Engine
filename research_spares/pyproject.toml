[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-research-spares"
version = "0.2.0"
description = "Installable offline plug-and-play research parts for EMBER; zero orders"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ember_spares*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ember-spares = "ember_spares.plugin:main"
